uhige Abend vor der Silvesternacht, abends kein Fahren mehr."}]},{"iso":"2026-12-31","dt":"Do 31.12.","title":"Silvester auf Samui","route":{"walk":false,"drive":true,"mode":"🍾 Abendprogramm · Taxi vorbuchen","lead":"Tagsüber Pool und Strand, abends Gala-Dinner oder Villa-Dinner, um Mitternacht Feuerwerk. Wichtigste Regel: nicht selbst fahren.","wxi":"🎆"},"items":[{"nm":"Lamai Beach (Feuerwerk)","cat":"beach","nt":"Nächstes öffentliches Feuerwerk zur Villa","map":"Lamai Beach","src":"v","ll":[9.46242,100.05221],"addr":"Lamai Beach","time":"23:30","info":{"d":"Feuerwerke gibt es (größte zuerst) in Chaweng, Bophut, Lamai, Maenam, Choeng Mon – Lamai ist von der Villa 5 Minuten entfernt.","t":"Gegen 23:30 einen Platz am Nordteil des Strands suchen; vorbestellten Fahrer für ~00:30 zum vereinbarten Treffpunkt bestellen."}},{"nm":"Fisherman's Village (Party)","cat":"street","nt":"Gehobenere Silvester-Party mit DJs und Feuershows","map":"Fisherman's Village Bophut","src":"v","ll":[9.55898,100.03151],"addr":"Bophut","noroute":true,"info":{"d":"Alternative zu Lamai; ~13 km, ~30 Min Fahrt – Rückfahrt nach Mitternacht vorab organisieren.","t":"Nur mit fest gebuchtem Fahrer für beide Wege – nach Mitternacht ist auf der Nordküste kaum ein Wagen frei."}},{"nm":"Beach Republic","cat":"bar","nt":"Beach-Club am Nordende von Lamai – Silvesterprogramm zu prüfen","map":"Beach Republic Koh Samui","src":"c","ll":[9.47204,100.06242],"addr":"Lamai Nord","noroute":true}],"flow":[{"seg":"☀️ Tag · Villa & Strand"},{"about":{"t":"Silvestertag","x":"Der Tag vor der langen Nacht sollte ruhig sein. Spätes Frühstück auf der Terrasse, Pool und am Nachmittag eine Thai-Massage in einem der Salons im Lamai-Zentrum. Getränke und Snacks für den Abend vor 14 Uhr kaufen, danach ruht der Alkoholverkauf bis 17 Uhr. Gegen Abend Fahrer und Treffpunkt für die Rückfahrt nach Mitternacht noch einmal bestätigen."}},{"note":"💡 Spätes Frühstück, Pool, nachmittags 1 Std Thai-Massage in Lamai."},{"seg":"🎆 Abend · Silvester (ab ~19:30)"},{"about":{"t":"Silvester auf Samui","x":"Silvester ist die vollste Nacht des Jahres. In Chaweng steigt die größte Party mit DJs und Feuershows, Fisherman's Village ist die etwas gehobenere Variante, Lamai und Maenam sind entspannter. Viele Hotels veranstalten Gala-Dinner mit Feuerwerk. Diese sind oft schon Mitte Dezember ausgebucht, Hotelrestaurants bevorzugen eigene Gäste. Preise mit „++“ bedeuten plus 7 % Steuer und 10 % Service."}},{"dine":{"top":{"name":"Gala-Dinner im Strandresort (z. B. Kimpton Kitalay, SALA Samui, Conrad)","why":"Klassisches Silvester mit Menü und Hotelfeuerwerk; Programm 2026 und Preise bei den Häusern anfragen – bis spätestens Mitte November reservieren.","addr":"je nach Haus (Choeng Mon / Südwesten)","price":"€€€"},"value":{"name":"Set-Menü in Lamai + Feuerwerk am Strand","why":"Viele Lamai-Restaurants bieten Silvester-Set-Menüs (vorbestellen), danach 5 Min zum Strand.","addr":"Lamai Zentrum","price":"€€"},"insider":{"name":"Privatkoch in der Villa","why":"Infinity-Pool, eigener Champagner (im Supermarkt deutlich günstiger als im Club), kein Taxi-Stress – Privatkoch/Catering über den Villa-Gastgeber anfragen. Ob man das Lamai-Feuerwerk von der Terrasse sieht: Gastgeber fragen.","addr":"Villa Clarisse","price":"€€"}}},0,1,2,{"warn":"Taxi/Grab für Hin- und Rückfahrt vorab fest vereinbaren – nach Mitternacht ist kaum ein Wagen frei."},{"home":"Mit vorbestelltem Fahrer zurück zur Villa."}]},{"iso":"2027-01-01","dt":"Fr 01.01.","title":"Neujahr · Freier Tag","route":{"walk":false,"drive":false,"mode":"🏖️ Strand-/freier Tag","lead":"Ausschlafen – heute hat vieles später oder gar nicht geöffnet."},"items":[],"flow":[{"seg":"☀️ Vormittag · Vorschlag"},{"about":{"t":"Neujahrsmorgen","x":"Nach der Silvesternacht schläft die Insel lange aus; manche Lokale und Läden öffnen später oder bleiben zu. Die Villa ist dafür der beste Ort: Frühstück aus dem Kühlschrank, Pool, Lesen im Schatten. Wer Strand will, findet am Nordteil von Lamai vormittags viel Platz."}},{"note":"🏖️ Langes Frühstück auf der Terrasse, danach Villa-Pool. Wer an den Strand will: Lamai Beach Nord (~10 Min), vormittags noch leer nach der Silvesternacht."},{"seg":"🌙 Abend · Vorschlag"},{"about":{"t":"Neujahrsabend","x":"Nach der Silvesternacht ist die Insel am 1. Januar spürbar ruhiger. Weil Neujahr auf einen Freitag fällt, ist in Bophut regulär Walking Street (ob sie an Neujahr läuft, vor Ort prüfen) – Fisherman's Village ist dann meist voller Garküchen und Kunsthandwerk, aber entspannter als in der Nacht davor. Wer gar nicht fahren mag, isst in Lamai."}},{"note":"🌆 Freitag = Fisherman's Village Walking Street (~13 km, ~30 Min) – die Neujahrs-Ausgabe ist meist entspannter als an Weihnachten. Wer fährt? Bei Bier am Markt: Grab hin und zurück (Richtwert Lamai–Bophut auf Taxi-Niveau, Preis in der App prüfen)."}]},{"iso":"2027-01-02","dt":"Sa 02.01.","title":"Ausflug: Mumien-Mönch, Secret Buddha Garden, Na-Muang-Wasserfall","route":{"walk":false,"drive":true,"mode":"🚗 Mietwagen + 🚙 Jeep · halber Tag","lead":"Das grüne Inselinnere im Südwesten: ein Tempel mit Kuriosität, ein versteckter Skulpturengarten im Dschungel, Mittagessen im Obstgarten und ein Wasserfall zum Abkühlen. Alles in 15–20 Fahrminuten von der Villa, nachmittags zurück.","wxi":"🌤️"},"items":[{"nm":"Wat Khunaram","cat":"temple","nt":"Tempel mit der mumifizierten Figur des Mönchs Luang Pho Daeng","map":"Wat Khunaram Koh Samui","src":"v","ll":[9.44982,100.0006],"addr":"Ringstraße 4169, Na Mueang","time":"10:15","must":true,"info":{"d":"Der Mönch starb 1973 in Meditationshaltung; sein Körper sitzt in einer Glasvitrine – mit Sonnenbrille, die die Augenhöhlen verdeckt.","t":"Respektvoll, bedeckte Kleidung."}},{"nm":"Secret Buddha Garden (Tarnim Magic Garden)","cat":"sight","nt":"Skulpturengarten im Bergdschungel","map":"Secret Buddha Garden Koh Samui","src":"v","ll":[9.48267,99.99481],"addr":"Bergland oberhalb Na Mueang","time":"11:15","must":true,"gem":true,"info":{"d":"Ein Durianbauer schuf ab 1976 Figuren aus Stein und Beton zwischen Bächen. Eintritt laut mehreren Quellen 80 THB (zu prüfen).","t":"Zufahrt (Abzweig gegenüber Wat Khunaram) nur mit Allrad – mit normalem Mietwagen NICHT fahren: am Fuß Jeep-Taxi nehmen oder Jeep-Tour buchen."}},{"nm":"Tara Bistro","cat":"food","nt":"Mittagessen am Wasserfall: lokale Samui-Küche im Obstgarten","map":"Tara Bistro Samui","src":"v","ll":[9.46572,99.98585],"addr":"20/1 Tambon Na Mueang, Ko Samui 84140","url":"https://www.tarabistrosamui.com/","time":"12:30","info":{"d":"Restaurant und Bar (seit 2022) inmitten eines Obstgartens mit Bächen; laut eigener Website saisonale Küche und lokale Samui-Spezialitäten, tgl. 10–21 Uhr (letzte Bestellung 20:30). Laut OSM ~220 m vom Parkplatz Na Muang 1.","t":"Preise nennt die Website nicht. Ausweichadresse an der Straße: Phaluang Coffee House (Thai/Seafood, laut OSM tgl. 10–22 Uhr, ~1 km) – zu prüfen."}},{"nm":"Na Muang Wasserfall 1","cat":"nature","nt":"18 m hoher Fall mit Badebecken, Parkplatz an der Straße","map":"Na Muang Waterfall 1","src":"v","ll":[9.46655,99.98405],"addr":"Na Mueang","time":"13:45","must":true,"info":{"d":"Laut Reiseführern tgl. 8–17 Uhr, Eintritt frei, Parken ~20 THB. Nach der Regenzeit führt er im Januar meist viel Wasser. Rund 5 Gehminuten vom Parkplatz.","t":"Badezeug + rutschfeste Sandalen; Na Muang 2 ist ein steiler Aufstieg (~30 Min) – nur bei Lust."}}],"flow":[{"seg":"☀️ Vormittag · Na Mueang & Bergland (Abfahrt ~10:00)"},{"about":{"t":"Über das Inselinnere","x":"Samuis Mitte ist bergig und von Kokos-, Durian- und Kautschukplantagen bedeckt; der höchste Punkt liegt über 600 m. Hier wohnen fast nur Einheimische, die Wege sind steil und teils ungeteert. Wat Khunaram an der Ringstraße ist berühmt für den mumifizierten Mönch Luang Pho Daeng. Darüber, nur per Allrad erreichbar, liegt der Secret Buddha Garden. Weiter westlich stürzt der Na-Muang-Wasserfall über braune Felsen – nach der Regenzeit besonders kräftig."}},{"tr":"🚗 Villa → Wat Khunaram ~6 km (~15 Min)"},0,{"warn":"Secret Buddha Garden: steile Piste, nur Allrad – Jeep-Taxi/Tour statt Mietwagen. Ohne Jeep diesen Stopp auslassen."},1,{"seg":"🍽️ Mittag · Na Mueang (~12:30)"},{"about":{"t":"Mittag im Obstgarten","x":"Na Mueang ist ländliches Samui: Obstplantagen, Bäche und kleine Familienbetriebe statt Strandlokalen. Das Tara Bistro liegt mitten in einem Obstgarten, gekocht werden laut eigener Website saisonale Gerichte und lokale Samui-Spezialitäten. Nach dem Mittagessen sind es nur wenige Schritte zum Wasserfall – Badesachen gleich im Auto lassen."}},{"tr":"🚙 zurück zur Ringstraße, 🚗 ~4 km Richtung Na Muang (~10 Min)"},2,{"tr":"🚶 ~220 m zum Parkplatz des Wasserfalls"},3,{"seg":"🏠 Nachmittag · Villa-Pool (ab ~15:00)"},{"about":{"t":"Nachmittag in der Villa","x":"Nach Tempel, Dschungelpiste und Wasserfall ist der Nachmittag zum Erholen da. Von Na Muang sind es rund 20 Minuten zurück zur Villa. Dort Salz- und Süßwasser abduschen, nasse Sachen auf die Terrasse und ab in den Infinity-Pool. Die Mittagshitze ist dann vorbei, vom Pool geht der Blick über Lamai aufs Meer. Wer noch Energie hat, holt im Lamai-Zentrum Grillgut für den Abend – Tops hat laut OSM rund um die Uhr geöffnet."}},{"seg":"🌙 Abend · Lamai"},{"about":{"t":"Lamai am Abend","x":"Abends verlagert sich das Leben in Lamai vom Strand ins Zentrum hinter dem Nordteil der Bucht. An den Straßen dort gibt es einfache Thai-Küchen mit Hühnerreis, Nudelsuppen und Currys für wenig Geld. Dazu kommen Seafood-Lokale mit Fischauslage am Eingang und kleine Bars. Am Südende bei den Felsen Hin Ta und Hin Yai liegt Sabienglae, das bekannteste Seafood-Haus des Ortes. Lamai ist abends lebendig, aber nicht laut – kein Vergleich zu Chaweng. Wer lieber zu Hause bleibt, wirft den Villa-Grill an."}},{"dine":{"top":{"name":"Sabienglae","why":"Falls am 28.12. verpasst – oder zweiter Besuch.","addr":"Südende Lamai","price":"€€"},"value":{"name":"Lamai-Zentrum Thai-Küchen","why":"Inlandstraßen hinter dem Strand: Khao Man Kai, Nudeln, Curry für ~150 THB.","addr":"Lamai Zentrum","price":"€"},"insider":{"name":"Selbst grillen","why":"Villa-Grill + Einkauf vom Frischmarkt.","addr":"Villa Clarisse","price":"€"}}},{"home":"Zurück zur Villa."}]},{"iso":"2027-01-03","dt":"So 03.01.","title":"Strand-/Freier Tag","route":{"walk":false,"drive":false,"mode":"🏖️ Strand-/freier Tag","lead":"Pool, Strand, Massage."},"items":[],"flow":[{"seg":"☀️ Vormittag · Vorschlag"},{"about":{"t":"Coral Cove und Massage","x":"Die Coral Cove ist eine kleine Felsbucht an der Küstenstraße zwischen Lamai und Chaweng Noi. Bei ruhiger See ist das Wasser klar genug zum Schnorcheln, bei Wellengang bleibt man besser am Rand. Danach geht es in eines der vielen Massage-Studios im Lamai-Zentrum – eine Stunde Thai-Massage ist auf Samui Alltag, kein Luxus."}},{"note":"🏖️ Coral Cove (kleine Felsbucht nördlich von Lamai, ~10 Min): Schnorcheln bei ruhiger See, danach eine Stunde Thai-Massage in einem der Salons im Lamai-Zentrum (1 Std. typ. ab ~300 THB, zu prüfen)."},{"seg":"🌙 Abend · Vorschlag"},{"about":{"t":"Lamai am Sonntagabend","x":"Sonntag ist Walking-Street-Tag in Lamai – die zweite Gelegenheit nach dem 27.12. Wer die Stände schon kennt, geht diesmal gezielt zu den Garküchen am Rand und probiert, was beim ersten Mal fehlte. Die Wege von der Villa sind kurz, das Auto bleibt am besten stehen (Grab)."}},{"note":"🌙 Sonntag = Lamai Walking Street (zweiter Besuch, ~5 Min): diesmal gezielt durch die Garküchen essen statt bummeln – Spieße, Curry, Mango Sticky Rice."}]},{"iso":"2027-01-04","dt":"Mo 04.01.","title":"Ausflug: Koh Tan & Koh Madsum per Longtail","route":{"walk":false,"drive":true,"mode":"🚗 Mietwagen + 🛶 Longtail · ~10–17:30 Uhr","lead":"Die stille Südküste: Longtail-Boot ab Thong Krut zu den kleinen Inseln Koh Tan (Schnorcheln) und Koh Madsum (Strand mit Schweinen, Mittagessen am Strand), zurück gegen 15:00, danach die goldene Pagode Laem Sor am Meer.","wxi":"🌊","wx":"Bei Wind abhängig von der See – privates Boot erlaubt flexiblen Termin."},"items":[{"nm":"Thong Krut Pier","cat":"boat","nt":"Abfahrt Longtail-Boote zu Koh Tan / Koh Madsum","map":"Thong Krut Pier","src":"v","ll":[9.42038,99.95447],"addr":"Thong Krut, Südküste","time":"10:30","info":{"d":"Kleines Fischerdorf an der Südküste; private Longtails ~4–5 Std laut Anbietern.","t":"Privates Longtail für 10:30–15:00 vereinbaren (Abfahrt Villa ~10:00, ~30 Min Fahrt); viele Anbieter bieten die Tour inkl. Mittagessen an – dann entfällt die Lokalsuche."}},{"nm":"Koh Tan","cat":"nature","nt":"Ruhige Insel mit Korallen, Schnorcheln","map":"Koh Tan Koh Samui","src":"v","ll":[9.37547,99.94434],"addr":"Vor der Südküste Samuis","must":true,"info":{"d":"Kaum bebaut, ein paar Bungalows und Strandlokale – Schnorcheln vom Strand aus.","t":"Schnorchelmaske mitbringen oder beim Bootsführer erfragen; Riffschuhe schützen vor Korallen."}},{"nm":"Koh Madsum („Schweine-Insel“)","cat":"beach","nt":"Weißer Strand mit frei laufenden Schweinen","map":"Koh Madsum Pig Island","src":"v","ll":[9.37287,99.97694],"addr":"Vor der Südküste Samuis","must":true,"info":{"d":"Bekannt für die Hausschweine am Strand; sehr fotogen, mittags voll.","t":"Schweine nicht füttern – Snacks im Boot lassen."}},{"nm":"Laem Sor Pagoda (Wat Laem Sor)","cat":"temple","nt":"Goldgelbe Chedi direkt am Meer","map":"Laem Sor Pagoda","src":"v","ll":[9.41379,99.9704],"addr":"Laem Sor, Südküste","time":"16:00","gem":true,"info":{"d":"Eine der fotogensten Pagoden der Insel, kaum besucht, mit Blick auf die Inseln.","t":"Aktiver Klosterbezirk: Schultern/Knie bedecken, leise sein."}},{"nm":"Le Kiosque (französische Bäckerei, Thong Krut)","cat":"bakery","nt":"Kaffee + Gebäck nach dem Boot","map":"Le Kiosque Thong Krut","src":"c","ll":[9.42048,99.95623],"addr":"Thong Krut","noroute":true,"info":{"d":"Französische Boulangerie am Pier von Thong Krut (OSM-Eintrag: Brot, Gebäck, Kaffee, Eis).","t":"Öffnungszeiten zu prüfen – ideal für den Kaffee zwischen Boot und Pagode."}},{"nm":"Mad Sum Bar (Koh Madsum)","cat":"food","nt":"Mittagessen am Strand von Koh Madsum","map":"Mad Sum Bar Koh Madsum","src":"c","ll":[9.37688,99.97837],"addr":"Koh Madsum, vor der Südküste Samuis","time":"13:00","info":{"d":"Strandlokal auf Koh Madsum (OSM-Eintrag, laut OSM tgl. 8–17 Uhr). Auf Koh Tan ist kein Lokal verlässlich belegt – deshalb Mittag hier.","t":"Speisekarte und Preise zu prüfen. Wer das Longtail inkl. Mittagessen bucht, isst dort, wo der Anbieter hinfährt."}}],"flow":[{"seg":"🛶 Vormittag · Boot Koh Tan & Koh Madsum (Abfahrt Villa ~10:00, Boot 10:30–15:00)"},{"about":{"t":"Über die Südküste und ihre Inseln","x":"Die Südküste ist Samuis ruhigste Seite: Fischerdörfer, Mangroven und kaum Hotels. Von Thong Krut fahren Longtail-Boote zu den vorgelagerten Inseln Koh Tan und Koh Madsum. Koh Tan ist fast unbebaut und hat Korallen in Strandnähe – ideal zum Schnorcheln am Vormittag. Auf Koh Madsum laufen Schweine über den weißen Strand, dort gibt es auch das Mittagessen am Strand. Mit einem privaten Boot bestimmt ihr das Tempo selbst; gegen 15:00 seid ihr zurück am Pier."}},{"tr":"🚗 Villa → Thong Krut ~15 km (~30 Min)"},0,{"tr":"🛶 Longtail ~20–30 Min"},1,{"tr":"🛶 kurze Überfahrt nach Koh Madsum"},2,5,{"tr":"🛶 zurück nach Thong Krut (~15:00)"},4,{"seg":"🌇 Nachmittag · Kaffee in Thong Krut, dann Laem Sor (~16:00)"},{"about":{"t":"Über Laem Sor","x":"Knapp zwei Kilometer östlich von Thong Krut steht an einer flachen Landspitze die Laem-Sor-Pagode: eine goldgelb verkleidete Chedi direkt am Wasser. Sie gehört zum Kloster Wat Laem Sor und ist ein aktiver religiöser Ort, kein Ausflugsziel mit Souvenirständen. Weil kaum Reisebusse hierherkommen, ist es meist still – nur Wellen, Palmen und der Blick zurück auf Koh Tan und Koh Madsum, wo ihr mittags wart. Am Nachmittag leuchtet die Pagode im seitlichen Licht am schönsten. Bedeckte Schultern und Knie sind Pflicht; eine halbe Stunde genügt."}},{"tr":"🚗 ~2 km zur Laem Sor Pagoda (~5 Min)"},3,{"seg":"🌙 Abend · Thong Krut oder Lamai"},{"about":{"t":"Abend an der Südküste","x":"Thong Krut ist ein Fischerdorf; am Pier gibt es eine Handvoll Restaurants. Wer nach Laem Sor gleich bleibt, isst hier früh und fährt danach die rund 30 Minuten zurück zur Villa. Wer lieber heim will, findet in Lamai Garküchen und das kleine Laankao nahe der Villa. Auf den dunklen Straßen langsam fahren – Hunde und Roller ohne Licht sind häufig."}},{"dine":{"top":{"name":"Nuch's Green Ta'lay Restaurant","why":"Restaurant am Pier von Thong Krut (OSM-Eintrag mit eigener Website) – Seafood nach dem Ausflugstag; Öffnungszeiten und Preise zu prüfen.","addr":"Thong Krut, Südküste","price":"€€"},"value":{"name":"Lamai Night Market","why":"Zurück in Lamai – Garküchen.","addr":"Lamai Zentrum","price":"€"},"insider":{"name":"Laankao","why":"Stammlokal nahe Villa (zu prüfen).","addr":"Lamai","price":"€"}}},{"home":"Zurück zur Villa ~30 Min."}]},{"iso":"2027-01-05","dt":"Di 05.01.","title":"Ausflug: Thai-Kochkurs + Chaweng","route":{"walk":true,"drive":true,"mode":"👩‍🍳 Kochkurs (Abholung) + 🚗 Chaweng · ganzer Tag","lead":"Vormittags ein Kochkurs mit Marktbesuch (das Mittagessen kocht ihr selbst), nachmittags Samuis berühmtester Strand mit einem Drink zur blauen Stunde und zum Abschluss lokales Thai-Essen in Chaweng.","wxi":"🌤️"},"items":[{"nm":"Lad Koh Viewpoint","cat":"view","nt":"Straßen-Aussichtspunkt über Chaweng Noi","map":"Lad Koh Viewpoint","src":"v","ll":[9.49886,100.05983],"addr":"Ringstraße zwischen Lamai und Chaweng","time":"15:00","info":{"d":"Kurzer Halt an der Küstenstraße – Felsen, Bucht, Blick bis Chaweng.","t":"Parkbucht direkt an der Straße – vorsichtig ein- und ausfahren, die Kurve ist unübersichtlich."}},{"nm":"Chaweng Noi Beach","cat":"beach","nt":"Ruhigere Südhälfte von Chaweng","map":"Chaweng Noi Beach","src":"v","ll":[9.50571,100.05662],"addr":"Chaweng Noi","noroute":true},{"nm":"Chaweng Beach (Chaweng Yai)","cat":"beach","nt":"Samuis berühmtester Strand – Spaziergang am Wasser","map":"Chaweng Beach","src":"v","ll":[9.52527,100.06452],"addr":"Chaweng Beach","time":"16:00","info":{"d":"7 km heller Sand; im Norden Beach-Clubs, im Süden ruhiger. Bei Rotflagge nicht schwimmen.","t":"Barfuß am Wasser Richtung Norden laufen – so landet ihr von selbst bei der Ark Bar."}},{"nm":"Ark Bar Beach Club","cat":"bar","nt":"Strandbar mit Pools – Drink zur blauen Stunde","map":"Ark Bar Beach Club","src":"v","ll":[9.53132,100.065],"addr":"Chaweng Beach, Moo 2","time":"17:30","info":{"d":"Klassiker in Chaweng: Cocktails ab ~180 THB, abends DJs und Feuershows.","t":"Sitzsäcke direkt am Wasser früh sichern; Abendstimmung über dem Meer (siehe Gegend-Notiz)."}},{"nm":"Central Samui","cat":"shop","nt":"Klimatisierte Mall mit Tops-Supermarkt (Import-Wein, Käse)","map":"Central Samui","src":"v","ll":[9.5316,100.06124],"addr":"Chaweng Beach Road","noroute":true}],"flow":[{"seg":"👩‍🍳 Vormittag · Kochkurs (~10:00–14:00)"},{"about":{"t":"Thai-Kochkurs: was euch erwartet","x":"Ein typischer Kochkurs auf Samui beginnt mit einem Gang über einen lokalen Markt: Kräuter wie Thai-Basilikum, Zitronengras und Galgant kennenlernen, Kokosmilch frisch gepresst, Chilisorten unterscheiden. Danach kocht jeder an seiner eigenen Station meist vier bis fünf Gerichte, etwa eine Currypaste aus dem Mörser, ein Curry, eine Suppe wie Tom Yam, ein Wok-Gericht und ein Dessert. Gegessen wird, was ihr selbst gekocht habt – das ist euer Mittagessen. Kleine Gruppen sind persönlicher und lassen Platz für Fragen. Die Rezepte gibt es meist zum Mitnehmen, damit ihr in der Villa-Küche gleich weiterüben könnt. Ablauf, Gerichte und Preis hängen vom gebuchten Anbieter ab."}},{"warn":"Abholzeit beim Buchen festlegen: Kurs mit Start/Abholung ab 10:00 wählen. Holt der Anbieter nur früher ab (Markttouren beginnen oft vor 10 Uhr), ist das eine bewusste Ausnahme von der 10-Uhr-Regel."},{"note":"💡 Kochkurs mit Markttour buchen, z. B. Smiley Cook Thai (max. 6 Pers., Abholung Lamai auf Anfrage) oder Kurse über byfood/Magpie (ab ~80–85 USD p. P.). Die alte Kochschule SITCA (Chaweng): Website derzeit nicht erreichbar – Betrieb zu prüfen."},{"seg":"🌇 Nachmittag · Chaweng (ab ~15:00)"},{"about":{"t":"Über Chaweng","x":"Chaweng ist das touristische Zentrum Samuis: 7 km Strand, dahinter eine dichte Meile aus Hotels, Bars, Märkten und der Mall Central Samui. Im Norden liegen die Beach-Clubs wie Ark Bar, im Süden ist es ruhiger (Chaweng Noi). Laut und lebhaft, aber für einen Nachmittag mit Strand und Abenddrink genau richtig – wohnen müsst ihr hier nicht. Weil Chaweng nach Osten blickt, versinkt die Sonne hinter den Hügeln, nicht im Meer."}},{"tr":"🚗 Villa → Lad Koh Viewpoint ~7–8 km (~15 Min)"},0,1,{"tr":"🚗 ~3 km nach Chaweng (~10 Min), parken an Central Samui"},4,2,3,{"seg":"🌙 Abend · Chaweng"},{"about":{"t":"Chaweng am Abend","x":"Nach Einbruch der Dunkelheit wird Chaweng zur lautesten Ecke der Insel: Die Beach Road füllt sich mit Bars, Live-Musik, Garküchen und Neonlicht. Wer das nicht sucht, findet die Alternativen am Rand: den Chaweng Night Food Market mit Seafood zum Aussuchen, einfache südthailändische Küche in Chaweng Noi oder das Baumhaus-Dinner im Anantara Lawana am ruhigen Nordende. Für einen Abend ist das Gewusel unterhaltsam, danach fahrt ihr zurück ins ruhige Lamai. Vorher festlegen, wer fährt – der bleibt beim Wasser."}},{"dine":{"top":{"name":"Tree Tops Dining (Anantara Lawana)","why":"Baumhaus-Dinner – falls an Weihnachten nicht geschafft.","addr":"Chaweng Nord","price":"€€€"},"value":{"name":"Phensiri (เพ็ญศิริ)","why":"Lokale südthailändische Hausmannskost in Chaweng Noi (OSM-Eintrag, wird in Guides genannt) – zu prüfen.","addr":"Chaweng Noi","price":"€"},"insider":{"name":"Chaweng Night Food Market","why":"Garküchen und Seafood zum Aussuchen; Pad Thai 80–100 THB, Preis/kg vorher klären.","addr":"Chaweng Beach Road","price":"€"}}},{"home":"Zurück nach Lamai ~20 Min (Fahrer ohne Alkohol!)."}]},{"iso":"2027-01-06","dt":"Mi 06.01.","title":"Strand-/Spa-Tag","route":{"walk":false,"drive":false,"mode":"🏖️ Strand-/freier Tag","lead":"Ruhetag – oder optional Koh Phangan; zugleich zweiter Ersatztermin für Ang Thong."},"items":[],"flow":[{"seg":"☀️ Vormittag · Vorschlag"},{"about":{"t":"Spa-Tag in Lamai","x":"Lamai hat Massage-Studios an fast jeder Ecke, von einfachen Salons an der Straße bis zu Day-Spas mit Paketen aus Massage, Kräuterstempel und Gesichtsbehandlung. Ein Paket dauert meist zwei bis drei Stunden und sollte einige Tage vorher gebucht werden. Danach ist der Villa-Pool der richtige Ort. Wer lieber unterwegs ist, nimmt die Fähre nach Koh Phangan – oder holt heute den Ang-Thong-Ausflug nach, falls er ausgefallen ist."}},{"note":"💆 Vormittags Massage oder Day-Spa-Paket in Lamai (einige Tage vorher buchen), danach Villa-Pool."},{"seg":"🌙 Abend · Vorschlag"},{"about":{"t":"Vorletzter Abend","x":"Der vorletzte Abend ist zum Aufbrauchen und Packen da: Reste aus dem Villa-Kühlschrank, dazu ein einfaches Essen in Lamai. Morgen folgt mit Bophut und Maenam noch einmal ein voller Tag, übermorgen die Abreise – heute also kein Programm, nur Terrasse und Abendstimmung über der Bucht."}},{"note":"🍽️ Abends Laankao, das kleine Thai-Lokal ~700 m von der Villa (OSM-Eintrag, zu prüfen) – oder die Reste aus dem Kühlschrank vor dem Abreise-Endspurt verkochen."},{"note":"⛴️ Option für Unternehmungslustige: Koh-Phangan-Tagestrip – Lomprayah ab Maenam/Nathon nach Thong Sala (~350 THB, zu prüfen) bzw. Haad Rin Queen ab Bangrak; letzte Rückfähre am späten Nachmittag beachten. Bei rauer See lieber nicht. Fiel Ang Thong am 29. und 30.12. aus, hat der Ersatztermin heute Vorrang."}]},{"iso":"2027-01-07","dt":"Do 07.01.","title":"Ausflug: Bophut & Maenam – letzter Abend am Nachtmarkt","route":{"walk":false,"drive":true,"mode":"🚗 Mietwagen · Mittag bis Abend","lead":"Letzter voller Tag an der Nordküste: Bummeln in Bophut, Mittagessen im Sand, die heißen Stunden auf einer Strandliege, dann das ruhige Maenam mit Sonnenuntergang und dem Donnerstags-Nachtmarkt als Abschiedsabend.","wxi":"🌤️"},"items":[{"nm":"The Wharf Samui (Bophut)","cat":"shop","nt":"Kleine Shopping-Promenade am Westende Bophuts","map":"The Wharf Samui","src":"v","ll":[9.56034,100.02729],"addr":"Bophut","time":"11:00","info":{"d":"Boutiquen, Cafés, Mitbringsel – letzte Gelegenheit zum Stöbern.","t":"Parken auf dem Wharf-Gelände; von hier ist alles bis zum Beach Club zu Fuß erreichbar."}},{"nm":"Krua Bophut","cat":"food","nt":"Mittagessen: Südthai-Küche und Seafood, Tische teils im Sand","map":"Krua Bophut","src":"v","ll":[9.56083,100.02814],"addr":"Fisherman's Village, Bophut","time":"12:00","info":{"d":"Gilt als eine der besten Adressen in Fisherman's Village (gelbes Krabbencurry, Fisch mit Limette/Chili); ~100 m von The Wharf.","t":"Mittags ist es ruhiger als abends – gute Chance auf einen Tisch am Strand ohne Reservierung (zu prüfen)."}},{"nm":"Chom Dao Beach Club (Bandara Resort)","cat":"beach","nt":"Liegeplatz für die Mittagshitze am Bophut Beach (~13:00–16:00)","map":"Chom Dao Beach Club Bophut","src":"c","ll":[9.56248,100.02451],"addr":"Bandara Resort & Spa, 178/2 Moo 1, Bophut","time":"13:00","info":{"d":"Strandrestaurant/Beach Club des Bandara Resorts am Westteil des Bophut Beach, laut OSM tgl. 6:30–22 Uhr; ~400 m von The Wharf zu Fuß.","t":"Ob Liegen für Nicht-Hotelgäste (mit Mindestverzehr) zu haben sind, vorab erfragen. Alternative mit belegter Regel: The Deck Beach Club am Ostteil des Bophut Beach – tgl. 10–22 Uhr, Pool-Liege in der Hochsaison 1.500 THB p. P., voll auf Essen/Getränke anrechenbar (laut Bericht fooddrinkdestinations; per WhatsApp reservieren)."}},{"nm":"Chinesischer Tempel Maenam","cat":"temple","nt":"Farbiger chinesischer Schrein an der Maenam-Strandstraße","map":"Chinese Temple Maenam Koh Samui","src":"c","ll":[9.57033,99.99802],"addr":"Maenam","time":"16:45","gem":true,"info":{"d":"Kleiner taoistischer Tempel nahe dem Strand (OSM-Eintrag).","t":"Kurzer Stopp auf dem Weg zum Strand – zehn Minuten genügen."}},{"nm":"Maenam Beach","cat":"beach","nt":"Ruhiger Nordstrand mit Blick auf Koh Phangan","map":"Maenam Beach","src":"v","ll":[9.57227,100.01074],"addr":"Maenam","time":"17:15","info":{"d":"Langer, ruhiger Strand – Sonnenuntergang im Westen.","t":"Sonnenuntergang ~18:00 (Anfang Januar wenige Minuten später) – rechtzeitig einen Platz am Wasser suchen."}},{"nm":"Maenam Walking Street (Do)","cat":"market","nt":"Donnerstags-Nachtmarkt","map":"Maenam Walking Street","src":"v","ll":[9.56887,99.99649],"addr":"Maenam Zentrum","time":"18:30","must":true,"info":{"d":"Do ~17–23 Uhr, am vollsten 19–22 Uhr; Parken schwierig – früh kommen.","t":"Auto vor 18 Uhr abstellen und zu Fuß vom Strand herüberlaufen."}}],"flow":[{"seg":"☀️ Mittag · Bophut (ab ~11:00)"},{"about":{"t":"Über Bophut und Maenam","x":"Die Nordküste ist Samuis ruhigere Seite. Bophut mit Fisherman's Village ist gehoben-entspannt, Maenam westlich davon noch ländlicher: ein langer Strand mit Kokospalmen, kleine Resorts und ein lokaler Ortskern mit chinesischem Tempel. Donnerstags verwandelt sich die Hauptstraße in eine Walking Street mit vielen Garküchen. Von hier sieht man Koh Phangan am Horizont."}},{"tr":"🚗 Villa → Bophut ~13 km (~30 Min)"},0,1,{"tr":"🚶 ~400 m am Strand entlang nach Westen"},2,{"note":"💡 Hitze-Pause ~13:00–16:00 auf der Liege im Schatten – Baden, Lesen, ein Kokos-Shake."},{"seg":"🌇 Spätnachmittag · Maenam (ab ~16:30)"},{"about":{"t":"Maenam zum Sonnenuntergang","x":"Maenam ist der ländlichste Ort an der Nordküste: ein langer, ruhiger Strand mit Kokospalmen und Blick auf Koh Phangan. Weil die Küste hier nach Norden blickt, steht die Abendsonne im Westen über der Küstenlinie – anders als an der Ostküste. Sonnenuntergang ist gegen 18 Uhr. Danach sind es wenige Gehminuten zur Walking Street, die donnerstags die Hauptstraße füllt."}},{"tr":"🚗 Bophut → Maenam ~4 km (~10 Min)"},3,4,5,{"note":"🚕 Wer fährt? Rückweg Maenam → Lamai ~40–45 Min im Dunkeln: vorher festlegen, wer fährt – der bleibt beim Wasser. Grab statt Auto geht nicht gut, denn dann stünde der Wagen in Maenam, und ihr braucht ihn morgen für die Abreise."},{"dine":{"top":{"name":"Sala Thai (Santiburi, Maenam)","why":"Abends Thai-Seafood mit lokalen Produkten (Samui-Hummer-Curry, Pomelo-Garnelen-Salat) im Resort Santiburi – zu prüfen, reservieren.","addr":"Santiburi, Maenam","price":"€€€"},"value":{"name":"Streetfood der Maenam Walking Street","why":"Abschiedsessen im Gehen – Spieße, Pad Thai, Mango Sticky Rice.","addr":"Maenam","price":"€"},"insider":{"name":"Cafe Talay","why":"Thai/internationales Lokal an der Maenam-Strandstraße, ~150 m vom Nachtmarkt (OSM-Eintrag, laut OSM 12–21:30 Uhr) – zu prüfen.","addr":"Maenam, Strandstraße","price":"€"}}},{"home":"Zurück nach Lamai ~40–45 Min; Koffer packen."}]},{"iso":"2027-01-08","dt":"Fr 08.01.","title":"Abreise: Samui → Bangkok → Frankfurt","route":{"walk":false,"drive":true,"mode":"🚗 Mietwagen · Lamai → Flughafen","lead":"Packen und um 11 Uhr auschecken (Late-Check-out anfragen). Den Nachmittag verbringt ihr mit dem Gepäck im Auto in Lamai: Strand, Mittagessen, Massage. Um ~16:00 Abfahrt, ~16:35 am Flughafen, Mietwagen zurück, Check-in bis spätestens 16:55 für PG 170 um 18:25 (Durchgangsticket mit TG 920 um 23:45 ab Bangkok).","wxi":"✈️"},"items":[{"nm":"Villa Clarisse","cat":"hotel","nt":"Check-out ~11:00 (übliche Zeit – Late-Check-out beim Gastgeber anfragen)","map":"Villa Clarisse Lamai","src":"v","ll":[9.4736,100.0352],"addr":"Lamai","time":"11:00","must":true,"info":{"d":"Check-out-Zeit ist in den Inseraten nicht verlässlich genannt; 11:00 ist bei Ferienvillen üblich.","t":"Late-Check-out bis ~15:30 vorab anfragen – dann entfällt der Nachmittag mit Gepäck im Auto, und ihr duscht vor dem Flug in der Villa."}},{"nm":"Beach Republic (Lamai Nord)","cat":"bar","nt":"Strand, Mittagessen und Schatten mit Gepäck im Auto","map":"Beach Republic Koh Samui","src":"c","ll":[9.47204,100.06242],"addr":"Lamai Nord","time":"11:30","info":{"d":"Beach-Club am Nordende von Lamai (OSM-Eintrag). Liegen, Duschen und Mindestverzehr für Tagesgäste zu prüfen.","t":"Auto im Schatten oder auf bewachtem Parkplatz abstellen, Koffer im Kofferraum, Pässe/Tickets/Wertsachen mitnehmen."}},{"nm":"Flughafen Samui (USM)","cat":"sight","nt":"Mietwagen-Rückgabe, Check-in PG 170 18:25 → BKK, weiter TG 920 23:45","map":"Samui International Airport","src":"v","ll":[9.54881,100.06259],"addr":"Samui International Airport","time":"16:35","must":true,"info":{"d":"Durchgangsticket: PG 170 um 18:25 nach Bangkok, Anschluss TG 920 um 23:45 ab BKK. Spätestens 16:55 am Flughafen sein.","t":"Avis-Rückgabe am Flughafen laut Avis bis 19 Uhr – beim Abendflug kein Problem. Tank nach Vertrag füllen (Tankstellen an der Ringstraße). Gepäck bis zum Ziel durchchecken lassen und am Schalter bestätigen."}}],"flow":[{"seg":"🧳 Vormittag · Packen & Check-out (bis ~11:00)"},{"about":{"t":"Der Abreisetag","x":"Der Flug geht erst am Abend – der letzte Tag gehört also noch der Insel. Wichtig ist nur die Reihenfolge: morgens packen, um 11 Uhr die Villa übergeben, dann den Tag in Lamai verbringen, ohne weit wegzufahren. Das Gepäck bleibt im Kofferraum, Wertsachen tragt ihr bei euch. Mittags Strand und Essen im Schatten, am frühen Nachmittag eine letzte Thai-Massage – danach seid ihr entspannt für die lange Nacht im Flugzeug. Um 16 Uhr geht es los; die Ringstraße über Chaweng kann am Nachmittag zäh sein, deshalb ist Puffer eingeplant. Klappt ein Late-Check-out, verbringt ihr die Stunden einfach am Villa-Pool."}},0,{"seg":"🏖️ Mittag & Nachmittag · Lamai mit Gepäck im Auto (11:00–16:00)"},{"tr":"🚗 Villa → Lamai Nord ~4 km (~10 Min)"},1,{"note":"💆 ~14:00–15:30: einstündige Thai-Massage in einem der Salons im Lamai-Zentrum (~5 Min Fahrt; 1 Std. typ. ab ~300 THB, zu prüfen) – danach frisch fürs Flugzeug."},{"seg":"✈️ Abfahrt ~16:00 · Lamai → Flughafen"},{"tr":"🚗 Lamai → Flughafen ~14 km (~30–35 Min) über die Ringstraße via Chaweng"},2,{"note":"💡 Ankunft ~16:35: Avis-Rückgabe (bis 19 Uhr), dann Check-in – spätestens 16:55 am Schalter. Samui ist ein kleiner Flughafen mit offenen Pavillons; die Wartezeit vergeht in der Bangkok-Airways-Lounge, die allen PG-Passagieren offensteht (zu prüfen)."}]}],"badge":"4","verdict":"<b>12 Nächte sind lang, aber stimmig</b> – das ist der Erholungsteil der Reise, kein Programm-Urlaub. Im Plan: 6 Ausflugstage im Wechsel mit freien Tagen, Ang Thong mit Ausweichtag (Meer im Dezember oft rau). Risiko: Die Villa liegt am Hang, 2,4 km vom Strand – ohne Mietwagen geht hier nichts."}];

// Sortier-Reihenfolge pro Tag
function dayOrder(dayKey,n){
  let o=(state._order||{})[dayKey];
  if(!o||o.length!==n||o.some(x=>x>=n||x<0)) o=Array.from({length:n},(_,i)=>i);
  return o;
}
function setDayOrder(dayKey,arr){state._order=Object.assign({},state._order,{[dayKey]:arr});save();}
function moveInDay(dayKey,pos,dir){
  const day=findDay(dayKey);if(!day)return;
  const o=dayOrder(dayKey,day.items.length).slice();
  const np=pos+dir;if(np<0||np>=o.length)return;
  [o[pos],o[np]]=[o[np],o[pos]];setDayOrder(dayKey,o);renderPlan();syncPlanChecks();updateProgress();
}
function findDay(dayKey){ // dayKey = si+'-'+di  oder  si+'-d'
  const parts=dayKey.split('-');const si=+parts[0];
  if(parts[1]==='d')return {items:STAGES[si].items,base:si+'-d'};
  const di=+parts[1];return {items:STAGES[si].days[di].items,base:si+'-'+di};
}
function stageIds(s,si){
  return s.drive ? s.items.map((_,ii)=>si+'-d-'+ii)
    : s.days.flatMap((d,di)=>d.items.map((_,ii)=>si+'-'+di+'-'+ii));
}
function allItems(){ // [it, id, si, dayObj|null]
  const out=[];
  STAGES.forEach((s,si)=>{
    if(s.drive)s.items.forEach((it,ii)=>out.push([it,si+'-d-'+ii,si,null]));
    else s.days.forEach((d,di)=>d.items.forEach((it,ii)=>out.push([it,si+'-'+di+'-'+ii,si,d])));
  });
  return out;
}

function coordFor(q){const p=GEO.pins.find(x=>x.q===q);if(p)return p.ll;const r=GEO.route.find(x=>x.q===q);return r?r.ll:null;}
function buildGpx(name,stops){

function tourBtns(label,names,gpxStops,mapsLabel){

function dayTours(d,dk,ord,si,di){ // AM/PM-Touren für einen Tag

// Fuß-Distanz aus Koordinaten (Luftlinie × Straßenfaktor ~1,3)
function haversineM(a,b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b[0]-a[0]), dLon=toR(b[1]-a[1]);
  const h=Math.sin(dLat/2)**2 + Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
function walkMeters(a,b){ return haversineM(a,b)*1.3; }
function kmStr(m){ return m<950 ? (Math.round(m/50)*50)+' m' : (Math.round(m/100)/10).toString().replace('.',',')+' km'; }
function walkStr(m){ const min=Math.max(1,Math.round(m/75)); return `<span class="fleg-t">↓ ${kmStr(m)} · ~${min} Min zu Fuß</span>`; }

function dayFlowHtml(d,s,si,di){
  const dk=si+'-'+di, r=d.route||{};
  let body='', order=[], prevLL=null, totM=0, frozen=false; const isDrive=r.drive||(s&&s.drive);
  (d.flow||[]).forEach(e=>{
    if(typeof e==='number'){
      const it=d.items[e];
      if(it){
        if(it.ll && !it.noroute){
          if(prevLL && !isDrive){ const m=walkMeters(prevLL,it.ll); if(m<=2600){ if(!frozen) totM+=m; body+=`<div class="fleg">${walkStr(m)}</div>`; } else if(m<=15000){ body+=`<div class="fleg fleg-far"><span class="fleg-t">↔ ~${kmStr(m)} · größerer Sprung (Transit/Auto)</span></div>`; } }
          prevLL=it.ll;
        }
        body+=itemHtml(it,dk+'-'+e);
        if(!it.noroute) order.push(it.map);
      }
      return;
    }
    if(e.seg){ if(e.endtour) frozen=true; body+=`<div class="fseg">${esc(e.seg)}</div>`; return; }
    if(e.warn){ body+=`<div class="fwarn">⚠️ <span>${esc(e.warn)}</span></div>`; return; }
    if(e.about){ body+=`<details class="fabout"><summary>📖 ${esc(e.about.t||'Über diese Gegend')}</summary><div class="fabout-x">${esc(e.about.x)}</div></details>`; return; }
    if(e.dine){ body+=dineHtml(e.dine); return; }
    if(e.tr){ body+=`<div class="ftr">↳ <span><b>Übergang:</b> ${esc(e.tr)}</span></div>`; prevLL=null; return; }
    if(e.note){ body+=`<div class="fnote">${esc(e.note)}</div>`; return; }
    if(e.home){ body+=`<div class="ftr fhome">🏨 <span><b>Rückweg zum Hotel:</b> ${esc(e.home)}</span></div>`; return; }
  });
  const from=r.from||stageBaseQ(s), mode=r.drive?'driving':'walking', enc=encodeURIComponent;
  let url='https://www.google.com/maps/dir/?api=1&travelmode='+mode+'&origin='+enc(from);
  if(order.length){ url+='&destination='+enc(order[order.length-1]); const mids=order.slice(0,-1); if(mids.length) url+='&waypoints='+mids.map(enc).join('%7C'); }
  else url+='&destination='+enc(from);
  const wx = r.wx?`<div class="wxbar"><span class="wxi">${esc(r.wxi||'🌦️')}</span><div>${esc(r.wx)}</div></div>`:'';
  const dist = totM>250 ? `<span class="daydist">🚶 ~${(Math.round(totM/100)/10).toString().replace('.',',')} km</span>` : '';
  return `<div class="dayflow">
    <div class="rt-head">🗺️ <b>Tagesablauf</b>${r.mode?`<span class="rt-mode">${esc(r.mode)}</span>`:''}${dist}</div>
    ${r.lead?`<div class="rt-lead">${esc(r.lead)}</div>`:''}
    ${wx}
    ${body}
    <a class="rt-btn" href="${esc(url)}" target="_blank" rel="noopener">🧭 Gesamte Tagesroute in Google Maps</a>
  </div>`;
}

let filterGrp='all', filterQ='';
function renderPlan(){
  const list=document.getElementById('planList');
  const grp=GROUPS.find(g=>g.id===filterGrp);
  const q=filterQ.trim().toLowerCase();
  if(filterGrp==='all' && !q){
    let h='';
    STAGES.forEach((s,si)=>{
      const ids=stageIds(s,si);
      const done=ids.filter(id=>get(id).done).length;
      const collapsed = si>0 ? 'collapsed':'';
      h+=`<div class="stage ${collapsed}" data-si="${si}" id="stage-${si}">
        <div class="head"><span class="badge">${s.badge}</span>
          <div style="flex:1;min-width:0"><h2>${esc(s.name)}</h2><span class="sub">${esc(s.sub)}</span></div>
          <span class="cnt" data-cnt="${si}">${done}/${ids.length}</span>
          <span class="chev">▾</span></div>
        <div class="body">`;
      if(s.hotel) h+=`<div class="hotel">🏨 ${esc(s.hotel)}</div>`;
      if(s.verdict) h+=`<div class="verdict">⚖️ <b>Passt die Dauer?</b> ${s.verdict}</div>`;
      h+=bookingHtml(s);h+=transitHtml(s);h+=parkingHtml(s);h+=shoppingHtml(s);h+=extrasHtml(s);h+=modesHtml(s.name);
      if(s.drive){
        if(s.flow){ h+=dayFlowHtml(s,s,si,'d'); }
        else {
          const dk=si+'-d',ord=dayOrder(dk,s.items.length);
          const names=ord.map(ii=>s.items[ii].map), gpx=ord.map(ii=>({nm:s.items[ii].nm,q:s.items[ii].map}));
          h+=`<div class="day" data-dropday="${dk}"><div class="drive">🚗 Scenic-Etappe</div>`;
          h+=tourBtns('Fahrt '+s.name,names,gpx,'Fahrt-Route (Google Maps)');
          ord.forEach((ii,pos)=>h+=itemHtml(s.items[ii],si+'-d-'+ii,{dayKey:dk,pos,len:ord.length}));
          h+=tourExtraHtml(s.name);
          h+=`</div>`;
        }
      } else {
        s.days.forEach((d,di)=>{
          const dk=si+'-'+di,ord=dayOrder(dk,d.items.length);
          h+=`<div class="day" data-dropday="${dk}"><h3><span class="dt">${esc(d.dt)}</span> ${esc(d.title)}</h3>`;
          if(d.flow){ h+=dayFlowHtml(d,s,si,di); }
          else { h+=routeHtml(d,s); h+=dayTours(d,dk,ord,si,di); h+=tourExtraHtml(d.title); }
          h+=`</div>`;
        });
      }
      h+=`</div></div>`;
    });
    list.innerHTML=h;
  } else {
    // gefilterte Flachliste
    let rows=allItems().filter(([it])=>{
      const inGrp = filterGrp==='all' || (grp.cats||[]).includes(it.cat);
      const inQ = !q || (it.nm+' '+it.nt).toLowerCase().includes(q);
      return inGrp && inQ;
    });
    if(!rows.length){list.innerHTML='<div class="empty">Nichts gefunden.</div>';return;}
    let h='',lastSi=-1;
    rows.forEach(([it,id,si])=>{
      if(si!==lastSi){
        if(lastSi>=0)h+='</div></div></div>';
        h+=`<div class="stage"><div class="head" style="cursor:default"><span class="badge">${STAGES[si].badge}</span><div style="flex:1"><h2>${esc(STAGES[si].name)}</h2></div></div><div class="body"><div class="day">`;
        lastSi=si;
      }
      h+=itemHtml(it,id);
    });
    h+='</div></div></div>';
    list.innerHTML=h;
  }
}

    h+= open.length? open.slice(0,8).map(([id,p])=>`<div class="clitem"><div class="nm">${esc(p[0])}${p[1]?`<span class="why">${esc(p[1])}</span>`:''}</div></div>`).join('')
      : '<p class="sub">Alles erledigt – ihr seid startklar! 🎉</p>';
    h+=`<div style="margin-top:10px"><button class="btn sec" data-goto="lists">Zur Checkliste →</button></div></div>`;
    h+=bookingsCardHtml();
    h+=`<div class="card"><h2>🎫 Außerdem nicht vergessen</h2><p class="sub">${esc(PRETRIP_NOTE)}</p></div>`;
  } else if(t>TRIP_END){
    h+=`<div class="today-hero">${HERO_SVG}<div class="big">Willkommen zurück! 🛬</div>
      <div class="mini">${TRIP_DAYS} Tage Singapur · Bangkok · Koh Samui – wir hoffen, es war großartig.</div></div>`;
  } else {
    const dayNum=Math.round((new Date(t)-new Date(TRIP_START))/86400000)+1;
    // Passende Tage/Fahrten finden
    let blocks=[];
    STAGES.forEach((s,si)=>{
      if(s.drive && s.iso===t)blocks.push({type:'drive',s,si});
      if(!s.drive)s.days.forEach((d,di)=>{if(d.iso===t)blocks.push({type:'day',s,si,d,di});});
    });
    const stageName=blocks.length?blocks[blocks.length-1].s.name:'Unterwegs';
    h+=`<div class="today-hero">${HERO_SVG}<div class="big">Reisetag ${dayNum} von ${TRIP_DAYS}</div>
      <div class="mini">${esc(stageName)} · ${t.split('-').reverse().join('.')}</div></div>`;
    // Flüge heute
    FLIGHTS.filter(f=>f.iso===t).forEach(f=>h+=`<div class="card" style="padding:10px 12px">${flightHtml(f)}</div>`);
    // Buchung der aktuellen Etappe
    const bst=blocks.map(b=>b.s).find(x=>x.booking);
    if(bst)h+=bookingHtml(bst);
    // Events heute
    const evs=EVENTS.filter(e=>(e.dates||[]).includes(t));
    if(evs.length){
      h+=`<div class="card"><h2>🎉 Heute läuft</h2>`;
      evs.forEach(e=>h+=`<p>• <b>${esc(e.nm)}</b><span class="sub"> – ${esc(e.meta)}</span>${e.url?` <a class="ilink" href="${esc(e.url)}" target="_blank" rel="noopener">🔗 Infos</a>`:''}</p>`);
      h+=`</div>`;
    }
    blocks.forEach(b=>{
      if(b.type==='drive'){
        h+=`<div class="card"><h2>🚗 ${esc(b.s.name)}</h2><p class="sub">${esc(b.s.sub)}</p>`;
        if(b.s.flow){ h+=dayFlowHtml(b.s,b.s,b.si,'d'); }
        else {
          const dk=b.si+'-d',ord=dayOrder(dk,b.s.items.length);
          const names=ord.map(ii=>b.s.items[ii].map), gpx=ord.map(ii=>({nm:b.s.items[ii].nm,q:b.s.items[ii].map}));
          h+=tourBtns('Fahrt '+b.s.name,names,gpx,'Fahrt-Route (Google Maps)');
          ord.forEach(ii=>h+=itemHtml(b.s.items[ii],b.si+'-d-'+ii));
          h+=tourExtraHtml(b.s.name);
        }
        h+=`</div>`;
      } else {
        const dk=b.si+'-'+b.di,ord=dayOrder(dk,b.d.items.length);
        h+=`<div class="card"><h2>📍 ${esc(b.d.title)}</h2>`;
        h+=transitHtml(b.s)+parkingHtml(b.s);
        h+=modesHtml(b.s.name,'modes--flush');
        if(b.d.flow){ h+=dayFlowHtml(b.d,b.s,b.si,b.di); }
        else { h+=dayTours(b.d,dk,ord,b.si,b.di); h+=tourExtraHtml(b.d.title); }
        h+=`</div>`;
      }
    });
    // Morgen-Vorschau
    const tm=new Date(t);tm.setDate(tm.getDate()+1);
    const tmIso=tm.getFullYear()+'-'+String(tm.getMonth()+1).padStart(2,'0')+'-'+String(tm.getDate()).padStart(2,'0');
    let tmTxt='';
    STAGES.forEach(s=>{
      if(s.drive && s.iso===tmIso)tmTxt=s.name+' ('+s.sub.split('·')[1]+')';
      if(!s.drive)s.days.forEach(d=>{if(d.iso===tmIso)tmTxt=d.title;});
    });
    if(tmTxt)h+=`<div class="tomorrow">🔜 <b>Morgen:</b> ${esc(tmTxt)}</div>`;
  }
  el.innerHTML=h;
}

// ================= KALENDER =================
function dayByIso(iso){
  for(let si=0;si<STAGES.length;si++){const s=STAGES[si];
    if(s.drive){ if(s.iso===iso) return {si,type:'drive',s}; }
    else { for(let di=0;di<s.days.length;di++){ if(s.days[di].iso===iso) return {si,di,type:'day',s,d:s.days[di]}; } }
  }
  return null;
}
let _calSel=null;
function pad2(n){return String(n).padStart(2,'0');}
function renderCal(){
  const months=CAL_MONTHS;
  const today=isoToday();
  let h='<div class="mapnote">Tippe einen farbigen Reisetag für den Tagesplan. Farbe = Etappe.</div>';
  months.forEach(([y,m,label])=>{
    h+=`<div class="calhead"><h2>${label}</h2></div><div class="calgrid">`;
    ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d=>h+=`<div class="dow">${d}</div>`);
    const first=new Date(y,m,1);
    const lead=(first.getDay()+6)%7; // Mo-first
    const dim=new Date(y,m+1,0).getDate();
    for(let i=0;i<lead;i++)h+=`<div class="calcell empty"></div>`;
    for(let dn=1;dn<=dim;dn++){
      const iso=y+'-'+pad2(m+1)+'-'+pad2(dn);
      const b=dayByIso(iso);
      const ev=EVENTS.some(e=>(e.dates||[]).includes(iso));
      if(b){
        const col=STAGECOL[b.si]||'#a01e1e';
        const nm=b.type==='drive'?'🚗 '+b.s.name:b.s.name;
        h+=`<div class="calcell trip ${iso===today?'today':''} ${iso===_calSel?'sel':''}" data-calday="${iso}">
          <div class="dn">${dn}</div>${ev?'<div class="evdot">🎉</div>':''}
          <div class="stg" style="background:${col}">${esc(nm)}</div></div>`;
      } else {
        h+=`<div class="calcell ${iso===today?'today':''}"><div class="dn" style="color:var(--muted)">${dn}</div></div>`;
      }
    }
    h+=`</div>`;
  });
  h+=`<div class="caldetail" id="caldetail"></div>`;
  document.getElementById('cal').innerHTML=h;
  if(_calSel)renderCalDetail(_calSel);
}
function allBlocksByIso(iso){
  const out=[];
  STAGES.forEach((s,si)=>{
    if(s.drive){if(s.iso===iso)out.push({si,type:'drive',s});}
    else s.days.forEach((d,di)=>{if(d.iso===iso)out.push({si,di,type:'day',s,d});});
  });
  return out;
}
function renderCalDetail(iso){
  const el=document.getElementById('caldetail');if(!el)return;
  const blocks=allBlocksByIso(iso);
  if(!blocks.length){el.innerHTML='';return;}
  const evs=EVENTS.filter(e=>(e.dates||[]).includes(iso));
  let h='';
  if(evs.length||FLIGHTS.some(f=>f.iso===iso)){
    h+=`<div class="card"><h2>${esc(iso.split('-').reverse().join('.'))}</h2>`;
    FLIGHTS.filter(f=>f.iso===iso).forEach(f=>h+=flightHtml(f));
    evs.forEach(e=>h+=`<p style="font-size:13px">🎉 <b>${esc(e.nm)}</b> <span class="sub">– ${esc(e.meta)}</span>${e.url?` <a class="ilink" href="${esc(e.url)}" target="_blank" rel="noopener">🔗 Infos</a>`:''}</p>`);
    h+=`</div>`;
  }
  blocks.forEach(b=>{
    h+=`<div class="card"><h2>${b.type==='drive'?'🚗 '+esc(b.s.name):'📍 '+esc(b.d.title)}</h2>`;
    h+=`<p class="sub">${b.type==='day'?esc(b.d.dt):esc(b.s.sub)}</p>`;
    if(b.type==='drive'){
      if(b.s.flow){ h+=dayFlowHtml(b.s,b.s,b.si,'d'); }
      else {
        const dk=b.si+'-d',ord=dayOrder(dk,b.s.items.length);
        const names=ord.map(ii=>b.s.items[ii].map), gpx=ord.map(ii=>({nm:b.s.items[ii].nm,q:b.s.items[ii].map}));
        h+=tourBtns('Fahrt '+b.s.name,names,gpx,'Fahrt-Route (Google Maps)');
        ord.forEach(ii=>h+=itemHtml(b.s.items[ii],b.si+'-d-'+ii));
        h+=tourExtraHtml(b.s.name);
      }
    } else {
      if(b.s.booking)h+=bookingHtml(b.s); else if(b.s.hotel)h+=`<p class="sub">🏨 ${esc(b.s.hotel)}</p>`;
      h+=transitHtml(b.s)+parkingHtml(b.s);
      const dk=b.si+'-'+b.di,ord=dayOrder(dk,b.d.items.length);
      if(b.d.flow){ h+=dayFlowHtml(b.d,b.s,b.si,b.di); }
      else { h+=dayTours(b.d,dk,ord,b.si,b.di); h+=tourExtraHtml(b.d.title); }
    }
    h+=`</div>`;
  });
  el.innerHTML=h;
}

let _leaflet=null;
function legsHtml(){return `<div class="card"><h2>✈️ Etappen & Flüge</h2><div class="leglist">${LEGS.map(l=>`<div><b>${esc(l.d)}</b> ${esc(l.t)}</div>`).join('')}</div></div>`;}
function renderMap(){
  const host=document.getElementById('map');
  if(typeof L==='undefined'){ renderMapSVG(); return; }
  host.innerHTML=`<a class="routebtn" href="${routeUrl()}" target="_blank" rel="noopener">🗺️ Stationen in Google Maps öffnen</a>
    <div class="mapnote"><b>Echte Karte</b> · Tippe einen Pin für Details & Navigation. Gestrichelt = Flugstrecke.</div>
    <div id="leafmap"></div>${legsHtml()}`;
  if(_leaflet){_leaflet.remove();_leaflet=null;}
  const map=L.map('leafmap',{scrollWheelZoom:false}).setView([7.5,101.5],5);
  _leaflet=map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
  L.polyline(GEO.route.map(r=>r.ll),{color:'#0f6e6e',weight:3,dashArray:'8 7'}).addTo(map);
  const bounds=[];
  GEO.route.forEach(r=>{
    bounds.push(r.ll);
    const ic=L.divIcon({className:'',html:`<div style="background:#0f6e6e;color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.4)">${STAGES[r.si].badge}</div>`,iconSize:[26,26],iconAnchor:[13,13]});
    L.marker(r.ll,{icon:ic}).addTo(map).bindPopup(`<b>${esc(r.nm)}</b><br>${esc(STAGES[r.si].sub)}<br><a href="#" onclick="gotoStage(${r.si});return false;">→ zum Tagesplan</a>`);
  });
  GEO.pins.forEach(p=>{
    const ic=L.divIcon({className:'',html:`<div style="background:#c8932a;border:2px solid #fff;border-radius:50%;width:12px;height:12px;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>`,iconSize:[12,12],iconAnchor:[6,6]});
    L.marker(p.ll,{icon:ic}).addTo(map).bindPopup(`<b>${esc(p.nm)}</b><br><a href="${mapUrl(p.q)}" target="_blank" rel="noopener">🧭 In Google Maps öffnen</a>`);
  });
  map.fitBounds(bounds,{padding:[30,30]});
  setTimeout(()=>map.invalidateSize(),200);
}

  const price=(ci&&co)?` · <a class="pricelink" href="${esc(bookUrl(ht.nm,ci,co))}" target="_blank" rel="noopener">💶 Preis/Verfügbarkeit</a>`:'';

function stayHead(badge,nm,sub){
  return `<div class="staybk-h"><span class="badge">${badge}</span><div style="min-width:0"><div class="staybk-nm">${esc(nm)}</div><div class="sub">${esc(sub)}</div></div></div>`;

function fewoSearchUrl(base,dest,ci,co){return base+'/search?destination='+encodeURIComponent(dest)+'&startDate='+ci+'&endDate='+co+'&adults=2';}
function fewoBlock(sug){
  if(!sug.fewo)return '';
  const f=sug.fewo;
  const apts=(f.apts||[]).map(a=>{
    const web=a.u?` · <a href="${esc(a.u)}" target="_blank" rel="noopener" style="color:var(--green);text-decoration:none">🔗 Web</a>`:'';
    return `<div class="stayh"><div class="stayh-nm">${esc(a.nm)}</div><div class="stayh-meta">${esc(a.meta)}</div><div class="stayh-links"><a href="${mapUrl(a.q)}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none">🧭 Karte</a>${web}</div></div>`;
  }).join('');
  const fewo=fewoSearchUrl('https://www.fewo-direkt.de',f.dest,sug.ci,sug.co);
  const vrbo=fewoSearchUrl('https://www.vrbo.com',f.dest,sug.ci,sug.co);
  return `<div class="staysub">🏡 Ferienwohnung / Apartment</div>${apts}
    <div class="fewo-links"><a href="${esc(fewo)}" target="_blank" rel="noopener">🏡 FeWo-direkt (${esc(f.dest.split(',')[0])})</a> <a href="${esc(vrbo)}" target="_blank" rel="noopener">🌍 Vrbo</a></div>
    <div class="stayh-meta" style="margin-top:5px">Links öffnen die Suche mit eurem Zeitraum & 2 Personen – konkrete Inserate wechseln, daher live prüfen.</div>`;
}

function dayNumFor(iso){return Math.round((new Date(iso)-new Date(TRIP_START))/86400000)+1;}

      h+=`<div class="stage"><div class="head" style="cursor:default"><span class="badge">${s.badge}</span><div style="flex:1"><h2>${esc(s.name)}</h2></div></div><div class="body"><div class="day">`;
      favs.forEach(([it,id])=>{h+=itemHtml(it,id);n++;});
      h+=`</div></div></div>`;
    }
  });
  document.getElementById('favs').innerHTML = n? h : '<div class="empty">Noch keine Favoriten.<br>Tippe bei einem Spot auf den ☆-Stern.</div>';
}

// ================= LISTEN =================
function clBlock(title,arr,prefix,emoji){
  const chk=state._check||{};
  let done=0;
  let rows=arr.map((p,i)=>{
    const id=prefix+'-'+i; if(chk[id])done++;
    return `<div class="clitem ${chk[id]?'done':''}">
      <input type="checkbox" class="cb clcb" data-cl="${id}" ${chk[id]?'checked':''}>
      <div class="nm">${esc(p[0])}${p[1]?`<span class="why">${esc(p[1])}</span>`:''}</div></div>`;
  }).join('');
  const customs=(state._custom||[]).filter(c=>c.list===prefix);
  customs.forEach((c,i)=>{
    const id=prefix+'-x-'+i; if(chk[id])done++;
    rows+=`<div class="clitem ${chk[id]?'done':''}">
      <input type="checkbox" class="cb clcb" data-cl="${id}" ${chk[id]?'checked':''}>
      <div class="nm">${esc(c.nm)}</div>
      <button class="x bentry-x" data-delc="${prefix}|${i}" style="border:0;background:none;color:#c25555;cursor:pointer">✕</button></div>`;
  });
  const total=arr.length+customs.length;
  return `<div class="card"><h2>${emoji} ${title} <span class="sub" style="font-weight:400">· ${done}/${total}</span></h2>${rows}
    <div class="addrow"><input type="text" placeholder="Eigenen Punkt hinzufügen…" data-addinp="${prefix}">
    <button class="btn sec" data-add="${prefix}">+</button></div></div>`;
}
function renderLists(){
  document.getElementById('lists').innerHTML =
    clBlock('Reisevorbereitung',PREP,'prep','🎫') + clBlock('Packliste',PACK,'pack','🧳');
}

// ================= RESERVIERUNGEN =================
function renderResv(){
  const chk=state._check||{}; let done=0,total=0,body='';
  RESV.forEach((grp,gi)=>{
    let rows='';
    grp.items.forEach((it,ii)=>{
      const id='resv-'+gi+'-'+ii; total++; if(chk[id])done++;
      const link=it[2]?`<div style="margin-top:6px"><a class="ilink" href="${it[2]}" target="_blank" rel="noopener">🔗 online buchen</a></div>`:'';
      rows+=`<div class="clitem ${chk[id]?'done':''}">
      <input type="checkbox" class="cb clcb" data-cl="${id}" ${chk[id]?'checked':''}>
      <div class="nm">${esc(it[0])}${it[1]?`<span class="why">${esc(it[1])}</span>`:''}${link}</div></div>`;
    });
    body+=`<div class="card"><h2>${grp.sec}</h2>${rows}</div>`;
  });
  const intro=`<div class="card"><h2>🎟️ Reservierungen <span class="sub" style="font-weight:400">· ${done}/${total} erledigt</span></h2>
    <p class="sub">Bereits gebucht (Wal-/Bärentour, AURA, Mietwagen, alle Unterkünfte) sind hier nicht gelistet. <b>⚠️ = Kontingent oft knapp → zuerst sichern.</b></p></div>`;
  document.getElementById('resv').innerHTML=intro+body;
}

// ================= BUDGET =================
function renderBudget(){
  const b=state._budget||[]; const R=Object.assign({},CURRATES,state._rates||{});
  const toEur=e=>e.cur==='EUR'?e.amt:e.amt*(R[e.cur]||0);
  const totEur=b.reduce((s,e)=>s+toEur(e),0);
  const byCat={};b.forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+toEur(e);});
  const maxCat=Math.max(1,...Object.values(byCat));
  let h=`<div class="card"><h2>💰 Ausgabe erfassen</h2>
    <div class="brow">
      <input type="text" id="bdesc" class="bfull" placeholder="Was? (z. B. Abendessen Maxwell Hawker)">
      <input type="number" id="bamt" inputmode="decimal" step="0.01" placeholder="Betrag">
      <select id="bcur">${Object.keys(CURRATES).concat('EUR').map(c=>`<option>${c}</option>`).join('')}</select>
      <select id="bcat" class="bfull">${BCATS.map(c=>`<option>${c}</option>`).join('')}</select>
    </div>
    <button class="btn" id="badd">Hinzufügen</button>
    ${Object.keys(CURRATES).map(c=>`<div class="rate">Kurs: 1 ${c} = <input type="number" class="brate" data-cur="${c}" step="0.001" value="${R[c]}"> EUR</div>`).join('')}
  </div>`;
  h+=`<div class="card"><h2>📊 Übersicht</h2><div class="btotal">
      <div class="box"><div class="v">${totEur.toFixed(0)} €</div><div class="l">Gesamt EUR</div></div>
      <div class="box"><div class="v">${b.length}</div><div class="l">Einträge</div></div></div>`;
  BCATS.forEach(c=>{ if(!byCat[c])return;
    h+=`<div class="bcat"><div class="lbl"><span>${c}</span><b>${byCat[c].toFixed(0)} €</b></div><div class="bar"><i style="width:${(byCat[c]/maxCat*100).toFixed(0)}%"></i></div></div>`; });
  h+='</div>';
  if(b.length){ h+='<div class="card"><h2>🧾 Einträge</h2>';
    [...b].reverse().forEach(e=>{ h+=`<div class="bentry"><span class="d">${e.d}</span><span class="n">${esc(e.nm)}<br><span style="font-size:11px;color:var(--muted)">${e.cat} · ≈ ${toEur(e).toFixed(2)} €</span></span><span class="a">${e.amt.toFixed(2)} ${e.cur}</span><button class="x" data-bdel="${e.id}">✕</button></div>`; });
    h+='</div>'; }
  document.getElementById('budget').innerHTML=h;
}
// ================= INFO =================
function renderInfo(){
  document.getElementById('info').innerHTML=INFO_CARDS.map(c=>`<div class="card info"><h2>${c.h}</h2>${c.p.map(p=>`<p${p.startsWith('~')?' class="sub"':''}>${p.replace(/^~/,'')}</p>`).join('')}</div>`).join('')+`
  <div class="card info"><h2>💾 Daten & Backup</h2>
    <p class="sub">Stand exportieren (z. B. vom PC aufs Handy übertragen) oder importieren:</p>
    <div style="display:flex;gap:8px;margin:8px 0;flex-wrap:wrap">
      <button class="btn sec" id="expBtn">📤 Exportieren</button>
      <button class="btn sec" id="impBtn">📥 Importieren</button>
      <button class="btn danger" id="resetBtn">Alles zurücksetzen</button>
    </div>
    <textarea class="io" id="ioArea" placeholder="Export erscheint hier / Import-JSON hier einfügen…"></textarea></div>`;
}
// ================= PROGRESS =================
function updateProgress(){
  let total=0,done=0;
  STAGES.forEach((s,si)=>{stageIds(s,si).forEach(id=>{total++;if(get(id).done)done++;});});
  const pct= total? Math.round(done/total*100):0;
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('ptxt').textContent=`${done} von ${total} Spots erledigt · ${pct}%`;
  // Etappen-Zähler aktualisieren
  document.querySelectorAll('[data-cnt]').forEach(el=>{
    const si=+el.dataset.cnt;const ids=stageIds(STAGES[si],si);
    el.textContent=ids.filter(id=>get(id).done).length+'/'+ids.length;
  });
}
function updateCountdown(){
  const t=isoToday();const el=document.getElementById('countdown');
  if(t<TRIP_START){const days=Math.ceil((new Date(TRIP_START)-new Date(t))/86400000);
    el.textContent=`✈️ Noch ${days} Tage bis zur Abreise`;}
  else if(t>TRIP_END){el.textContent='🛬 Reise abgeschlossen';}
  else{const n=Math.round((new Date(t)-new Date(TRIP_START))/86400000)+1;
    el.textContent=`🌴 Reisetag ${n} von ${TRIP_DAYS}`;}
}

// ================= INTERAKTION =================
document.addEventListener('click',e=>{
  // Etappe auf/zu
  const head=e.target.closest('.stage > .head');
  if(head && head.parentElement.dataset.si!==undefined && document.getElementById('planList').contains(head)){
    head.parentElement.classList.toggle('collapsed');return;}
  // Stern
  if(e.target.classList.contains('star')){
    const it=e.target.closest('.item');const id=it.dataset.id;const nv=!get(id).fav;
    setv(id,'fav',nv);e.target.classList.toggle('on',nv);e.target.textContent=nv?'★':'☆';return;}
  // Notiz
  if(e.target.classList.contains('noteBtn')){
    const ta=e.target.closest('.item').querySelector('.note');ta.classList.toggle('show');if(ta.classList.contains('show'))ta.focus();return;}
  // Hintergrund-Info auf-/zuklappen (Klick auf Namen oder „ℹ️ Hintergrund")
  if(e.target.classList.contains('infoBtn') || e.target.closest('.nm.hasinfo')){
    const it=e.target.closest('.item');if(it&&it.querySelector('.infopanel'))it.classList.toggle('openinfo');return;}
  // Schlechtwetter-/Entspannen-Button auf-/zuklappen
  if(e.target.classList.contains('modebtn')){
    e.target.closest('.mode').classList.toggle('open');return;}
  // Sortier-Pfeile
  if(e.target.classList.contains('ordup')||e.target.classList.contains('orddn')){
    moveInDay(e.target.dataset.daykey,+e.target.dataset.pos,e.target.classList.contains('ordup')?-1:1);return;}
  // Kalendertag → Tagesplan
  const cc=e.target.closest('.calcell.trip');
  if(cc){_calSel=cc.dataset.calday;renderCal();const dt=document.getElementById('caldetail');if(dt)dt.scrollIntoView({behavior:'smooth',block:'nearest'});return;}
  // GPX-Download (Komoot)
  if(e.target.classList.contains('gpx')){
    try{
      const stops=JSON.parse(e.target.dataset.gpx);const nm=e.target.dataset.gpxname||'Tour';
      const g=buildGpx(nm,stops);
      if(!g){alert('Für diese Tour liegen noch keine GPS-Koordinaten vor – nutze den Google-Maps-Routenlink (der funktioniert immer).');return;}
      const blob=new Blob([g],{type:'application/gpx+xml'});const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download=nm.replace(/[^\w]+/g,'_')+'.gpx';a.click();
    }catch(_){}
    return;}
  // PDF / Druck
  if(e.target.id==='pdfBtn'){doPrint();return;}
  // Reisebericht kopieren
  if(e.target.id==='storyCopyBtn'){
    const done=()=>{e.target.textContent='✓ Kopiert!';setTimeout(()=>{e.target.textContent='📋 Als Text kopieren';},1800);};
    try{navigator.clipboard.writeText(_storyText).then(done,()=>done());}
    catch(_){alert('Kopieren nicht möglich – bitte den Text manuell markieren.');}
    return;}
  // Chips
  if(e.target.classList.contains('chip')){filterGrp=e.target.dataset.grp;renderChips();renderPlan();updateProgress();return;}
  // Karte → Etappe
  const mn=e.target.closest('.mnode');
  if(mn && mn.dataset.si!==''){
    switchTab('plan');
    const st=document.getElementById('stage-'+mn.dataset.si);
    if(st){st.classList.remove('collapsed');st.scrollIntoView({behavior:'smooth',block:'start'});}
    return;}
  // Heute → Listen
  if(e.target.dataset.goto){switchTab(e.target.dataset.goto);return;}
  // Checklisten: eigener Punkt
  if(e.target.dataset.add!==undefined && e.target.dataset.add){
    const pre=e.target.dataset.add;
    const inp=document.querySelector(`[data-addinp="${pre}"]`);
    if(inp.value.trim()){state._custom=(state._custom||[]);state._custom.push({list:pre,nm:inp.value.trim()});save();renderLists();}
    return;}
  if(e.target.dataset.delc){
    const [pre,i]=e.target.dataset.delc.split('|');
    const customs=(state._custom||[]).filter(c=>c.list===pre);
    const all=state._custom||[];const target=customs[+i];
    state._custom=all.filter(c=>c!==target);save();renderLists();return;}
  // Budget
  if(e.target.id==='badd'){
    const nm=document.getElementById('bdesc').value.trim();
    const amt=parseFloat(document.getElementById('bamt').value);
    if(!nm||!amt||amt<=0)return;
    const cur=document.getElementById('bcur').value, cat=document.getElementById('bcat').value;
    const d=new Date();const ds=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';
    state._budget=(state._budget||[]);state._budget.push({id:Date.now(),d:ds,nm,amt,cur,cat});
    save();renderBudget();return;}
  if(e.target.dataset.bdel){
    state._budget=(state._budget||[]).filter(x=>String(x.id)!==e.target.dataset.bdel);save();renderBudget();return;}
  // Backup
  if(e.target.id==='expBtn'){
    const j=JSON.stringify(state);document.getElementById('ioArea').value=j;
    try{navigator.clipboard.writeText(j);}catch(_){}
    const blob=new Blob([j],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='thailand2026-backup.json';a.click();return;}
  if(e.target.id==='impBtn'){
    try{const j=JSON.parse(document.getElementById('ioArea').value);state=j;save();
      renderAll();alert('Import erfolgreich!');}
    catch(_){alert('Ungültiges JSON – bitte kompletten Export einfügen.');}return;}
  if(e.target.id==='resetBtn'){
    if(confirm('Wirklich ALLES löschen (Häkchen, Favoriten, Notizen, Budget, Listen)?')){state={};save();renderAll();}return;}
  if(e.target.id==='themeBtn'){
    const cur=document.body.dataset.theme==='dark'?'light':'dark';
    document.body.dataset.theme=cur;state._theme=cur;save();
    e.target.textContent=cur==='dark'?'☀️':'🌙';return;}
});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('clcb')){
    state._check=Object.assign({},state._check,{[e.target.dataset.cl]:e.target.checked});save();
    e.target.closest('.clitem').classList.toggle('done',e.target.checked);
    renderLists();if(typeof renderResv==='function')renderResv();return;}
  if(e.target.classList.contains('cb')&&e.target.closest('.item')){
    const it=e.target.closest('.item');const id=it.dataset.id;setv(id,'done',e.target.checked);
    it.classList.toggle('done',e.target.checked);}
  if(e.target.classList.contains('brate')){state._rates=Object.assign({},state._rates,{[e.target.dataset.cur]:parseFloat(e.target.value)||CURRATES[e.target.dataset.cur]});save();renderBudget();}
});
document.addEventListener('input',e=>{
  if(e.target.classList.contains('note')){const id=e.target.closest('.item').dataset.id;setv(id,'note',e.target.value);}
  if(e.target.id==='q'){filterQ=e.target.value;renderPlan();updateProgress();}
});
// Drag & Drop (Desktop)
let _drag=null;
document.addEventListener('dragstart',e=>{
  const it=e.target.closest('.item[draggable="true"]');if(!it)return;
  _drag={dayKey:it.dataset.daykey,pos:+it.dataset.pos};it.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',it.dataset.pos);}catch(_){}
});
document.addEventListener('dragover',e=>{
  const it=e.target.closest('.item[draggable="true"]');
  if(!it||!_drag||it.dataset.daykey!==_drag.dayKey)return;
  e.preventDefault();
  document.querySelectorAll('.item.dragover').forEach(x=>x.classList.remove('dragover'));
  it.classList.add('dragover');
});
document.addEventListener('drop',e=>{
  const it=e.target.closest('.item[draggable="true"]');
  if(!it||!_drag||it.dataset.daykey!==_drag.dayKey)return;
  e.preventDefault();
  const from=_drag.pos,to=+it.dataset.pos;
  if(from!==to){
    const day=findDay(_drag.dayKey);
    const o=dayOrder(_drag.dayKey,day.items.length).slice();
    const [m]=o.splice(from,1);o.splice(to,0,m);
    setDayOrder(_drag.dayKey,o);renderPlan();syncPlanChecks();updateProgress();
  }
  _drag=null;
});
document.addEventListener('dragend',()=>{
  document.querySelectorAll('.dragging,.dragover').forEach(x=>x.classList.remove('dragging','dragover'));_drag=null;
});
function syncPlanChecks(){
  document.querySelectorAll('#planList .item').forEach(el=>{
    const st=get(el.dataset.id);
    el.classList.toggle('done',!!st.done);
    const cb=el.querySelector('.cb');if(cb)cb.checked=!!st.done;
    const star=el.querySelector('.star');if(star){star.classList.toggle('on',!!st.fav);star.textContent=st.fav?'★':'☆';}
  });
}
function switchTab(t){
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('show',p.id===t));
  if(t==='favs')renderFavs();
  if(t==='today')renderToday();
  if(t==='budget')renderBudget();
  if(t==='lists')renderLists();
  if(t==='resv')renderResv();
  if(t==='cal')renderCal();
  if(t==='story')renderStory();
  if(t==='stays')renderStays();
  if(t==='map')renderMap();
  if(t==='plan'){syncPlanChecks();updateProgress();}
  window.scrollTo({top:0});
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

// ================= INIT =================
function renderAll(){
  renderChips();renderPlan();renderEvents();renderToday();renderLists();renderResv();renderBudget();renderInfo();updateProgress();updateCountdown();
  // Karte & Kalender werden beim Öffnen des jeweiligen Tabs gerendert (Leaflet braucht sichtbaren Container)
  const act=document.querySelector('nav.tabs button.active');
  if(act&&act.dataset.tab==='map')renderMap();
  if(act&&act.dataset.tab==='cal')renderCal();
}
if(state._theme==='dark'||(!state._theme&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)){
  document.body.dataset.theme='dark';document.getElementById('themeBtn').textContent='☀️';
}
renderAll();
</script>
</body>
