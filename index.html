<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reiseplan Wildschönau / Auffach – 21.05.–06.06.2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf7;
  --surface:#ffffff;
  --text:#1a1a1a;
  --muted:#5a5a5a;
  --border:#e5e3dc;
  --accent:#2d5a3d;
  --accent-light:#e8f0ea;
  --accent-hover:#1f4029;
  --warning:#b45309;
  --warning-bg:#fef3c7;
  --sidebar:#f4f1ea;
  --code-bg:#f0ede5;
  --shadow:0 1px 3px rgba(0,0,0,0.05),0 1px 2px rgba(0,0,0,0.03);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  font-size:16px;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.sidebar{
  background:var(--sidebar);
  border-right:1px solid var(--border);
  padding:1.5rem 1rem;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.brand{
  font-family:'Merriweather',serif;
  font-weight:700;
  font-size:1.15rem;
  color:var(--accent);
  margin-bottom:0.25rem;
  line-height:1.3;
}
.brand-sub{
  font-size:0.78rem;
  color:var(--muted);
  margin-bottom:1.5rem;
  line-height:1.4;
}
.menu-title{
  font-size:0.7rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--muted);
  margin:1rem 0 0.5rem;
  padding:0 0.5rem;
}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a{
  display:block;
  padding:0.5rem 0.75rem;
  border-radius:6px;
  font-size:0.875rem;
  color:var(--text);
  transition:all 0.15s;
  border-left:3px solid transparent;
}
.nav a:hover{
  background:var(--accent-light);
  text-decoration:none;
}
.nav a.active{
  background:var(--accent-light);
  color:var(--accent);
  font-weight:600;
  border-left-color:var(--accent);
}
.nav a.sub{
  font-size:0.8rem;
  padding-left:1.5rem;
  color:var(--muted);
}
.main{padding:2.5rem 3rem;max-width:920px}
#content h1{
  font-family:'Merriweather',serif;
  font-size:2rem;
  margin-top:2.5rem;
  margin-bottom:1rem;
  color:var(--accent);
  border-bottom:2px solid var(--border);
  padding-bottom:0.5rem;
  scroll-margin-top:1rem;
}
#content h1:first-child{margin-top:0}
#content h2{
  font-family:'Merriweather',serif;
  font-size:1.4rem;
  margin-top:2rem;
  margin-bottom:0.75rem;
  color:var(--text);
  scroll-margin-top:1rem;
}
#content h3{
  font-size:1.1rem;
  margin-top:1.5rem;
  margin-bottom:0.5rem;
  color:var(--accent);
  font-weight:600;
}
#content p{margin:0.7rem 0}
#content ul,#content ol{margin:0.6rem 0;padding-left:1.5rem}
#content li{margin:0.25rem 0}
#content blockquote{
  margin:1rem 0;
  padding:0.75rem 1rem;
  background:var(--warning-bg);
  border-left:4px solid var(--warning);
  border-radius:4px;
  color:#78350f;
}
#content blockquote p{margin:0.3rem 0}
#content table{
  border-collapse:collapse;
  width:100%;
  margin:1rem 0;
  font-size:0.9rem;
  background:var(--surface);
  box-shadow:var(--shadow);
  border-radius:6px;
  overflow:hidden;
}
#content table th{
  background:var(--accent);
  color:white;
  padding:0.6rem 0.8rem;
  text-align:left;
  font-weight:600;
  font-size:0.85rem;
}
#content table td{
  padding:0.5rem 0.8rem;
  border-bottom:1px solid var(--border);
  vertical-align:top;
}
#content table tr:last-child td{border-bottom:none}
#content table tr:nth-child(even) td{background:var(--bg)}
#content code{
  background:var(--code-bg);
  padding:0.1rem 0.35rem;
  border-radius:3px;
  font-size:0.9em;
  font-family:'SF Mono',Consolas,monospace;
}
#content hr{
  border:none;
  border-top:1px solid var(--border);
  margin:2rem 0;
}
#content strong{color:var(--text);font-weight:600}
.menu-toggle{
  display:none;
  position:fixed;
  top:1rem;
  left:1rem;
  z-index:100;
  background:var(--accent);
  color:white;
  border:none;
  padding:0.6rem 0.9rem;
  border-radius:6px;
  cursor:pointer;
  box-shadow:var(--shadow);
  font-size:1.1rem;
}
.loading{
  text-align:center;
  padding:4rem 1rem;
  color:var(--muted);
}
.print-link{
  display:inline-block;
  margin-top:1.5rem;
  padding:0.4rem 0.8rem;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:4px;
  font-size:0.8rem;
  color:var(--muted);
}
.print-link:hover{background:var(--accent-light);text-decoration:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{
    position:fixed;
    top:0;
    left:0;
    width:280px;
    height:100vh;
    transform:translateX(-100%);
    transition:transform 0.25s ease;
    z-index:50;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
  }
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:block}
  .main{padding:4rem 1.25rem 2rem}
  #content h1{font-size:1.6rem}
  #content h2{font-size:1.2rem}
  #content table{font-size:0.8rem}
}
@media print{
  .sidebar,.menu-toggle{display:none}
  .layout{grid-template-columns:1fr}
  .main{padding:1rem;max-width:100%}
  #content h1{page-break-before:always}
  #content h1:first-child{page-break-before:auto}
}
</style>
</head>
<body>
<button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰ Menü</button>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">Reise Tirol 2026</div>
    <div class="brand-sub">Wildschönau / Auffach<br>21.05.–06.06.2026 · 4 Erw.</div>
    <div class="menu-title">Inhalt</div>
    <nav class="nav" id="nav"></nav>
    <a href="reiseplan.md" class="print-link" download>📄 Markdown-Original</a>
  </aside>
  <main class="main">
    <article id="content"><div class="loading">Lade Reiseplan…</div></article>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
function slugify(text){
  return text.toLowerCase()
    .replace(/[^\w\säöüß-]/g,'')
    .replace(/\s+/g,'-')
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .substring(0,80);
}

async function load(){
  try{
    const res = await fetch('reiseplan.md');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const md = await res.text();
    marked.setOptions({gfm:true,breaks:false});
    const html = marked.parse(md);
    const content = document.getElementById('content');
    content.innerHTML = html;

    // Build navigation from H1s (and add H2s as sub items)
    const headings = content.querySelectorAll('h1, h2');
    const nav = document.getElementById('nav');
    nav.innerHTML = '';
    const used = new Set();
    headings.forEach(h => {
      let id = slugify(h.textContent);
      let n = 1;
      while(used.has(id)){id = slugify(h.textContent)+'-'+(++n)}
      used.add(id);
      h.id = id;
      const a = document.createElement('a');
      a.href = '#'+id;
      a.textContent = h.textContent.replace(/^[#\s]+/,'').replace(/^[A-M]\s·\s/,'');
      if(h.tagName === 'H2') a.classList.add('sub');
      nav.appendChild(a);
    });

    // ScrollSpy
    const navLinks = nav.querySelectorAll('a');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if(e.isIntersecting){
          navLinks.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#'+e.target.id));
        }
      });
    }, {rootMargin:'-20% 0px -70% 0px'});
    headings.forEach(h => observer.observe(h));

    // Close sidebar on link click (mobile)
    navLinks.forEach(l => l.addEventListener('click', () => {
      if(window.innerWidth <= 900){
        document.querySelector('.sidebar').classList.remove('open');
      }
    }));

    // Anchor scroll on load
    if(location.hash){
      const el = document.querySelector(location.hash);
      if(el) setTimeout(() => el.scrollIntoView({behavior:'smooth'}), 100);
    }
  } catch(err){
    document.getElementById('content').innerHTML =
      '<div class="loading">Fehler beim Laden: '+err.message+'<br><br>'+
      'Bitte stellen Sie sicher, dass die Datei <code>reiseplan.md</code> erreichbar ist.</div>';
  }
}
load();
</script>
</body>
</html>
