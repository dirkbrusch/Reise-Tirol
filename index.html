<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f6e6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thailand 2026">
<title>Singapur & Thailand 2026 – Reise-App</title>
<style>
  :root{
    --maple:#0f6e6e; --maple-dk:#0a4f55; --cream:#faf6ef; --ink:#23201d; --muted:#6f6757;
    --card:#ffffff; --line:#e7e0d4; --gold:#c8932a; --green:#2f6b4f; --blue:#1a73e8;
    --soft:#f2ece1; --soft2:#fffdf8; --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.06);
  }
  body[data-theme="dark"]{
    --cream:#161311; --ink:#efe9df; --muted:#a99e8d; --card:#221e1a; --line:#3a342c;
    --soft:#2b2620; --soft2:#262119; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--cream);color:var(--ink);line-height:1.45;-webkit-text-size-adjust:100%}
  header{position:relative;overflow:hidden;z-index:20;background:linear-gradient(135deg,var(--maple),var(--maple-dk));
    color:#fff;padding:14px 16px;box-shadow:var(--shadow)}
  header .headerbg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  header::after{content:"";position:absolute;inset:0;z-index:0;
    background:linear-gradient(110deg,rgba(8,62,70,.92) 0%,rgba(10,79,85,.55) 45%,rgba(196,120,40,.30) 100%)}
  header .row,header .count,header .progress,header .progress-txt{position:relative;z-index:1}
  header .row{display:flex;align-items:flex-start;gap:8px}
  header .t{font-size:18px;font-weight:700;letter-spacing:.2px;flex:1}
  header .s{font-size:12.5px;opacity:.9;margin-top:2px}
  .iconbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;width:34px;height:34px;
    font-size:16px;cursor:pointer;flex:none}
  .count{margin-top:8px;font-size:12.5px;background:rgba(255,255,255,.14);border-radius:10px;padding:7px 10px;display:inline-block}
  .progress{margin-top:10px;height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
  .progress > i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
  .progress-txt{font-size:11px;opacity:.9;margin-top:4px}
  nav.tabs{position:sticky;top:0;z-index:15;display:flex;background:var(--card);border-bottom:1px solid var(--line);
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:0 0 auto;border:0;background:none;padding:12px 13px;font-size:13px;font-weight:600;color:var(--muted);
    border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  nav.tabs button.active{color:var(--maple);border-bottom-color:var(--maple)}
  .wrap{max-width:760px;margin:0 auto;padding:14px 12px 60px}
  .pane{display:none}.pane.show{display:block}
  /* Toolbar / Suche */
  .search{display:flex;gap:8px;margin-bottom:10px}
  .search input{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;
    background:var(--card);color:var(--ink)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:99px;padding:6px 11px;cursor:pointer}
  .chip.on{background:var(--maple);border-color:var(--maple);color:#fff}
  /* Etappen */
  .stage{margin:0 0 14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
  .stage > .head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:var(--card)}
  .stage > .head .badge{background:var(--maple);color:#fff;font-size:12px;font-weight:700;border-radius:8px;
    min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex:none}
  .stage > .head h2{font-size:15.5px;margin:0}
  .stage > .head .sub{font-size:11.5px;color:var(--muted);font-weight:500;display:block;margin-top:1px}
  .stage > .head .cnt{font-size:11px;color:var(--muted);background:var(--soft);border-radius:8px;padding:3px 8px;flex:none}
  .stage > .head .chev{color:var(--muted);transition:transform .2s;flex:none}
  .stage.collapsed .chev{transform:rotate(-90deg)}
  .stage.collapsed .body{display:none}
  .hotel{font-size:12px;color:var(--green);background:rgba(47,107,79,.09);padding:8px 14px;border-top:1px dashed var(--line)}
  .booking{font-size:12.5px;background:rgba(26,115,232,.08);border:1px solid rgba(26,115,232,.25);border-radius:12px;padding:10px 12px;margin:10px 14px}
  .booking .bk{font-weight:700;color:var(--ink);font-size:13.5px}
  .booking .ad{color:var(--muted);margin-top:1px}
  .booking .mk{margin-top:6px;font-size:12px}
  .booking .mk a,.booking a.bmap{color:var(--blue);text-decoration:none}
  .booking .warn{color:#b5651d;margin-top:6px;font-size:11.5px}
  .flight{display:flex;gap:10px;align-items:center;background:rgba(15,110,110,.06);border:1px solid rgba(15,110,110,.2);border-radius:12px;padding:10px 12px;margin:8px 0}
  .flight .fno{font-weight:800;color:var(--maple);font-size:14px;white-space:nowrap}
  .flight .ftxt{font-size:12.5px}
  .transit{font-size:12.5px;background:rgba(124,92,191,.09);border:1px solid rgba(124,92,191,.25);border-radius:12px;padding:9px 12px;margin:8px 14px}
  .transit a{color:var(--blue);text-decoration:none}
  .parking{font-size:12.5px;background:rgba(47,107,79,.08);border:1px solid rgba(47,107,79,.22);border-radius:12px;padding:9px 12px;margin:8px 14px}
  .shopping{font-size:12.5px;background:rgba(199,62,120,.08);border:1px solid rgba(199,62,120,.28);border-radius:12px;padding:9px 12px;margin:8px 14px}
  .shopping ul{margin:5px 0 0;padding-left:18px}
  .shopping li{margin:2px 0}
  .shopping a{color:var(--blue);text-decoration:none}
  .extras{font-size:12.5px;background:var(--soft2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:8px 14px}
  .extras .ex-sec{margin-top:9px}
  .extras .ex-sec:first-child{margin-top:0}
  .extras h5{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--maple);margin:0 0 3px;font-weight:800}
  .extras ul{margin:0;padding-left:18px}
  .extras li{margin:2px 0}
  .extras a{color:var(--blue);text-decoration:none}
  /* Tagesroute */
  .dayroute{background:linear-gradient(180deg,var(--soft2),var(--card));border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;padding:11px 13px;margin:10px 0 6px}
  .dayroute .rt-head{font-size:13.5px}
  .dayroute .rt-mode{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:4px}
  .dayroute .rt-lead{font-size:12.5px;color:var(--ink);margin:5px 0 9px;line-height:1.5}
  .rt-list{list-style:none;margin:0;padding:0}
  .rt-list li{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13px;line-height:1.45}
  .rt-list li .rt-n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .rt-list li.rt-gem .rt-n{background:var(--gold)}
  .rt-list li.rt-gem b{color:#a5781f}
  .rt-d{color:var(--muted);font-size:12px}
  .rt-btn{display:inline-flex;align-items:center;gap:6px;margin-top:9px;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;font-size:12.5px;padding:8px 12px;border-radius:10px}
  .rt-list li.rt-part{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--maple);padding:9px 0 1px}
  .rt-list li.rt-transfer{color:var(--muted);font-size:12px;gap:5px;padding:3px 0 4px 3px}
  .rt-list li.rt-transfer b{color:var(--ink)}
  /* Integrierter Tagesablauf */
  .pbadge{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:6px;margin-right:6px;vertical-align:middle;letter-spacing:.3px}
  .pbadge.must{background:var(--maple);color:#fff}
  .pbadge.gem{background:rgba(200,147,42,.2);color:#a8781f}
  body[data-theme="dark"] .pbadge.gem{color:#e0b552}
  .item.isgem{border-left:3px solid var(--gold)}
  .fseg{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--maple);margin:14px 0 3px;padding-top:9px;border-top:1px solid var(--line)}
  .fseg:first-of-type{border-top:0;padding-top:0;margin-top:4px}
  .ftr{color:var(--muted);font-size:12.5px;margin:5px 0 5px 8px;padding:2px 0 2px 8px;border-left:2px dashed var(--line)}
  .ftr b{color:var(--ink)}
  .ftr.fhome{border-left-color:var(--green);background:rgba(47,107,79,.06);border-radius:0 8px 8px 0}
  .dayflow{margin-top:6px}
  .tchip{display:inline-block;font-size:10px;font-weight:800;background:var(--soft);color:var(--ink);padding:1px 7px;border-radius:6px;margin-right:6px;vertical-align:middle;white-space:nowrap}
  .fnote{background:rgba(200,147,42,.12);border:1px solid rgba(200,147,42,.3);border-radius:11px;padding:9px 12px;margin:4px 0 8px;font-size:12.5px;line-height:1.55}
  .fnote b{color:var(--maple)}
  /* Fuß-Distanz zwischen Stopps (berechnet aus Koordinaten) */
  .fleg{display:flex;align-items:center;gap:7px;margin:1px 0 1px 22px;font-size:11.5px;color:var(--muted);font-weight:600}
  .fleg::before{content:"";width:2px;height:15px;background:linear-gradient(var(--line),var(--blue));border-radius:2px;flex:none}
  .fleg-t{background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap}
  .fleg-far .fleg-t{background:transparent;border-style:dashed;color:var(--muted);opacity:.9}
  .daydist{display:inline-block;margin-left:8px;background:var(--green);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:3px 10px;vertical-align:middle;letter-spacing:.2px}
  .fwarn{display:flex;gap:7px;align-items:flex-start;background:rgba(181,101,29,.13);border:1px solid rgba(181,101,29,.36);border-radius:11px;padding:8px 11px;margin:4px 0 8px 8px;font-size:12px;line-height:1.5;color:#8a4d16}
  body[data-theme="dark"] .fwarn{color:#e0a468}
  .fwarn b{color:#b5651d}
  .wxbar{display:flex;gap:9px;align-items:flex-start;background:rgba(26,115,232,.09);border:1px solid rgba(26,115,232,.28);border-radius:12px;padding:10px 12px;margin:2px 0 10px;font-size:12.5px;line-height:1.55}
  .wxbar .wxi{font-size:17px;flex:none;line-height:1.2}
  .wxbar b{color:var(--blue)}
  /* Adresse + Einzelnavigation je Punkt */
  .addr{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4;-webkit-user-select:text;user-select:text}
  .addr .pin{opacity:.7}
  .pill.nav{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
  /* Restaurant-Staffelung: Preistipp / Insider + Preisniveau */
  .pbadge.value{background:rgba(47,107,79,.14);color:var(--green);border:1px solid rgba(47,107,79,.42)}
  .pbadge.insider{background:rgba(124,92,191,.15);color:#6f4bb3;border:1px solid rgba(124,92,191,.42)}
  body[data-theme="dark"] .pbadge.insider{color:#bfa3f0}
  .pricetag{font-size:11px;color:var(--muted);font-weight:800;margin-left:6px;white-space:nowrap}
  /* Einklappbare Gegend-Notiz je Halbtag */
  .fabout{margin:6px 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--soft2);overflow:hidden}
  .fabout>summary{cursor:pointer;padding:10px 12px;font-size:12.5px;font-weight:700;color:var(--maple);list-style:none;display:flex;align-items:center;gap:6px}
  .fabout>summary::-webkit-details-marker{display:none}
  .fabout>summary::after{content:"aufklappen";margin-left:auto;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .fabout[open]>summary::after{content:"zuklappen"}
  .fabout .fabout-x{padding:2px 13px 12px;font-size:12.5px;line-height:1.62;color:var(--ink);white-space:pre-line}
  /* Restaurant-Staffelung als Nav-Block */
  .dine-block{margin:8px 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--soft2);padding:10px 12px}
  .dine-t{font-size:12.5px;color:var(--maple);margin-bottom:6px}
  .dine-row{border-top:1px solid var(--line);padding:9px 0 8px}
  .dine-row:first-of-type{border-top:0;padding-top:2px}
  .dine-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px}
  .dine-why{font-size:12px;color:var(--muted);margin:3px 0 2px;line-height:1.5}
  .dine-row .addr{margin:2px 0 5px}
  .dine-row .pill.nav{display:inline-flex;margin-top:2px}
  .dine-foot{font-size:11px;color:var(--muted);border-top:1px dashed var(--line);margin-top:7px;padding-top:6px}
  .pbadge.top{background:rgba(15,110,110,.1);color:var(--maple);border:1px solid rgba(15,110,110,.3)}
  .stayh-links a.pricelink{color:#0f6e6e;font-weight:600}
  .staysub{font-size:11px;font-weight:800;color:var(--maple);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 3px}
  .fewo-links{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
  .fewo-links a{font-size:12px;text-decoration:none;border:1px solid rgba(15,110,110,.35);border-radius:9px;padding:6px 11px;color:var(--maple);background:rgba(15,110,110,.06);font-weight:600}
  .tour{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:10px 0;background:var(--soft2)}
  .tourhd{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
  .tourhd .cnt2{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:6px;padding:1px 7px}
  .tourbtns{display:flex;gap:7px;margin:7px 0 4px;flex-wrap:wrap}
  .tbtn{font-size:11.5px;border:1px solid var(--line);background:var(--card);color:var(--maple);border-radius:9px;padding:5px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .tbtn.gpx{color:var(--green)}
  .pill.web{color:var(--green)}
  .drive{font-size:12.5px;color:#8a5a16;background:rgba(200,147,42,.12);padding:9px 14px;border-radius:12px;margin:10px 0;border:1px solid rgba(200,147,42,.3)}
  .day{padding:8px 14px 14px;border-top:1px solid var(--line)}
  .day h3{font-size:13.5px;margin:12px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .day h3 .dt{background:var(--soft);color:var(--ink);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap}
  .item{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .item:last-child{border-bottom:0}
  .item .ico{font-size:17px;width:22px;text-align:center;flex:none;line-height:1.5}
  .item .main{flex:1;min-width:0}
  .item .nm{font-size:14px;font-weight:600}
  .item .nt{font-size:12.5px;color:var(--muted);margin-top:1px}
  .item .acts{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .item.done .nm{text-decoration:line-through;color:var(--muted)}
  .pill{font-size:11px;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--maple);
    background:var(--card);display:inline-flex;align-items:center;gap:4px;cursor:pointer}
  .pill.map{color:var(--blue)}
  .src{font-size:10px;padding:1px 6px;border-radius:6px;font-weight:700;letter-spacing:.3px}
  .src.v{background:rgba(47,107,79,.14);color:#3f8f6a} .src.n{background:rgba(52,93,171,.14);color:#6b8fd4} .src.c{background:rgba(169,119,42,.16);color:#bd8c3f}
  .cb{width:20px;height:20px;accent-color:var(--green);flex:none;margin-top:2px;cursor:pointer}
  .star{font-size:18px;cursor:pointer;line-height:1;background:none;border:0;padding:0;color:#c9bdab}
  .star.on{color:var(--gold)}
  .note{width:100%;margin-top:6px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:none;
    font-family:inherit;resize:vertical;background:var(--soft2);color:var(--ink)}
  .note.show{display:block}
  /* Item-Politur + Hintergrund-Info */
  .item{border-radius:10px;padding:10px 8px;transition:background .15s}
  .item:hover{background:var(--soft2)}
  .item .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .nm.hasinfo{cursor:pointer}
  .nm .infochev{color:var(--maple);font-weight:800;font-size:13px;transition:transform .2s;line-height:1}
  .item.openinfo .nm .infochev{transform:rotate(90deg)}
  .acts{gap:7px}
  .pill{padding:4px 10px;transition:background .15s,border-color .15s}
  .pill:hover{background:var(--soft)}
  .pill.infoBtn{color:var(--maple);border-color:rgba(15,110,110,.35);background:rgba(15,110,110,.07);font-weight:600}
  .pill.infoBtn:hover{background:rgba(15,110,110,.13)}
  .infopanel{display:none;margin-top:9px;background:var(--soft2);border:1px solid var(--line);
    border-left:3px solid var(--gold);border-radius:11px;padding:11px 13px;font-size:13px;color:var(--ink);
    animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .item.openinfo .infopanel{display:block}
  .infopanel p{margin:0 0 7px;line-height:1.55}
  .infopanel p:last-child{margin-bottom:0}
  .infopanel .tip{background:rgba(200,147,42,.13);border-radius:9px;padding:7px 10px;font-size:12.5px;margin-top:4px;line-height:1.5}
  .infopanel .ilink{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:12.5px;
    color:var(--blue);text-decoration:none;font-weight:600}
  .infopanel .ilink:hover{text-decoration:underline}
  .ev .ilink{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--blue);
    text-decoration:none;font-weight:600;margin-top:5px;margin-right:8px}
  .ev .ilink:hover{text-decoration:underline}
  /* Tour-Inhalte (Insider-Block je Tag) */
  .tourx{margin:12px 0 4px;background:linear-gradient(180deg,var(--soft2),var(--card));border:1px solid var(--line);border-radius:14px;padding:12px 13px}
  .tourx .tx-lead{font-size:13px;line-height:1.55;color:var(--ink);font-style:italic;margin-bottom:6px;padding-left:10px;border-left:3px solid var(--gold)}
  .tourx .tx-sec{margin-top:12px}
  .tourx .tx-sec h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--maple);margin:0 0 5px;font-weight:800}
  .tx-item{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5}
  .tx-item:last-child{border-bottom:0}
  .tx-item .txn{font-weight:700}
  .tx-item .txd{color:var(--muted)}
  .tx-item .txl{white-space:nowrap}
  .tx-item .txl a{text-decoration:none;font-size:13px;margin-left:2px}
  .tourx .tx-night{margin-top:11px;background:rgba(38,70,100,.08);border:1px solid rgba(38,70,100,.18);border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.55}
  .tourx .tx-night b{color:var(--maple)}
  /* Schlechtwetter- / Entspannen-Buttons */
  .modes{display:flex;gap:8px;margin:10px 14px 2px;flex-wrap:wrap}
  .modes.modes--flush{margin:10px 0 2px}
  .mode{flex:1;min-width:150px}
  .modebtn{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
  .modebtn.rainbtn{background:rgba(38,70,100,.09);border-color:rgba(38,70,100,.28);color:#2a5673}

garten, Tunnel-Treppe (Fotomotiv) – 20 Min Spaziergang, gut an Regenpausen.","q":"Fort Canning Park"}],"shopping":[{"nm":"Arab Street & Haji Lane","d":"Batik- und Seidenstoffe, Parfümöl-Händler, kleine Designläden.","q":"Arab Street Singapore","u":""},{"nm":"Kim Choo Kueh Chang (Katong)","d":"Peranakan-Familienbetrieb: Reisküchlein, Perlenstickerei-Schuhe, Kebaya-Kleidung.","q":"Kim Choo Kueh Chang","u":"https://www.kimchoo.com/"},{"nm":"Mustafa Centre (Little India)","d":"Riesiges Kaufhaus, Gewürze/Tee in Großpackungen – lange geöffnet (Zeiten zu prüfen).","q":"Mustafa Centre","u":""},{"nm":"Yong Siak Street (Tiong Bahru)","d":"Kurze Straße mit Cafés und kleinen Läden – Bestand wechselt, vor Ort schauen.","q":"Yong Siak Street","u":""},{"nm":"Orchard Road","d":"Shoppingmeile mit Weihnachtsbeleuchtung (Termin 2026 zu prüfen); Feinkost im Takashimaya-Basement.","q":"Orchard Road","u":""}],"badge":"1","verdict":"Richtig – mit eingebautem Puffer. 5 Nächte ergeben 4 volle Tage (13.–16.12.); Ankunfts- und Abreisetag sind Transfertage. Bei entspanntem Tempo mit Hitze-Pause (13–16 Uhr) hat jeder volle Tag effektiv zwei Halbtage – das reicht genau für die vier großen Bausteine: Chinatown/Tiong Bahru, Katong/Gardens, Kampong Glam/Little India, Botanic Gardens/Marina Bay. Kürzer (4 Nächte) hieße, einen Food-Schwerpunkt (Katong oder Tiong Bahru) zu streichen oder die Mittagspause zu opfern. Länger als 5 lohnt für Foodies nur mit Strand- oder Natur-Wunsch; Singapur ist kompakt. Dezember-Monsun: Nachmittagsgewitter kosten gelegentlich einen Halbtag – deshalb liegen Indoor-Ziele (Dome, Museen, Hawker) ohnehin in den Nachmittagen. Joker-Halbtag, falls ein Tag verregnet oder ihr mehr Natur wollt: Pulau Ubin am Vormittag (Bumboat ab Changi Point, Fahrrad, Kampong-Dorf) – tauscht sich gut gegen den Botanic-Gardens-Vormittag am Mi 16.12. Southern Ridges (Henderson Waves) ist die kürzere Alternative; Sentosa lohnt für dieses Profil kaum.","days":[{"iso":"2026-12-11","dt":"Fr 11.12.","title":"Abflug Frankfurt (LH 780, Nachtflug)","story":"Abends ab Frankfurt – über Nacht nach Singapur.","route":{"mode":"✈️ Reisetag","lead":"Entspannt zum Flughafen Frankfurt, Terminal 1. Abflug LH 780 gegen 21:40 (genaue Zeit laut Buchung), Ankunft Singapur Sa ~16:30–17:00 Ortszeit (+7 h)."},"items":[{"nm":"Flughafen Frankfurt, Terminal 1","cat":"flight","nt":"Check-in Lufthansa, Senator-Lounge nutzen","map":"Frankfurt Airport Terminal 1","src":"v","time":"~19:00"}],"flow":[{"seg":"✈️ Abend · Frankfurt"},{"about":{"t":"Was euch erwartet","x":"Ein ruhiger Reiseabend: Check-in bei Lufthansa in Terminal 1, danach mit dem Senator-Status in die Lounge. Der Jumbo startet am späten Abend und landet nach rund 12 Stunden am Samstagnachmittag in Singapur. Wer auf dem Flug schläft, kommt deutlich besser an – der Ankunftstag ist bewusst fast programmfrei."}},{"note":"💡 Auf dem Nachtflug Uhr schon auf Singapur-Zeit stellen und möglichst schlafen – am Ankunftstag steht nur Check-in und ein ruhiges Abendessen an. SG Arrival Card vorher ausgefüllt?"},0]},{"iso":"2026-12-12","dt":"Sa 12.12.","title":"Ankunft: Bugis & Kampong Glam","route":{"walk":true,"mode":"🚕 Transfer + 🚶 kurz zu Fuß · Abend","lead":"Nachtflug, Ankunft am späten Nachmittag. Nur einchecken, kurz einkaufen und um die Ecke essen – kein Programm.","wxi":"🌧️","wx":"Dezember = Nordost-Monsun: kurze, heftige Schauer meist nachmittags; abends oft trocken."},"items":[{"nm":"InterContinental Singapore","cat":"hotel","nt":"Basis-Hotel in Bugis; Peranakan-Shophouse-Flügel, Pool für die Mittagspause.","map":"InterContinental Singapore Middle Road","src":"v","url":"https://www.ihg.com/intercontinental/hotels/us/en/singapore/sinhb/hoteldetail","time":"~18:30","must":true,"gem":false,"noroute":false,"ll":[1.29835,103.8549],"addr":"80 Middle Road, Singapore 188966"},{"nm":"Cold Storage Fresh (Bugis Junction B1)","cat":"market","nt":"Erst-Einkauf: Wasser, Obst, Snacks; täglich 9–22 Uhr laut OSM-Eintrag (zu prüfen).","map":"Cold Storage Bugis Junction","src":"c","url":"","time":"","must":false,"gem":false,"noroute":false,"ll":[1.30012,103.85606],"addr":"230 Victoria Street, #B1-17/18, Bugis Junction"},{"nm":"Abendbummel Bussorah Street & Sultan-Moschee","cat":"street","nt":"Kurzer Verdauungsspaziergang: angestrahlte goldene Kuppel, Palmen, Teehäuser.","map":"Bussorah Street Singapore","src":"v","url":"","time":"","must":false,"gem":false,"noroute":false,"ll":[1.30198,103.85929],"addr":"Bussorah Street, Kampong Glam","info":{"d":"Die Fußgängerzone Bussorah Street führt direkt auf die 1928 erbaute Sultan-Moschee zu – abends ruhig und stimmungsvoll.","t":"Nur außen anschauen; Innenbesuch am Di 15.12."}}],"flow":[{"seg":"✈️ Ankunft · Changi T2 → Bugis (LH 780, planmäßig ~16:30–17:00)"},{"about":{"t":"Über die Ankunft: Changi → Bugis","x":"Ihr landet am späten Nachmittag in Changi, Terminal 2. Mit vorab ausgefüllter SG Arrival Card geht die Einreise über die Automatik-Gates meist zügig; danach Gepäck, Zoll und den Schildern zum Taxistand folgen. Die Fahrt nach Bugis dauert ~25–35 Min (Richtwert S$25–45 plus Zuschläge). Nach dem Check-in bleibt der Abend bewusst ohne Programm: Wasser und Obst im Supermarkt unter dem Hotel, dann ein kurzer Bummel nach Kampong Glam zum ersten Essen."}},{"note":"💡 SG Arrival Card vorab ausgefüllt? (ab 10.12. möglich, kostenlos bei ICA). Einreise per Automatik-Gate ist für Deutsche meist zügig."},{"tr":"🚕 Grab/Taxi Changi → Bugis ~25–35 Min (abends Stau möglich) · alternativ MRT East-West Line mit Umstieg Tanah Merah ~45 Min"},0,{"seg":"🌆 Abend · Bugis & Kampong Glam (ab ~19:00, nur kurz)"},{"about":{"t":"Über Bugis & Kampong Glam","x":"Bugis war einst Hafen der Bugis-Seefahrer aus Sulawesi, heute ein Einkaufs- und Studentenviertel mit großen Malls. Direkt östlich beginnt Kampong Glam, das historische malaiisch-arabische Viertel um die Sultan-Moschee. Abends duftet es nach Murtabak und Teh Tarik, die Straßencafés sind voll. Für den Ankunftsabend ideal: alles in 5–10 Gehminuten, kein Programm nötig."}},1,2,{"dine":{"top":{"name":"Atlas (Parkview Square)","why":"Art-déco-Lobbybar wie aus den 1920ern, riesige Gin-Sammlung, kleine Karte – stilvoller erster Drink (Sa bis spät, Dresscode ab 17 Uhr laut Drittquelle, zu prüfen).","addr":"600 North Bridge Road, Parkview Square","price":"€€€"},"value":{"name":"Singapore Zam Zam","why":"Seit 1908: Murtabak (gefülltes Fladenbrot) und Biryani, laut und herzlich – das Ankunftsessen schlechthin.","addr":"697–699 North Bridge Road","price":"€"},"insider":{"name":"Kampong Glam Cafe","why":"Malaiische Ecke unter freiem Himmel: Nasi Lemak, Mee Goreng, Teh Tarik – abends lange offen (zu prüfen).","addr":"17 Bussorah St / Baghdad Street","price":"€"}}},{"home":"Rückweg zu Fuß zum Hotel: je nach Lokal ~300–700 m (~5–10 Min)."}]},{"iso":"2026-12-13","dt":"So 13.12.","title":"Hub: Tiong Bahru & Chinatown","route":{"walk":true,"mode":"🚶 zu Fuß + MRT · ganzer Tag","lead":"Vormittags das ruhige Art-déco-Viertel Tiong Bahru mit Markt-Brunch, nachmittags die Tempel und Gassen Chinatowns. Abends die beste Restaurant- und Hawker-Dichte der Stadt.","wxi":"🌦️","wx":"Nachmittagsschauer möglich – Tempel und Hawker sind überdacht."},"items":[{"nm":"Tiong Bahru Market (Hawker im 1. Stock)","cat":"market","nt":"Brunch: Jian Bo Shui Kueh (gedämpfte Reiskuchen), Lor Mee 178 – viele Stände schließen mittags (zu prüfen).","map":"Tiong Bahru Market","src":"v","url":"","time":"","must":true,"gem":false,"noroute":false,"ll":[1.28479,103.83255],"addr":"30 Seng Poh Road","info":{"d":"Unten Frischmarkt, oben einer der beliebtesten Hawker-Center der Stadt. Sonntags voll mit Familien.","t":"Stände mit Schlange sind fast immer die richtigen; Tisch mit Taschentuchpäckchen 'reservieren' (chope)."}},{"nm":"Tiong Bahru Bakery (Eng Hoon Street)","cat":"bakery","nt":"Croissant/Kouign-amann zum Kaffee – das Café, das das Viertel bekannt machte.","map":"Tiong Bahru Bakery Eng Hoon Street","src":"v","url":"","time":"","must":false,"gem":false,"noroute":false,"ll":[1.28445,103.83365],"addr":"56 Eng Hoon Street, #01-70"},{"nm":"Art-déco-Blocks & Wandbilder (Eng Hoon St / Seng Poh Lane)","cat":"sight","nt":"Älteste staatliche Wohnsiedlung (1930er), geschwungene Fassaden; Wandbilder von Yip Yew Chong zeigen Alltag von früher (genaue Standorte zu prüfen).","map":"Tiong Bahru murals Yip Yew Chong","src":"c","url":"","time":"","must":false,"gem":true,"noroute":false,"ll":[1.28332,103.83516],"addr":"Eng Hoon Street, Tiong Bahru"},{"nm":"Yong Siak Street","cat":"shop","nt":"Kurze Café- und Ladenstraße unter Bäumen.","map":"Yong Siak Street","src":"v","url":"","time":"","must":false,"gem":false,"noroute":false,"ll":[1.2826,103.83038],"addr":"Yong Siak Street"},{"nm":"Sri Mariamman Temple","cat":"temple","nt":"Ältester Hindu-Tempel Singapurs (1827) mit buntem Gopuram-Turm; geöffnet 7–12 und 18–21 Uhr, mittags geschlossen (offizielle Seite) – deshalb erst ab 18:00. Schuhe aus, Schultern/Knie bedeckt.","map":"Sri Mariamman Temple Singapore","src":"v","url":"https://heb.org.sg/smt","time":"18:00","must":true,"gem":false,"noroute":false,"ll":[1.28268,103.84519],"addr":"244 South Bridge Road","info":{"d":"Mitten in Chinatown – Zeichen dafür, wie früh hier alle Kulturen nebeneinander lebten.","t":"Nicht vor 18:00 hingehen – 12:00–18:00 ist der Tempel geschlossen."}},{"nm":"Buddha Tooth Relic Temple","cat":"temple","nt":"Tang-Stil-Tempel (2007) mit Reliquie, Dachgarten mit Gebetsmühle; täglich 9–17 Uhr (offizielle Seite) – deshalb erster Stopp um 16:00. Eintritt frei, Kleidervorschrift (Schultern/Knie bedeckt).","map":"Buddha Tooth Relic Temple Singapore","src":"v","url":"https://www.buddhatoothrelictemple.org.sg/","time":"16:00","must":true,"gem":false,"noroute":false,"ll":[1.28151,103.84419],"addr":"288 South Bridge Road"},{"nm":"Maxwell Food Centre – Tian Tian Chicken Rice","cat":"food","nt":"Nachmittags-Snack: Hainanese Chicken Rice bei Tian Tian (Mo geschlossen, So offen – zu prüfen).","map":"Maxwell Food Centre","src":"c","url":"","time":"17:35","must":true,"gem":false,"noroute":false,"ll":[1.28049,103.8448],"addr":"1 Kadayanallur Street","info":{"d":"Maxwell ist der bekannteste Hawker-Center Chinatowns, kompakt und überdacht.","t":"Eine Portion teilen – abends wird noch gegessen."}},{"nm":"Thian Hock Keng Temple","cat":"temple","nt":"Hokkien-Tempel von 1842, ohne Nägel gebaut; früher direkt am Ufer – hier dankten Seeleute für die Überfahrt. Schließt ~17:30 – deshalb direkt nach dem Buddha Tooth.","map":"Thian Hock Keng Temple Singapore","src":"v","url":"https://www.thianhockkeng.com.sg/","time":"16:50","must":false,"gem":false,"noroute":false,"ll":[1.281,103.8475],"addr":"158 Telok Ayer Street"},{"nm":"Ann Siang Hill & Club Street","cat":"street","nt":"Hügelgasse mit restaurierten Shophouses, kleinen Bars und Boutiquen.","map":"Ann Siang Hill Park","src":"v","url":"","time":"17:15","must":false,"gem":true,"noroute":false,"ll":[1.28079,103.84644],"addr":"Ann Siang Hill / Club Street"},{"nm":"Keong Saik Road","cat":"street","nt":"Ehemaliges Rotlichtviertel, heute Restaurantmeile in pastellfarbenen Shophouses.","map":"Keong Saik Road","src":"v","url":"","time":"17:50","must":false,"gem":false,"noroute":false,"ll":[1.28209,103.8424],"addr":"Keong Saik Road"},{"nm":"Smith Street Taps (Chinatown Complex 02-62)","cat":"beer","nt":"Craft-Bier vom Fass mitten im Hawker-Center – Singapur-typischer Stilbruch; Öffnungszeiten zu prüfen.","map":"Smith Street Taps","src":"c","url":"","time":"","must":false,"gem":true,"noroute":false,"ll":[1.28246,103.8437],"addr":"335 Smith Street, #02-62"}],"flow":[{"seg":"☀️ Vormittag · Tiong Bahru (ab ~10:00)"},{"tr":"🚇 MRT Bugis → Tiong Bahru (East-West Line, ~12 Min, ohne Umsteigen)"},{"about":{"t":"Über Tiong Bahru","x":"Tiong Bahru ist Singapurs erste öffentliche Wohnsiedlung, gebaut in den 1930ern im Stromlinien-Art-déco. Die niedrigen weißen Blocks mit runden Balkonen stehen unter Denkmalschutz. Heute wohnen hier alte Nachbarn neben jungen Kreativen – Kopi-Stand neben Specialty-Café. Herz ist der Markt mit Hawker-Etage. Ein ruhiges, grünes Viertel ohne Hochhaus-Kulisse – der perfekte sanfte Einstieg."}},0,1,2,3,{"note":"💡 13:00–15:40 Hitze-Pause im Hotel: MRT Tiong Bahru → Bugis ~12 Min."},{"seg":"🌤️ Nachmittag · Chinatown (ab ~15:45)"},{"tr":"🚇 MRT Bugis → Chinatown (Downtown Line, 5 Stationen, ~10 Min), dann ~300 m zum Buddha Tooth Relic Temple"},{"about":{"t":"Über Chinatown","x":"Chinatown entstand ab 1822, als Stamford Raffles den chinesischen Einwanderern das Gebiet südlich des Flusses zuwies. Zwischen Shophouses stehen ein Hindu-Tempel, eine Moschee und buddhistische und taoistische Tempel – die Telok Ayer Street lag einst direkt am Meer. Rund um Pagoda und Smith Street ist es touristisch, zehn Minuten weiter (Ann Siang, Club Street, Keong Saik) wird es elegant und kulinarisch. Hier liegen drei der wichtigsten Hawker-Center der Stadt."}},{"note":"💡 Reihenfolge folgt den Öffnungszeiten: Buddha Tooth schließt um 17:00, Thian Hock Keng ~17:30, Sri Mariamman öffnet erst wieder um 18:00."},5,7,8,6,9,4,{"note":"💡 Gewitter? Maxwell Food Centre und Chinatown Complex sind überdacht – dort den Schauer abwarten."},{"seg":"🌆 Abend · Chinatown Complex & Amoy Street (ab ~18:30)"},{"about":{"t":"Über den Abend in Chinatown","x":"Wenn die Tempel schließen, wechselt Chinatown vom Besichtigungs- in den Essmodus. Im Chinatown Complex, nur ~200 m vom Sri Mariamman, sitzt ihr an Plastiktischen zwischen Hunderten Ständen – laut, heiß, günstig, so essen die Einheimischen. Das Gegenstück liegt zehn Gehminuten östlich in der Amoy Street: In einem Shophouse erzählt Nouri ein Degustationsmenü über die Wege von Zutaten zwischen den Kulturen. Zum Abschluss Craft-Bier vom Fass im Obergeschoss des Hawker-Centers oder auf dem Dach von Potato Head in der Keong Saik Road."}},{"dine":{"top":{"name":"Nouri","why":"Degustationsmenü von Chef Ivan Brehm – 'Crossroads'-Küche, die Zutaten und Techniken verschiedener Kulturen verbindet; Michelin-Stern (Guide 2026), Platz an der Küchentheke. Sonntags Dinner 18:00–20:30 (offizielle Seite), Reservierung nötig.","addr":"72 Amoy Street","price":"€€€"},"value":{"name":"Chinatown Complex Food Centre","why":"Größter Hawker-Center der Stadt: Lian He Ben Ji Claypot Rice (nur abends) gleich beim Ankommen bestellen – 30–45 Min Wartezeit; inzwischen Zhong Guo La Mian Xiao Long Bao, danach Bier bei Smith Street Taps. Stände zu prüfen.","addr":"335 Smith Street, 2. Stock","price":"€"},"insider":{"name":"Potato Head Singapore","why":"Art-déco-Eckhaus mit Burgern und Dachbar – lässiger Abschluss mit Blick über die Shophouse-Dächer.","addr":"36 Keong Saik Road","price":"€€"}}},10,{"home":"Rückweg: MRT Chinatown → Bugis (Downtown Line, 5 Stationen, ~10 Min) oder Grab ~10 Min."}]},{"iso":"2026-12-14","dt":"Mo 14.12.","title":"Hub: Katong & Gardens by the Bay","route":{"walk":true,"mode":"🚶 zu Fuß + MRT + Grab · ganzer Tag","lead":"Vormittags Peranakan-Kultur und Laksa in Katong. Nachmittags in die klimatisierten Dome, abends Superbaum-Show und – wenn 2026 bestätigt – Christmas Wonderland.","wxi":"🌧️","wx":"Gewitter am Nachmittag passen hier gut: Die Dome sind Indoor."},"items":[{"nm":"Koon Seng Road – Peranakan-Häuser","cat":"sight","nt":"Die berühmte Reihe pastellfarbener Shophouses mit Kachelfassaden.","map":"Koon Seng Road Peranakan Houses","src":"v","url":"","time":"","must":true,"gem":false,"noroute":false,"ll":[1.31037,103.90246],"addr":"Koon Seng Road (Ecke Joo Chiat Road)","info":{"d":"Peranakan (Straits-Chinesen) sind Nachfahren chinesischer Händler und malaiischer Frauen – mit eigener Küche, Mode und Architektur.","t":"Wohnhäuser – leise fotografieren, nicht auf die Veranden."}},{"nm":"Joo Chiat Road","cat":"street","nt":"Shophouse-Straße mit Kopitiams, Vietnam-Lokalen und alten Läden.","map":"Joo Chiat Road","src":"v","url":"","time":"","must":false,"gem":false,"noroute":false,"ll":[1.30928,103.90249],"addr":"Joo Chiat Road"},{"nm":"Kim Choo Kueh Chang","cat":"shop","nt":"Peranakan-Familienbetrieb: Nyonya-Kueh, Reisklöße, oben Perlenstickerei und Kebaya.","map":"Kim Choo Kueh Chang","src":"v","url":"https://www.kimchoo.com/","time":"","must":false,"gem":true,"noroute":false,"ll":[1.30581,103.90454],"addr":"109/111 East Coast Road"},{"nm":"Rumah Bebe","cat":"shop","nt":"Peranakan-Shophouse mit Perlenschuhen und Stickerei (Öffnung zu prüfen).","map":"Rumah Bebe","src":"c","url":"","time":"","must":false,"gem":true,"noroute":false,"ll":[1.30583,103.90458],"addr":"113 East Coast Road"},{"nm":"Chin Mee Chin Confectionery","cat":"bakery","nt":"Kult-Bäckerei (1925, 2022 wiedereröffnet): Kaya-Toast, Custard Puffs. Montag-Öffnung prüfen (Ruhetag-Angaben widersprüchlich) – falls zu: Nyonya-Kueh bei Kim Choo Kueh Chang (zwei Stopps vorher) als süße Pause.","map":"Chin Mee Chin Confectionery","src":"c","url":"","time":"","must":false,"gem":false,"noroute":false,"ll":[1.30723,103.90707],"addr":"204 East Coast Road"},{"nm":"328 Katong Laksa","cat":"food","nt":"Mittag: Katong Laksa – Kokos-Curry-Nudelsuppe, Nudeln kurz geschnitten, nur mit Löffel gegessen.","map":"328 Katong Laksa","src":"v","url":"","time":"","must":true,"gem":false,"noroute":false,"ll":[1.30736,103.90735],"addr":"216 East Coast Road"},{"nm":"Birds of Paradise (Gelato)","cat":"cafe","nt":"Botanisches Gelato (z. B. Weiße Blüte, Erdbeer-Basilikum) im Thymian-Waffelhörnchen.","map":"Birds of Paradise East Coast Road","src":"v","url":"","time":"","must":false,"gem":true,"noroute":true,"ll":[1.30528,103.90365],"addr":"63 East Coast Road"},{"nm":"Old Airport Road Food Centre","cat":"food","nt":"Alternative zum Laksa: einer der besten Hawker-Center (Nam Sing Hokkien Fried Mee, To-Ricos Guo Shi – Stände zu prüfen).","map":"Old Airport Road Food Centre","src":"c","url":"","time":"","must":false,"gem":false,"noroute":true,"ll":[1.30827,103.88586],"addr":"51 Old Airport Road"},{"nm":"Flower Dome","cat":"nature","nt":"Größtes Glasgewächshaus der Welt (Guinness), Mittelmeerklima, im Dezember Weihnachts-Blumenschau (2026 zu prüfen).","map":"Flower Dome Singapore","src":"v","url":"https://www.gardensbythebay.com.sg/","time":"","must":true,"gem":false,"noroute":false,"ll":[1.28454,103.8647],"addr":"18 Marina Gardens Drive","info":{"d":"Täglich 9–21 Uhr, letzter Einlass 20:30 (offizielle Seite); einmal im Monat Wartungstag – für Dezember 2026 kein Schließtag gelistet.","t":"Kombiticket mit Cloud Forest online kaufen."}},{"nm":"Cloud Forest","cat":"nature","nt":"35-m-Nebelwasserfall und Bergnebelwald, Rundweg von oben nach unten.","map":"Cloud Forest Singapore","src":"v","url":"https://www.gardensbythebay.com.sg/","time":"","must":true,"gem":false,"noroute":false,"ll":[1.28388,103.86603],"addr":"18 Marina Gardens Drive","info":{"d":"Täglich 9–21 Uhr, letzter Einlass 20:00 (offizielle Seite).","t":"Zuerst Cloud Forest, dann Flower Dome – oder umgekehrt, je nach Schlange."}},{"nm":"Supertree Grove – Garden Rhapsody","cat":"view","nt":"Licht- und Musikshow zwischen den Superbäumen, gratis, 19:45 und 20:45 (Festtags-Zusatzshow 2026 zu prüfen).","map":"Supertree Grove – Garden Rhapsody Singapore","src":"v","url":"https://www.gardensbythebay.com.sg/en/whats-on/calendar-of-events/garden-rhapsody.html","time":"19:45","must":true,"gem":false,"noroute":false,"ll":[1.282,103.86394],"addr":"Supertree Grove, Gardens by the Bay","info":{"d":"Am besten auf den Boden zwischen die Bäume legen und nach oben schauen.","t":"OCBC Skyway (Hängesteg) davor: 9.12. Wartung, am 14.12. offen (offizielle Seite)."}}],"flow":[{"seg":"☀️ Vormittag · Joo Chiat & Katong (ab ~10:00)"},{"tr":"🚇 MRT Bugis → Paya Lebar (East-West Line, ~10 Min), dann zu Fuß ~1 km die Joo Chiat Road hinunter"},{"about":{"t":"Über Joo Chiat & Katong","x":"Katong war im frühen 20. Jahrhundert Wochenend-Strandort wohlhabender Peranakan-Familien – das Meer reichte bis an die East Coast Road, bevor Land aufgeschüttet wurde. Geblieben sind farbenprächtige Shophouses mit Kacheln, Familienbetriebe für Nyonya-Kueh und Perlenstickerei und die nach dem Viertel benannte Katong Laksa. Joo Chiat ist heute ein Mix aus Traditionsbäckereien, vietnamesischen Lokalen und neuen Cafés. Ruhig, wenig Touristen, sehr fotogen."}},0,1,2,3,4,5,{"warn":"Abstecher Old Airport Road Food Centre: +Grab ~10 Min – nur wenn Hawker statt Laksa."},6,7,{"note":"💡 ~13:30 Grab zurück ins Hotel (~20 Min), Hitze-Pause bis ~16:00."},{"seg":"🌤️ Nachmittag & Abend · Gardens by the Bay (ab ~16:30)"},{"tr":"🚇 MRT Bugis → Bayfront (Downtown Line, 2 Stationen, ~5 Min), Ausgang Richtung Gardens, ~10 Min Fußweg"},{"about":{"t":"Über Gardens by the Bay","x":"Der 2012 eröffnete Park auf aufgeschüttetem Land ist Singapurs Bekenntnis zur 'Stadt im Garten'. Die beiden Glasdome sind klimatisiert und damit die perfekte Zuflucht vor Hitze und Gewitter. Die bis zu 50 m hohen Superbäume sind vertikale Gärten, sammeln Regenwasser und tragen Solarzellen. Abends leuchten sie zur Musik der Garden Rhapsody. Im Dezember findet hier traditionell das Christmas Wonderland statt (Termine 2026 zu prüfen)."}},9,8,{"note":"🎄 Christmas Wonderland (eigenes Ticket, Zeitfenster ab 18:30): 2026 laut Drittquelle 27.11.–1.1.2027 – offizielle Bestätigung ausstehend, vor Abreise prüfen."},10,{"seg":"🌙 Abend · Essen nach der Show (ab ~20:00)"},{"about":{"t":"Über den Abend an der Marina Bay","x":"Nach der Garden Rhapsody stehen drei sehr unterschiedliche Abendessen zur Wahl. Satay by the Bay liegt direkt im Park – keine Wege, Spieße vom Grill unter freiem Himmel. Lau Pa Sat ist eine viktorianische Gusseisenhalle im Finanzviertel; ab 19 Uhr wird die Boon Tat Street davor zur Satay-Straße. CÉ LA VI ist der Gegenentwurf: Restaurant hoch oben auf Marina Bay Sands, teuer, mit Blick auf die Gardens, durch die ihr gerade gelaufen seid."}},{"dine":{"top":{"name":"CÉ LA VI (Marina Bay Sands, 57. Stock)","why":"Restaurant und SkyBar auf dem SkyPark – teuer, aber der Blick über Bucht und Gardens bei Nacht; über die Lions Bridge ~15 Min zu Fuß (Zugang/Reservierung zu prüfen).","addr":"1 Bayfront Avenue, Tower 3","price":"€€€"},"value":{"name":"Satay by the Bay","why":"Direkt im Park, keine Wege: Satay-Spieße mit Erdnusssauce, BBQ-Seafood, Tiger-Bier.","addr":"18 Marina Gardens Drive","price":"€"},"insider":{"name":"Lau Pa Sat – Satay Street","why":"Viktorianische Gusseisenhalle; ab 19 Uhr wird die Boon Tat Street zur Satay-Straße (offizielle Seite). Stand 7 & 8 'Best Satay' ist Klassiker. 1 MRT-Station (Bayfront → Downtown).","addr":"18 Raffles Quay / Boon Tat Street","price":"€"}}},{"warn":"CÉ LA VI ist ein Umweg: +15 Min zu Fuß über die Lions Bridge zum MBS Tower 3 – nur bei Lust auf den Blick von oben."},{"home":"Rückweg: Downtown Line → Bugis – ab Bayfront (Gardens/MBS) 2 Stationen, ab Downtown (Lau Pa Sat) 3 Stationen, ~5–8 Min; spät abends Grab ~10 Min."}]},{"iso":"2026-12-15","dt":"Di 15.12.","title":"Hub: Kampong Glam & Little India","route":{"walk":true,"mode":"🚶 zu Fuß ab Hotel · ganzer Tag","lead":"Ein Tag ohne MRT: vormittags das malaiisch-arabische Kampong Glam mit Moschee und frisch renoviertem Sultanspalast, abends das farbige Little India mit Tempel-Puja und Curry.","wxi":"🌦️","wx":"Bei Gewitter: Malay Heritage Centre und Tekka Centre sind Indoor."},"items":[{"nm":"Masjid Sultan (Sultan-Moschee)","cat":"temple","nt":"Größte Moschee Singapurs (1928) mit goldener Kuppel; Besuch außerhalb der Gebetszeiten, Umhänge werden gestellt.","map":"Masjid Sultan (Sultan-Moschee) Singapore","src":"c","url":"https://www.sultanmosque.sg/","time":"","must":true,"gem":false,"noroute":false,"ll":[1.30222,103.859],"addr":"3 Muscat Street","info":{"d":"Besuchszeiten widersprüchlich angegeben (u. a. 10–12 und 14–16 Uhr) – am Vortag auf der Website prüfen.","t":"Vormittags hingehen; freitags eingeschränkt."}},{"nm":"Bhai Sarbat Teh Tarik","cat":"cafe","nt":"Gezogener Milchtee, mit Show aus großer Höhe gegossen – Ingwer-Variante probieren.","map":"Bhai Sarbat Teh Tarik","src":"v","url":"","time":"","must":false,"gem":true,"noroute":false,"ll":[1.30144,103.85999],"addr":"21 Bussorah Street / Ecke Baghdad Street"},{"nm":"Malay Heritage Centre (Istana Kampong Glam)","cat":"museum","nt":"Ehemaliger Sultanspalast, nach Umbau am 25.04.2026 wiedereröffnet; Di–So 10–18 Uhr, Mo geschlossen (offizielle Seite).","map":"Malay Heritage Centre (Istana Kampong Glam) Singapore","src":"v","url":"https://www.malayheritage.gov.sg/","time":"","must":false,"gem":false,"noroute":false,"ll":[1.30287,103.85983],"addr":"85 Sultan Gate","info":{"d":"Erzählt die Geschichte der Malaien in Singapur – von der Seefahrt bis zur Gegenwart.","t":"Eintrittspreis für Touristen nach Ende der Gratis-Phase zu prüfen."}},{"nm":"Haji Lane & Arab Street","cat":"shop","nt":"Bunte Gasse mit Wandbildern und Boutiquen; Arab Street mit Stoff- und Batikhändlern.","map":"Haji Lane","src":"v","url":"","time":"","must":true,"gem":false,"noroute":false,"ll":[1.30123,103.85873],"addr":"Haji Lane"},{"nm":"Hjh Maimunah","cat":"food","nt":"Mittag: Nasi Padang vom Buffet – Rendang, Sambal Goreng, Sayur Lodeh; mittags am vollsten, früh kommen.","map":"Hjh Maimunah Jalan Pisang","src":"v","url":"","time":"","must":true,"gem":false,"noroute":false,"ll":[1.30316,103.85856],"addr":"11 & 15 Jalan Pisang"},{"nm":"Indian Heritage Centre","cat":"museum","nt":"Indische Diaspora in Südostasien; nachts leuchtende Glasfassade (Öffnungszeiten zu prüfen, montags meist zu).","map":"Indian Heritage Centre Singapore","src":"c","url":"https://www.indianheritage.gov.sg/","time":"","must":false,"gem":false,"noroute":false,"ll":[1.30562,103.85232],"addr":"5 Campbell Lane"},{"nm":"Little India Arcade","cat":"shop","nt":"Shophouse-Passage: Henna, Blumengirlanden, Gewürze, Süßigkeiten.","map":"Little India Arcade","src":"v","url":"","time":"","must":false,"gem":false,"noroute":false,"ll":[1.30575,103.8515],"addr":"48 Serangoon Road"},{"nm":"Tekka Centre","cat":"market","nt":"Nassmarkt, Hawker und oben Saris – laut, farbig, echt; Snack: Mango-Lassi oder Biryani.","map":"Tekka Centre","src":"v","url":"","time":"","must":true,"gem":false,"noroute":false,"ll":[1.30619,103.85061],"addr":"665 Buffalo Road"},{"nm":"House of Tan Teng Niah","cat":"sight","nt":"Letzte chinesische Villa in Little India (1900) – knallbunt gestrichen, Fotostopp.","map":"House of Tan Teng Niah","src":"v","url":"","time":"","must":false,"gem":true,"noroute":false,"ll":[1.30706,103.85093],"addr":"37 Kerbau Road"},{"nm":"Sri Veeramakaliamman Temple","cat":"temple","nt":"Tempel der Göttin Kali (1881), abends Puja mit Glocken und Trommeln.","map":"Sri Veeramakaliamman Temple","src":"v","url":"","time":"","must":true,"gem":false,"noroute":false,"ll":[1.30795,103.8524],"addr":"141 Serangoon Road"},{"nm":"Mustafa Centre","cat":"shop","nt":"Kaufhaus-Labyrinth: Gewürze, Tee, Elektronik, Gold – sehr lange geöffnet (Zeiten zu prüfen).","map":"Mustafa Centre","src":"c","url":"","time":"","must":false,"gem":false,"noroute":true,"ll":[1.31012,103.85532],"addr":"145 Syed Alwi Road"}],"flow":[{"seg":"☀️ Vormittag · Kampong Glam (ab ~10:00, zu Fuß ab Hotel ~8 Min)"},{"about":{"t":"Über Kampong Glam","x":"1819 wies Raffles dem Sultan von Johor dieses Gebiet zu – hier entstand das malaiisch-muslimische Zentrum der Stadt. Die Sultan-Moschee und der ehemalige Sultanspalast (heute Malay Heritage Centre) erzählen davon. Arabische, Bugis- und javanische Händler prägten die Straßennamen: Arab, Baghdad, Muscat, Kandahar Street. Heute mischen sich Stoffhändler und Parfümöl-Läden mit Hipster-Boutiquen in der Haji Lane. Zum Essen: Nasi Padang, Murtabak und Teh Tarik."}},0,1,2,3,4,{"note":"💡 ~13:30 Hitze-Pause im Hotel (5 Min zu Fuß)."},{"seg":"🌤️ Nachmittag & Abend · Little India (ab ~16:30)"},{"tr":"🚶 Zu Fuß ~1 km (~13 Min) · oder MRT Bugis → Little India (Downtown Line, 2 Stationen)"},{"about":{"t":"Über Little India","x":"Little India entstand im 19. Jahrhundert rund um Ziegeleien und Viehhandel am Rochor-Kanal – daher Straßennamen wie Buffalo und Kerbau (malaiisch: Büffel) Road. Heute ist es das Zentrum der tamilischen Gemeinde: Blumengirlanden, Goldschmiede, Sari-Läden und Tempel. Spätnachmittags und abends ist es am lebendigsten, wenn die Lichter angehen. Kulinarisch: südindische Dosa auf Bananenblatt, nordindische Tandoori-Küche und die singapurische Erfindung Fischkopf-Curry."}},5,6,7,8,9,{"warn":"Mustafa Centre: +600 m nördlich, nur bei Lust auf Großeinkauf (Gewürze/Tee)."},10,{"seg":"🌆 Abend · Race Course Road & Serangoon (ab ~19:00)"},{"about":{"t":"Über den Abend in Little India","x":"Abends ist Little India am lebendigsten: Blumenhändler, Goldschmiede und Süßwarenläden haben offen, die Gehwege sind voll. Gegessen wird an zwei Polen – an der Race Course Road die Curry-Häuser mit Fischkopf-Curry zum Teilen, an der Serangoon Road die vegetarischen südindischen Lokale, in denen Dosa und Thali auf dem Bananenblatt kommen. Gegessen wird dort traditionell mit der rechten Hand, Besteck gibt es auf Nachfrage. Danach bummelt ihr zu Fuß zurück Richtung Bugis."}},{"dine":{"top":{"name":"Muthu's Curry","why":"Institution seit 1969 für Fischkopf-Curry – säuerlich-scharf, zum Teilen; dazu Masala-Chicken.","addr":"138 Race Course Road","price":"€€"},"value":{"name":"Komala Vilas","why":"Vegetarisch-südindisch seit 1947: Masala Dosa und Thali auf Bananenblatt, mit der Hand gegessen.","addr":"76–78 Serangoon Road","price":"€"},"insider":{"name":"Lagnaa Barefoot Dining","why":"Schuhe aus, oben auf Kissen sitzen; Schärfegrad auf einer Skala selbst wählen (Betrieb 2026 zu prüfen).","addr":"6 Upper Dickson Road","price":"€€"}}},{"note":"🍸 Absacker auf dem Rückweg: Atlas (Parkview Square) liegt 300 m vom Hotel."},{"home":"Rückweg: zu Fuß ~1–1,5 km (~15–20 Min) · oder MRT Little India → Bugis (Downtown Line, 2 Stationen) · oder Grab ~7 Min."}]},{"iso":"2026-12-16","dt":"Mi 16.12.","title":"Hub: Botanic Gardens, Dempsey & Marina Bay","route":{"walk":true,"mode":"🚶 zu Fuß + MRT · ganzer Tag","lead":"Vormittags durch das UNESCO-Welterbe der Botanischen Gärten zum Peranakan-Lunch nach Dempsey. Abends Kolonialbauten, Rooftop-Sundowner am Wasser, um 20:00 die Spectra-Show vom Merlion aus – danach das Abschiedsessen.","wxi":"🌦️","wx":"Bei Gewitter am Vormittag: National Gallery oder Peranakan Museum vorziehen."},"items":[{"nm":"Singapore Botanic Gardens","cat":"nature","nt":"UNESCO-Welterbe (seit 2015), Eintritt frei; Einstieg am Bukit Timah Gate (MRT Botanic Gardens).","map":"Singapore Botanic Gardens Singapore","src":"v","url":"https://www.nparks.gov.sg/sbg","time":"","must":true,"gem":false,"noroute":false,"ll":[1.31463,103.81562],"addr":"1 Cluny Road","info":{"d":"Gegründet 1859; hier wurde der Kautschuk-Anbau für ganz Südostasien entwickelt.","t":"Wasser mitnehmen, Wege sind schattig."}},{"nm":"National Orchid Garden","cat":"nature","nt":"Über 1.000 Orchideenarten, VIP-Garten mit nach Staatsgästen benannten Hybriden; ~S$15 für Nicht-Residenten (zu prüfen), 8:30–19 Uhr.","map":"National Orchid Garden","src":"c","url":"","time":"","must":true,"gem":false,"noroute":false,"ll":[1.31274,103.81361],"addr":"Singapore Botanic Gardens"},{"nm":"Ginger Garden","cat":"nature","nt":"Ruhiger Ingwer- und Heliconien-Garten mit kleinem Wasserfall.","map":"Ginger Garden Botanic Gardens","src":"v","url":"","time":"","must":false,"gem":true,"noroute":false,"ll":[1.3109,103.81507],"addr":"Singapore Botanic Gardens"},{"nm":"Swan Lake","cat":"nature","nt":"Ältester See der Gärten (1866) mit Schwänen und viktorianischem Pavillon.","map":"Swan Lake Botanic Gardens","src":"v","url":"","time":"","must":false,"gem":false,"noroute":false,"ll":[1.30803,103.81574],"addr":"Singapore Botanic Gardens (Tanglin Gate)"},{"nm":"Dempsey Hill","cat":"street","nt":"Ehemalige britische Kaserne im Grünen, heute Restaurants, Bars und Antiquitäten.","map":"Dempsey Hill","src":"v","url":"","time":"","must":false,"gem":false,"noroute":false,"ll":[1.3045,103.81006],"addr":"Dempsey Road"},{"nm":"Victoria Theatre & Concert Hall","cat":"sight","nt":"Kolonialer Prachtbau (1862) am Fluss, Start des Abendspaziergangs.","map":"Victoria Theatre and Concert Hall","src":"v","url":"","time":"","must":false,"gem":false,"noroute":false,"ll":[1.28836,103.85141],"addr":"9 Empress Place"},{"nm":"The Fullerton Hotel","cat":"sight","nt":"Ehemaliges Hauptpostamt (1928), neoklassische Säulenhalle – Lobby frei zugänglich.","map":"The Fullerton Hotel Singapore","src":"v","url":"","time":"","must":false,"gem":false,"noroute":false,"ll":[1.2862,103.85307],"addr":"1 Fullerton Square"},{"nm":"Merlion Park","cat":"view","nt":"Wahrzeichen mit Löwenkopf und Fischleib; Blick auf Marina Bay Sands – hier um 20:00 Spectra anschauen.","map":"Merlion Park","src":"v","url":"","time":"","must":true,"gem":false,"noroute":false,"ll":[1.28569,103.85416],"addr":"1 Fullerton Road"},{"nm":"Lantern (Fullerton Bay Hotel)","cat":"bar","nt":"Dachbar am Pool direkt über dem Wasser – Sonnenuntergang (~19:00) mit Skyline; Reservierung empfohlen (zu prüfen).","map":"Lantern Fullerton Bay Hotel","src":"c","url":"","time":"18:15","must":true,"gem":false,"noroute":false,"ll":[1.28315,103.85375],"addr":"80 Collyer Quay, Rooftop"},{"nm":"Spectra – Licht- & Wassershow","cat":"view","nt":"Gratis-Show vor Marina Bay Sands, So–Do 20:00 und 21:00 (Drittquellen, zu prüfen) – vom Merlion-Ufer gegenüber bestens sichtbar; eingeplant ist die 20:00-Show vor dem Essen.","map":"Spectra Marina Bay Sands","src":"c","url":"https://www.marinabaysands.com/attractions/spectra.html","time":"20:00","must":false,"gem":false,"noroute":false,"ll":[1.28569,103.85416],"addr":"Blick vom Merlion Park über die Bucht"},{"nm":"LeVeL33","cat":"beer","nt":"Craft-Brauerei im 33. Stock mit Terrasse – Alternative zu Lantern für Bierfreunde.","map":"LeVeL33 Singapore","src":"v","url":"","time":"","must":false,"gem":false,"noroute":true,"ll":[1.28027,103.85423],"addr":"8 Marina Boulevard, #33-01"}],"flow":[{"seg":"☀️ Vormittag · Botanic Gardens & Dempsey (ab ~10:00)"},{"tr":"🚇 MRT Bugis → Botanic Gardens (Downtown Line, ~15 Min, ohne Umsteigen)"},{"about":{"t":"Über Botanic Gardens & Dempsey","x":"Die Botanischen Gärten sind seit 1859 grüne Lunge und Forschungsstätte – Henry Ridley entwickelte hier die Methode, Kautschuk zu zapfen, die Malaya reich machte. Seit 2015 sind sie UNESCO-Welterbe. Der Weg führt vom Norden durch den Orchideengarten nach Süden zum Swan Lake. Gleich dahinter liegt Dempsey Hill, eine ehemalige britische Kaserne, deren Baracken heute Restaurants, Weinbars und Antiquitätenläden beherbergen. Grün, schattig, entspannt – das Gegenprogramm zu Chinatown."}},0,1,2,3,{"tr":"🚶 Swan Lake → Tanglin Gate → Dempsey ~1,2 km (~15 Min) · bei Hitze Grab ~5 Min"},4,{"note":"🍽️ Mittagessen ~13:00 in Dempsey – alle drei Lokale liegen wenige Gehminuten auseinander."},{"dine":{"top":{"name":"Candlenut (COMO Dempsey) – Mittagessen","why":"Peranakan-Küche mit Michelin-Stern 2016–2025 (2026 zu prüfen); täglich Lunch 12–15 Uhr, Reservierung für ~13:00 nötig. Ayam Buah Keluak probieren.","addr":"17A Dempsey Road","price":"€€€"},"value":{"name":"Long Beach @ Dempsey","why":"Chili Crab und Black Pepper Crab im Gartenpavillon – Krabben-Klassiker der Stadt.","addr":"25 Dempsey Road","price":"€€"},"insider":{"name":"PS.Cafe Harding","why":"Glashaus im Grünen, ohne großes Programm – Brunch-Karte und Kuchen.","addr":"28B Harding Road","price":"€€"}}},{"note":"💡 ~14:45 Grab zurück ins Hotel (~15 Min), Hitze-Pause bis ~17:15."},{"seg":"🌆 Abend · Marina Bay Waterfront (ab ~17:30)"},{"tr":"🚇 MRT Bugis → City Hall (East-West Line, 1 Station), dann ~600 m zu Fuß zum Victoria Theatre"},{"about":{"t":"Über Marina Bay & Civic District","x":"Am Nordufer des Flusses steht das koloniale Singapur: Victoria Theatre, Old Parliament, das ehemalige Postamt (heute Fullerton Hotel). Gegenüber, auf ab den 1970ern aufgeschüttetem Land, das neue: Marina Bay Sands, ArtScience Museum, Finanzdistrikt. Dazwischen die Bucht, die heute ein Süßwasserreservoir ist. Am Abend gehen Lichter und Spectra-Show an – der schönste Blick ist vom Merlion-Ufer. Ein gemütlicher Spaziergang von ~2 km zum Abschluss."}},5,6,7,8,{"warn":"LeVeL33 statt Lantern: +500 m (Craft-Bier mit Blick), nur bei Lust."},10,{"note":"💡 Gegen 19:45 vom Sundowner zurück zum Merlion-Ufer (~350 m) – Spectra beginnt um 20:00."},9,{"seg":"🌙 Abschiedsabend · Essen nach der Show (ab ~20:30)"},{"about":{"t":"Über den Abschiedsabend","x":"Der letzte Abend hat eine feste Reihenfolge, damit nichts kollidiert: Sundowner auf dem Lantern-Dach, um 20:00 die Spectra-Show vom Merlion-Ufer, erst danach das Essen. Das JAAN-Menü im 70. Stock dauert 2,5–3 Stunden – mit Tisch um ~20:45 endet der Abend gegen 23:30 mit Blick über die nächtliche Bucht. Die günstige Alternative ist Lau Pa Sat, ~10 Gehminuten südlich; die Wok-Küche von Keng Eng Kee lohnt die Grab-Fahrt für alle, die lieber wie Einheimische essen."}},{"dine":{"top":{"name":"JAAN by Kirk Westaway","why":"Modern-britisches Degustationsmenü im 70. Stock des Swissôtel The Stamford, Fensterplatz mit Blick über die Bucht (Konzept/Status 2026 zu prüfen) – Menü dauert 2,5–3 Std, deshalb Tisch für ~20:45 nach der Spectra-Show reservieren; vom Merlion Grab ~5 Min.","addr":"2 Stamford Road, Level 70","price":"€€€"},"value":{"name":"Lau Pa Sat – Satay Street","why":"Satay vom Holzkohlegrill unter freiem Himmel, ab 19 Uhr (wochentags, offizielle Seite) – ~10 Gehminuten vom Merlion.","addr":"18 Raffles Quay / Boon Tat Street","price":"€"},"insider":{"name":"Keng Eng Kee Seafood (Alexandra Village)","why":"Zi-Char (Wok-Küche) im Wohnblock: Chili Crab, Coffee Pork Ribs, Moonlight Hor Fun – Einheimische statt Touristen; Grab ~15 Min.","addr":"124 Bukit Merah Lane 1","price":"€€"}}},{"note":"💡 Variante ohne JAAN: Lau Pa Sat schon ab ~19:30, dann reicht auch die 21:00-Show von Spectra (~10 Min zurück zum Merlion)."},{"home":"Rückweg zum Hotel: ab Marina Bay MRT Raffles Place → Bugis (East-West Line, 2 Stationen, ~5 Min) bzw. ab Swissôtel MRT City Hall → Bugis (1 Station); spät abends Grab ~10 Min."}]},{"iso":"2026-12-17","dt":"Do 17.12.","title":"Abreise nach Bangkok","route":{"walk":false,"mode":"🚕 Transfer · Vormittag","lead":"Frühstück, Check-out und um ~09:45 Taxi zum Flughafen: TG 404 nach Bangkok startet um 12:25 ab Changi T2. Für Programm bleibt an diesem Morgen keine Zeit.","wxi":"✈️"},"items":[{"nm":"Ya Kun Kaya Toast (Bugis Junction B1)","cat":"cafe","nt":"Letztes Kaya-Toast-Frühstück neben dem Hotel – oder Frühstück im Hotel.","map":"Ya Kun Kaya Toast Bugis Junction","src":"v","url":"","time":"","must":false,"gem":false,"noroute":false,"ll":[1.2986,103.85516],"addr":"200 Victoria Street, #B1-11, Bugis Junction"},{"nm":"InterContinental Singapore","cat":"hotel","nt":"Check-out; Taxi/Grab ab Hotel ca. 09:45 bestellen.","map":"InterContinental Singapore Middle Road","src":"v","url":"https://www.ihg.com/intercontinental/hotels/us/en/singapore/sinhb/hoteldetail","time":"~09:30","must":false,"gem":false,"noroute":false,"ll":[1.29835,103.8549],"addr":"80 Middle Road, Singapore 188966"},{"nm":"Jewel Changi – Rain Vortex","cat":"sight","nt":"Größter Indoor-Wasserfall der Welt im Glasdom am Terminal 1 – nur falls ihr den späteren SQ 712 um 15:45 nehmt; bei TG 404 um 12:25 keine Zeit.","map":"Jewel Changi Airport Rain Vortex","src":"v","url":"https://www.jewelchangiairport.com/","time":"","must":false,"gem":false,"noroute":true,"ll":[1.36022,103.98967],"addr":"78 Airport Boulevard, Jewel Changi Airport"}],"flow":[{"seg":"🧳 Abreise · Frühstück & Transfer (TG 404 um 12:25 ab Changi T2)"},{"about":{"t":"Über den Abreisevormittag","x":"Der letzte Morgen ist reine Logistik, aber ohne Hetze: Frühstück im Hotel oder ein letzter Kaya-Toast bei Ya Kun im Untergeschoss der Bugis Junction, zwei Minuten vom Hotel. Gegen 09:30 auschecken, um ~09:45 fährt das Taxi, ~25–30 Min bis Terminal 2. Nach Check-in und Ausreise bleibt mit Star-Alliance-Gold Zeit für die Lounge – ein letzter Kopi vor dem Flug nach Bangkok."}},{"note":"⏰ Begründete Ausnahme von der 10-Uhr-Regel: Abflug TG 404 um 12:25 ab Changi T2 – Taxi ab Hotel ca. 09:45, Ankunft am Terminal ~10:15, gut 2 Std vor Abflug."},0,1,{"tr":"🚕 Taxi/Grab InterContinental Bugis → Changi T2 ca. 09:45 ab Hotel (~25–30 Min) · alternativ MRT East-West Line mit Umstieg Tanah Merah ~45 Min"},{"warn":"Jewel Changi nur, falls ihr statt TG 404 den späteren SQ 712 um 15:45 nehmt – dann bleibt vor dem Abflug Zeit."},2,{"home":"TG 404 Changi T2 12:25 → Bangkok Suvarnabhumi (an 13:45 laut Flugplan)."}]}]},{"name":"Bangkok","sub":"Do 17.12.–Mi 23.12. · 6 Nächte","hotel":"Planungsbasis: Royal Orchid Sheraton Riverside (Marriott) direkt am Fluss in Charoen Krung/Bang Rak – Boote zur Altstadt, Talat Noi und Chinatown zu Fuß, die besten Foodie-Adressen der Stadt vor der Tür (Hotel noch NICHT gebucht). Nächste Supermärkte: Tops Market an der Silom Rd (unteres Ende, ~1,0 km Luftlinie · ~15 Min zu Fuß) und Tops im Robinson Bang Rak an der BTS Saphan Taksin (~1,1 km · ~15 Min); für Wasser und Snacks mehrere 7-Eleven an Charoen Krung (~200–400 m); Lotus's Charoen Nakhon / ICONSIAM-Supermarkt per Hotel-Shuttleboot (~5 Min + ~5 Min zu Fuß).","transit":{"city":"Bangkok (BTS · MRT · Boote · Grab/Bolt)","txt":"MRT (blaue/lila Linie): seit 1.6.2026 vollständig auf kontaktlose Kreditkarte umgestellt (Visa/Mastercard antippen, alte MRT-Karten ungültig). BTS-Skytrain: Einzelticket am Automaten oder Rabbit Card – Kreditkarte am BTS-Gate laut aktuellen Quellen noch NICHT verlässlich (zu prüfen). Chao-Phraya-Expressboot Orange Flag: Einheitspreis ~18–20 THB (schwankt 2026 mit dem Dieselpreis), bar an Bord/Pier; fährt tagsüber, abends früh Schluss (Fahrplan zu prüfen). Kostenlose Hotel-Shuttleboote (Sheraton/Hilton) zum Sathorn Pier = BTS Saphan Taksin. Grab und Bolt für Abende und Querverbindungen; Taxi nur mit Taxameter. Flughafen BKK: Airport Rail Link 45 THB bis Phaya Thai (~27 Min) oder Taxameter-Taxi ~400–500 THB inkl. Maut + 50 THB Flughafenzuschlag.","url":"https://metro.bemplc.co.th/?lang=en"},"sunset":[{"nm":"Wat Arun vom Tha-Tien-Ufer","d":"Der Klassiker: Wat Arun gegenüber im Abendlicht, Sonnenuntergang Mitte Dezember ~17:50. Rooftop-Bars am Maharat-Ufer (z. B. Sala Rattanakosin) mit Blick – Öffnungszeiten zu prüfen.","q":"Wat Arun Viewpoint Tha Tien Bangkok"},{"nm":"ThreeSixty Rooftop Bar (Millennium Hilton)","d":"Rooftop-Bar über dem Westufer, laut offizieller Hilton-Seite täglich ab 17:00 – damit rechtzeitig zum Sonnenuntergang (~17:50). Per Hotel-Shuttleboot zum ICONSIAM-Pier, dann ~5 Min zu Fuß.","q":"ThreeSixty Rooftop Bar Millennium Hilton Bangkok"},{"nm":"Sky Bar at lebua (State Tower)","d":"Open-Air-Bar im 63. Stock über dem Fluss, nur wenige Minuten vom Hotel. Öffnet laut den meisten Quellen erst 18:00 – also kurz nach Sonnenuntergang (vor Ort prüfen). Smart casual (keine Flip-Flops/Sportkleidung, Männer keine ärmellosen Shirts).","q":"Sky Bar lebua State Tower Bangkok"},{"nm":"ICONSIAM River Park","d":"Uferpromenade vor dem ICONSIAM, im Dezember mit Weihnachtsbeleuchtung (2025: täglich 16–22 Uhr, kostenlos; 2026 zu prüfen).","q":"ICONSIAM River Park"}],"photo":[{"nm":"Talat Noi Street Art & So Heng Tai","d":"Verfallene Werkstätten, Wandbilder, chinesisches Hofhaus von ~1800 – Fotomotive im Minutentakt.","q":"So Heng Tai Mansion Talat Noi"},{"nm":"Yaowarat bei Nacht","d":"Neonschilder, Garküchen-Rauch, rote Laternen – ab ~18:30 am fotogensten.","q":"Yaowarat Road Bangkok"},{"nm":"Wat Pho – Liegender Buddha","d":"46 m vergoldeter Buddha, am Nachmittag weniger Gruppen als vormittags.","q":"Wat Pho Bangkok"},{"nm":"Lumphini Park – Warane","d":"Bis zu 2 m lange Bindenwarane am Teich, Skyline im Hintergrund.","q":"Lumphini Park"}],"breakfast":[{"nm":"Jok Prince (Reissuppe)","d":"Michelin-Bib-Gourmand-Stand für rauchige Schweine-Jok, öffnet frühmorgens bis Mittag und wieder abends. Charoen Krung, nahe BTS Saphan Taksin.","q":"Jok Prince Charoen Krung"},{"nm":"Mother Roaster (Talat Noi)","d":"Specialty-Kaffee im Obergeschoss über einer Autoteile-Werkstatt; ~10–18 Uhr, Ruhetag laut Quellen Mo (teils auch Di) – zu prüfen.","q":"Mother Roaster Talat Noi"},{"nm":"NANA Coffee Roasters Ari","d":"Gewächshaus-Café mit Slow Bar, Thai-Bohnen-Flights und Brunch – Ari ist Bangkoks Café-Viertel.","q":"NANA Coffee Roasters Ari"}],"hike":[{"nm":"Lumphini-Park-Runde","d":"~2,5 km schattige Runde um die Seen, am späten Nachmittag angenehm; Warane inklusive.","q":"Lumphini Park"},{"nm":"Golden Mount (Wat Saket)","d":"Spiralaufgang auf einen künstlichen Hügel mit Rundblick über die Altstadt; ~300 Stufen (Eintritt/Zeiten zu prüfen).","q":"Wat Saket Golden Mount"},{"nm":"Bang Krachao – „grüne Lunge“","d":"Fast unbebaute Flussschleife gegenüber Khlong Toei: Radtour auf Hochwegen durch Mangroven und Obstgärten. Halbtag, per Fähre von Khlong Toei (Details zu prüfen) – Puffer-Option.","q":"Bang Krachao Bangkok"}],"shopping":[{"nm":"Chatuchak Weekend Market","d":"15.000+ Stände: Keramik, Textilien, Vintage, Kunsthandwerk. Sa/So ~9–18 Uhr.","q":"Chatuchak Weekend Market","u":"https://www.chatuchakmarket.org/"},{"nm":"River City Bangkok","d":"Kunst- und Antiquitätenzentrum am Fluss, 2 Minuten vom Hotel (Händler-Öffnungszeiten zu prüfen).","q":"River City Bangkok","u":"https://rivercitybangkok.com/"},{"nm":"Warehouse 30","d":"Umgebautes Lagerhaus-Ensemble an Charoen Krung Soi 30: Designläden, Galerie, Café.","q":"Warehouse 30 Bangkok","u":""},{"nm":"ICONSIAM / SookSiam","d":"Im Untergeschoss SookSiam: Kunsthandwerk und Regionalküche aus allen Landesteilen, als ‚Indoor-Schwimmmarkt‘ inszeniert.","q":"SookSiam ICONSIAM","u":"https://www.iconsiam.com/"},{"nm":"Jim Thompson (Shop am Museum)","d":"Thai-Seide in Spitzenqualität – teuer, aber das Original.","q":"Jim Thompson House","u":"https://www.jimthompsonhouse.org/"}],"badge":"2","verdict":"<b>6 Nächte / 5 volle Tage sind richtig – nicht zu lang, nicht zu kurz.</b> Das Bangkok-Pflichtprogramm (Großer Palast/Wat Pho/Wat Arun, Chinatown + Talat Noi, Chatuchak, Jim Thompson/Lumphini, ein Sukhumvit-Abend) braucht bei eurem Tempo mit Hitzepause 4 volle Tage. Chatuchak gibt es nur Sa/So – das passt mit Sa 19.12. genau hinein. Der 5. Tag trägt genau <b>einen Tagesausflug</b>: <b>Ayutthaya</b> (UNESCO-Welterbe, alte Königsstadt, ~80 km, 1–1,5 h) ist die klare Empfehlung, weil es Bangkoks Geschichte erklärt und mit Start 10:00 machbar ist (eingeplant Di 22.12.). <b>Nicht empfohlen:</b> Damnoen Saduak (Schwimmender Markt) ist heute stark touristisch und lebt vom frühen Morgen – das widerspricht eurer Regel „nie vor 10:00“; den Maeklong-Bahnmarkt erlebt man nur zu festen Zugzeiten (zu prüfen), zusammen ein langer Tag im Auto. <b>Kanchanaburi</b> (Brücke am Kwai) liegt 2,5–3 h pro Strecke entfernt – als Tagesausflug zu viel Fahrt, nur mit Übernachtung sinnvoll. Mit 5 Nächten müsstet ihr Ayutthaya oder das entspannte Tempo streichen; eine 7. Nacht bringt keinen echten Mehrwert. Falls ihr keinen Ausflug wollt, ist Di 22.12. der Puffer für Kochkurs, Bang Krachao (grüne Lunge, Radtour) oder Thonglor/Ekkamai-Cafés.","days":[{"iso":"2026-12-17","dt":"Do 17.12.","title":"Ankunft: Fluss & Charoen Krung","route":{"walk":true,"mode":"🚕 Transfer + 🚶 kurzer Abendbummel","lead":"TG 404 landet um 13:45 in Suvarnabhumi, im Hotel seid ihr ca. 15:30. Ankommen, einchecken, durchatmen. Der Abend bleibt bewusst klein: ein Spaziergang am Fluss und ein erstes Abendessen in Gehweite – Charoen Krung ist dafür die beste Adresse der Stadt.","wxi":"☀️","wx":"Dezember = Trockenzeit, Klimamittel ~22–32 °C, abends angenehm."},"items":[{"nm":"Flughafen Suvarnabhumi (BKK)","cat":"sight","nt":"Ankunft aus Singapur: TG 404, Landung 13:45.","map":"Suvarnabhumi Airport","src":"v","time":"13:45","must":false,"gem":false,"noroute":false,"ll":[13.68188,100.74858],"addr":"Racha Thewa, Bang Phli, Samut Prakan 10540","info":{"d":"Bangkoks Hauptflughafen, ~30 km östlich der Stadt. Die TDAC (Digital Arrival Card) ist bereits vor dem Abflug in Singapur erledigt (siehe Reservierungen/Vorbereitung) – an der Passkontrolle nur Pass und TDAC-Bestätigung bereithalten.","t":"Offizielles Taxi am Taxistand (Ebene 1) mit Taxameter; Grab/Bolt am ausgeschilderten Pick-up-Punkt."}},{"nm":"Royal Orchid Sheraton Riverside (Check-in)","cat":"hotel","nt":"Ankunft im Hotel ca. 15:30 – Planungsbasis am Fluss, Hotel noch nicht gebucht.","map":"Royal Orchid Sheraton Riverside Hotel Bangkok","src":"v","url":"https://www.marriott.com/en-us/hotels/bkksi-royal-orchid-sheraton-riverside-hotel-bangkok/overview/","time":"15:30","must":false,"gem":false,"noroute":false,"ll":[13.72915,100.51345],"addr":"2 Soi Charoen Krung 30, Bang Rak, Bangkok 10500","info":{"d":"Klassisches Flusshotel neben dem Si-Phraya-Pier; alle Zimmer mit Blick auf den Chao Phraya.","t":"Bei Ankunft gleich das Shuttleboot-Fahrplanblatt mitnehmen (ICONSIAM / Sathorn Pier)."}},{"nm":"River City Bangkok","cat":"shop","nt":"Kunst- & Antiquitätenzentrum direkt am Fluss, 2 Minuten zu Fuß – entspannter erster Abendbummel.","map":"River City Bangkok","src":"c","url":"https://rivercitybangkok.com/","must":false,"gem":false,"noroute":false,"ll":[13.73045,100.51332],"addr":"23 Soi Charoen Krung 24, Talat Noi, Samphanthawong","info":{"d":"Mehrere Etagen mit Antiquitätenhändlern, Galerien und Ausstellungen; die Uferterrasse ist ein guter Ort für den ersten Blick auf den Fluss.","t":"Händler-Öffnungszeiten zu prüfen; viele Läden schließen am frühen Abend."}}],"flow":[{"seg":"✈️ Nachmittag · Ankunft 13:45 & Transfer (Hotel ca. 15:30)"},{"about":{"t":"Über die Ankunft am Fluss","x":"Vom Flughafen geht es über die Schnellstraße quer durch die Stadt, bis am Ende der Chao Phraya auftaucht – Bangkoks Lebensader. Das Royal Orchid Sheraton steht direkt am Ostufer neben dem Si-Phraya-Pier und dem Kunstzentrum River City. Vor den Fenstern ziehen Expressboote, Querfähren und Schlepper mit langen Lastkähnen vorbei; gegenüber glänzt das ICONSIAM. Der Nachmittag gehört dem Ankommen: Zimmer mit Flussblick, Pool, erste Orientierung am Ufer."}},0,{"tr":"🚕 Taxameter-Taxi oder Grab zum Hotel (~45–60 Min, ~400–500 THB inkl. Maut + 50 THB Flughafenzuschlag). Alternative: Airport Rail Link bis Phaya Thai, dann Grab – mit Gepäck nicht lohnend."},1,{"note":"💡 Bis zum Abend bleibt Zeit: Pool oder Zimmer mit Flussblick, dann ab ~18:00 der kurze Bummel."},{"seg":"🌆 Abend · Charoen Krung (ab ~18:00)"},{"about":{"t":"Über Charoen Krung & Bang Rak","x":"Charoen Krung war ab 1864 Bangkoks erste gepflasterte Straße – gebaut auf Drängen der europäischen Handelshäuser, die hier am Fluss ihre Kontore hatten. Davon zeugen das Alte Zollhaus, die Assumption-Kathedrale und die Kolonialfassaden zwischen Soi 30 und 40. Heute ist das Viertel Bangkoks Kreativ- und Foodie-Meile: alte Garküchen wie Prachak (seit 1909) stehen neben Michelin-Adressen wie 80/20 und Samlor. Nördlich schließt Talat Noi an, ein chinesisches Handwerkerviertel voller Werkstätten und Street Art. Abends ist es hier ruhiger als in Sukhumvit – genau richtig für den ersten Abend."}},2,{"dine":{"top":{"name":"80/20","why":"Michelin-Stern; modernes Thai-Menü mit 80 % lokalen Zutaten – nur ~300 m vom Hotel. Laut Michelin Mi–So 18–23 Uhr (Do also offen).","addr":"1052–1054 Charoen Krung Rd, Bang Rak","price":"€€€"},"value":{"name":"Samlor","why":"Michelin Bib Gourmand: gehobene Streetfood-Küche aus der offenen Küche, berühmtes Omelett. Do 18–22:30 Uhr (Michelin; Di Ruhetag).","addr":"1076 Charoen Krung Rd, Bang Rak","price":"€€"},"insider":{"name":"Charmgang","why":"Bib-Gourmand-Curry-Bar in Talat Noi: kräftige Currys, kleine Karte, junge Küche – abends ~18–21:30 Uhr (zu prüfen).","addr":"Soi Charoen Krung 35, Talat Noi","price":"€€"}}},{"home":"Zu Fuß zurück ins Hotel (alle drei Lokale < 600 m)."}]},{"iso":"2026-12-18","dt":"Fr 18.12.","title":"Altstadt: Palast, Wat Pho, Wat Arun","route":{"walk":true,"mode":"⛴️ Boot + 🚶 zu Fuß · ganzer Tag","lead":"Der große Tempeltag – mit dem Boot staufrei in die Altstadt. Mittags ins klimatisierte Museum Siam, nachmittags Wat Pho und Wat Arun im milderen Licht, zum Sonnenuntergang auf die andere Uferseite schauen. Abends Thai-Fine-Dining mit Tempelblick.","wxi":"☀️","wx":"Mittags heiß und sonnig – Wasser, Kopfbedeckung; Kleidung mit bedeckten Schultern/Knien."},"items":[{"nm":"Si Phraya Pier (Orange-Flag-Boot)","cat":"boat","nt":"Einstieg direkt neben dem Hotel – das Expressboot fährt flussaufwärts zur Altstadt.","map":"Si Phraya Pier Bangkok","src":"c","url":"https://www.chaophrayaexpressboat.com/","must":false,"gem":false,"noroute":false,"ll":[13.72949,100.51306],"addr":"Soi Tha Ruea Si Phraya, Talat Noi","info":{"d":"Die Orange-Flag-Linie ist das reguläre Pendlerboot: Einheitspreis ~18–20 THB (2026 mehrfach angepasst).","t":"Bargeld in kleinen Scheinen bereithalten; Tickets am Pier oder beim Schaffner an Bord."}},{"nm":"Tha Chang Pier","cat":"boat","nt":"Ausstieg für den Großen Palast (~5 Min zu Fuß zum Eingang).","map":"Tha Chang Pier Bangkok","src":"v","must":false,"gem":false,"noroute":false,"ll":[13.7528,100.48854],"addr":"Maha Rat Rd, Phra Borom Maha Ratchawang, Phra Nakhon"},{"nm":"Großer Palast & Wat Phra Kaew","cat":"temple","nt":"Das Muss: Königspalast und Tempel des Smaragd-Buddha. 500 THB, Ticketverkauf bis 15:30.","map":"Grand Palace Bangkok","src":"v","url":"https://www.royalgrandpalace.th/en/home","time":"10:45","must":true,"gem":false,"noroute":false,"ll":[13.74935,100.49186],"addr":"Na Phra Lan Rd, Phra Borom Maha Ratchawang, Phra Nakhon","info":{"d":"Seit 1782 Sitz der Chakri-Könige; der Smaragd-Buddha ist das wichtigste Heiligtum des Landes. Öffnung ab 8:30 – bei Start 10:00 seid ihr mitten im Gruppenstrom, daher zügig zuerst in den Tempelbereich, dann die Palastgebäude.","t":"Strenge Kleiderordnung: Schultern und Knie bedeckt, keine engen/zerrissenen Hosen. Schließt bei königlichen Zeremonien – am Vortag prüfen. Wer am Eingang ‚heute geschlossen‘ hört: Betrugsmasche, ignorieren."}},{"nm":"Museum Siam (Hitzepause)","cat":"museum","nt":"Klimatisiertes, modernes Museum zur Thai-Identität – Mittagspause im Kühlen.","map":"Museum Siam","src":"c","url":"https://www.museumsiam.org/","time":"13:15","must":false,"gem":false,"noroute":false,"ll":[13.74399,100.49385],"addr":"4 Sanam Chai Rd, Phra Borom Maha Ratchawang, Phra Nakhon","info":{"d":"In einem neoklassischen Ministeriumsbau von 1922; interaktive Ausstellung ‚Was ist Thai?‘. Laut Quellen Di–So 10–18 Uhr, Mo geschlossen (zu prüfen).","t":"Mittagessen vorher an den Garküchen rund um den Tha-Tien-Markt oder im Café des Museums."}},{"nm":"Wat Pho – Liegender Buddha","cat":"temple","nt":"46 m langer vergoldeter Buddha, ältester Tempel der Stadt, Wiege der Thai-Massage. ~300 THB.","map":"Wat Pho Bangkok","src":"v","url":"https://www.watpho.com/en/","time":"15:00","must":true,"gem":false,"noroute":false,"ll":[13.74635,100.49274],"addr":"2 Sanam Chai Rd, Phra Borom Maha Ratchawang, Phra Nakhon","info":{"d":"Über 1.000 Buddha-Statuen, Chedis mit Porzellanmosaik und die traditionelle Massageschule im Ostteil. Öffnungszeit laut Quellen 8:00 bis 18:30 (teils abweichend).","t":"Am späten Nachmittag deutlich ruhiger. 30 Min Thai-Massage in der Tempelschule (Preise vor Ort) – länger nicht, Wat Arun hat letzten Einlass ~17:30."}},{"nm":"Tha Tien Pier – Fähre nach Wat Arun","cat":"boat","nt":"Querfähre über den Fluss, ~5 Min.","map":"Tha Tien Pier","src":"v","must":false,"gem":false,"noroute":false,"ll":[13.74579,100.4904],"addr":"Thai Wang Rd, Phra Borom Maha Ratchawang, Phra Nakhon","info":{"d":"Kleine Pendelfähre zum Wat-Arun-Pier, nur wenige Baht (aktueller Preis vor Ort).","t":"Münzen/kleine Scheine bereithalten; zurück geht es vom selben Steg am Wat-Arun-Ufer."}},{"nm":"Wat Arun – Tempel der Morgenröte","cat":"temple","nt":"Steiler Prang mit Porzellanmosaik am Westufer. 200 THB, 8–18 Uhr, letzter Einlass ~17:30.","map":"Wat Arun","src":"v","time":"16:30","must":true,"gem":false,"noroute":false,"ll":[13.7439,100.48851],"addr":"158 Wang Doem Rd, Wat Arun, Bangkok Yai","info":{"d":"Der zentrale Prang ist ~70 m hoch; ihr könnt ein Stück hinaufsteigen (steil!). Tickets nur vor Ort.","t":"Auch hier Schultern/Knie bedecken. Danach zurück über den Fluss – der schönste Blick auf Wat Arun ist von gegenüber."}},{"nm":"Wat-Arun-Blick am Tha-Tien-Ufer (Sonnenuntergang)","cat":"view","nt":"Sonnenuntergang ~17:50 mit Wat Arun gegenüber. Rooftop-Bars am Maharat-Ufer (z. B. Sala Rattanakosin) – Zeiten/Preise zu prüfen.","map":"Wat Arun Viewpoint Wat Pho Pier","src":"c","time":"17:45","must":false,"gem":true,"noroute":false,"ll":[13.7445,100.49124],"addr":"Soi Pratu Nokyung, Maha Rat Rd, Phra Nakhon","info":{"d":"Der klassische Fotostandort für den beleuchteten Prang nach Sonnenuntergang.","t":"Für einen Drink mit Blick eine der Rooftop-Bars wählen; danach weiter zum Abendessen (Vorschläge siehe Restaurant-Staffelung)."}},{"nm":"Raan Jay Fai (nur zur Info)","cat":"food","nt":"Michelin-Stern-Garküche der ‚Krabben-Omelett-Queen‘. Realistisch? Für euch eher nein.","map":"Raan Jay Fai","src":"c","must":false,"gem":false,"noroute":true,"ll":[13.75253,100.50474],"addr":"327 Maha Chai Rd, Samran Rat, Phra Nakhon","info":{"d":"Laut Michelin Mi–Sa 9:00–19:30, So–Di geschlossen; keine echten Reservierungen – Warteliste vor Ort, Wartezeiten von 3–4 Stunden plus ~1 Stunde aufs Essen. Bar zahlen.","t":"Nur wenn ihr einen ganzen Vormittag opfern wollt (früh auf die Liste) – passt nicht zu ‚nie vor 10:00‘. Die Alternative Thipsamai liegt 100 m daneben."}}],"flow":[{"seg":"☀️ Vormittag · Rattanakosin (ab ~10:00)"},{"about":{"t":"Über Rattanakosin","x":"Rattanakosin ist die künstliche Insel, auf der König Rama I. 1782 seine neue Hauptstadt gründete – nachdem Ayutthaya von den Burmesen zerstört worden war. Kanäle trennen das Areal vom Rest der Stadt; innerhalb liegen Großer Palast, Wat Phra Kaew und Wat Pho dicht beieinander. Was ihr seht, ist Staatssymbol und lebendige Religion zugleich: Hier beten Thais, nicht nur Touristen. Respekt ist Pflicht – bedeckte Kleidung, Schuhe aus in Gebetshallen, Füße nie auf Buddha richten. Vormittags drängen Reisegruppen durch die Tore, ab dem frühen Nachmittag wird es spürbar ruhiger."}},0,{"tr":"⛴️ Orange-Flag-Boot Si Phraya → Tha Chang (~25–30 Min, ~18–20 THB)."},1,2,{"seg":"🌤️ Mittag · Hitzepause im Kühlen (~13:00–15:00)"},{"about":{"t":"Über Sanam Chai & das Museum Siam","x":"Südlich von Wat Pho liegt an der Sanam-Chai-Straße ein ruhigeres Stück Altstadt mit Behördenbauten aus der Zeit um 1900. Das Museum Siam nutzt einen neoklassischen Ministeriumsbau von 1922 und erzählt interaktiv, was ‚Thai sein‘ ausmacht – klimatisiert und ohne Gruppenandrang. Unter der Straße liegt die MRT-Station Sanam Chai, deren Halle im Stil eines Thronsaals gestaltet ist. Zum Essen sind die Garküchen am Tha-Tien-Markt nur wenige Minuten entfernt."}},3,{"note":"💡 Mittagessen: Garküchen am Tha-Tien-Markt oder Café im Museum. Wer lieber im Hotel ruht: Grab (~20 Min) und am Nachmittag zurück. Falls Wat Pho ausfällt: Mo 21.12. statt Erawan/Lumphini nachholen."},{"seg":"🌇 Nachmittag · Wat Pho & Wat Arun (ab ~15:00)"},{"about":{"t":"Über das Tha-Tien-Ufer","x":"Tha Tien ist der alte Hafen- und Marktbezirk zwischen Wat Pho und dem Fluss: Ladenhäuser aus der Zeit Ramas V., Großhändler für Trockenfisch und ein kleiner Pier, von dem die Querfähre zum Wat Arun startet. Wat Pho ist älter als Bangkok selbst und war Thailands erste ‚Universität‘ – die Steininschriften zu Medizin und Massage sind heute UNESCO-Weltdokumentenerbe. Am Westufer steht Wat Arun, benannt nach dem Hindu-Gott der Morgenröte; sein Prang leuchtet am schönsten im Abendlicht. Rund um Maharat-Straße haben sich kleine Boutique-Hotels mit Rooftop-Terrassen eingerichtet – der beste Platz für den Sonnenuntergang."}},4,5,{"tr":"⛴️ Querfähre Tha Tien → Wat Arun (~5 Min)."},6,{"tr":"⛴️ Querfähre zurück nach Tha Tien (~5 Min)."},7,8,{"seg":"🌆 Abend · Maharat-Ufer (ab ~19:00)"},{"about":{"t":"Über das Maharat-Ufer am Abend","x":"Wenn die Tagesbesucher gegangen sind, wird das Viertel zwischen Wat Pho und Tha Ti
