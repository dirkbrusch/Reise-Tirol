en still. Die alten Ladenhäuser an der Maharat-Straße beherbergen heute kleine Hotels, Bars und Restaurants mit Dachterrassen. Von dort sieht man den angestrahlten Prang von Wat Arun über dem Fluss – einer der schönsten Abendblicke der Stadt. Nusara gehört zu einer Gruppe von Lokalen, die den Blick über Wat Pho bis zum Fluss mit gehobener Thai-Küche verbinden. Wer es einfacher mag, findet in Banglamphu (10 Min Grab) Garküchen-Klassiker wie Thip Samai."}},{"dine":{"top":{"name":"Nusara","why":"Michelin-Stern; Thai-Familienrezepte als Degustationsmenü, Dachterrasse mit Blick auf Wat Pho – zu Fuß vom Sonnenuntergangsplatz. Laut Michelin täglich 18–23 Uhr; gehört zu den schwersten Tischen der Stadt.","addr":"336 Maha Rat Rd, Phra Borom Maha Ratchawang, Phra Nakhon","price":"€€€"},"value":{"name":"Krua Apsorn (Dinso Rd)","why":"Michelin Bib Gourmand, legendär für Krabbenfleisch-Omelett und Curry mit Krebsfleisch; bodenständig. Schließt laut Quellen schon ~19:30–20:00 – nur, wenn ihr bis ~19:00 dort seid (direkt nach dem Sonnenuntergang per Grab, ~10 Min).","addr":"Dinso Rd, nahe Demokratiedenkmal, Phra Nakhon","price":"€"},"insider":{"name":"Thip Samai","why":"Bangkoks berühmtestes Pad Thai, serviert im Ei-Mantel, seit Jahrzehnten am selben Ort – abends Schlange, geht aber zügig.","addr":"313 Maha Chai Rd, Samran Rat, Phra Nakhon","price":"€"}}},{"home":"Rückweg per Grab (~20–30 Min); die Boote fahren abends nicht mehr verlässlich."}]},{"iso":"2026-12-19","dt":"Sa 19.12.","title":"Chatuchak, Or Tor Kor & Ari","route":{"walk":true,"mode":"⛴️ Shuttleboot + 🚝 BTS + 🚶 · ganzer Tag","lead":"Samstag = Chatuchak-Tag (nur am Wochenende!). Danach der beste Frischmarkt der Stadt und eine Kaffeepause im Café-Viertel Ari. Nachmittags Pool, abends Sundowner über dem Fluss.","wxi":"☀️","wx":"Chatuchak ist nicht klimatisiert – leichte Kleidung, Wasser, bis ~13 Uhr wieder raus."},"items":[{"nm":"Chatuchak Weekend Market","cat":"market","nt":"Einer der größten Märkte der Welt, nur Sa/So (~9–18 Uhr). Keramik, Textilien, Vintage, Pflanzen, Streetfood.","map":"Chatuchak Weekend Market","src":"v","url":"https://www.chatuchakmarket.org/","time":"10:45","must":true,"gem":false,"noroute":false,"ll":[13.80027,100.55112],"addr":"Kamphaeng Phet 2 Rd, Chatuchak","info":{"d":"Über 15.000 Stände in 27 Sektionen; die Hallen sind teils überdacht, aber nicht klimatisiert. Plan vom Eingang (Clock Tower als Orientierung) mitnehmen.","t":"Bis ~13 Uhr bleiben, dann wird es zu heiß. Handeln ist üblich, aber freundlich; Bargeld mitnehmen."}},{"nm":"Or Tor Kor Market","cat":"market","nt":"Bangkoks schönster Frischmarkt direkt gegenüber – Obst, Currys, Mittag an den Essständen.","map":"Or Tor Kor Market","src":"v","time":"12:45","must":false,"gem":true,"noroute":false,"ll":[13.79713,100.54757],"addr":"101 Kamphaeng Phet Rd, Chatuchak","info":{"d":"Der Markt der Landwirtschaftsorganisation gilt als einer der saubersten und besten Frischmärkte Asiens; Mangos, Durian, Thai-Süßigkeiten in Spitzenqualität. Täglich ab 6 Uhr (Schluss laut Quellen 18–20 Uhr).","t":"Hier Mittag essen: fertige Currys und Reisgerichte in der Food-Ecke."}},{"nm":"NANA Coffee Roasters Ari (Hitzepause)","cat":"cafe","nt":"Gewächshaus-Café mit Slow Bar und Thai-Kaffee-Flights – klimatisierte Pause.","map":"NANA Coffee Roasters Ari","src":"c","time":"13:45","must":false,"gem":true,"noroute":false,"ll":[13.78269,100.54197],"addr":"24/2 Soi Ari 4, Phaya Thai","info":{"d":"Ari ist das ruhige, grüne Wohnviertel mit der höchsten Café-Dichte Bangkoks; NANA ist die Flaggschiff-Rösterei.","t":"Öffnungszeiten zu prüfen."}},{"nm":"Soi Ari – Café- und Ladenbummel","cat":"street","nt":"Kurzer Spaziergang durch die Soi Ari: kleine Cafés, Bäckereien, Garküchen der Büroangestellten.","map":"Soi Ari Bangkok","src":"c","must":false,"gem":false,"noroute":false,"ll":[13.78021,100.54469],"addr":"Soi Phahon Yothin 7 (Soi Ari), Phaya Thai","info":{"d":"Rund um den BTS-Ausgang 3 liegen zahlreiche kleine Lokale; Time Out und Café-Guides führen u. a. Laliart Coffee und Oh! Vacoda.","t":"Danach BTS Ari → Siam → Saphan Taksin und Shuttleboot ins Hotel."}},{"nm":"ThreeSixty Rooftop Bar (Millennium Hilton) – Sonnenuntergang","cat":"bar","nt":"Rooftop über dem Westufer mit Rundumblick auf Fluss und Skyline; öffnet laut Hilton täglich 17:00 – rechtzeitig zum Sonnenuntergang (~17:50).","map":"ThreeSixty Rooftop Bar Millennium Hilton Bangkok","src":"v","url":"https://www.hilton.com/en/hotels/bkkhitw-millennium-hilton-bangkok/dining/","time":"17:15","must":true,"gem":false,"noroute":false,"ll":[13.72868,100.51097],"addr":"123 Charoen Nakhon Rd, Khlong Ton Sai, Khlong San","info":{"d":"Bar und Jazz-Lounge in den obersten Etagen des Millennium Hilton (Etagenangaben 31/32 je nach Quelle). Laut offizieller Hilton-Seite täglich ab 17:00; Live-Jazz in der Lounge abends außer montags.","t":"Gegen 17:15 da sein und einen Platz mit Flussblick wählen. Dresscode vermutlich smart casual – zu prüfen. Von hier ~5 Min zu Fuß zum ICONSIAM."}},{"nm":"ICONSIAM – Weihnachtsbeleuchtung & SookSiam","cat":"shop","nt":"Option nach dem Sundowner: Lichterinstallation am River Park (2025: bis 25.12., 16–22 Uhr, kostenlos; 2026 zu prüfen).","map":"ICONSIAM","src":"c","url":"https://www.iconsiam.com/","must":false,"gem":false,"noroute":true,"ll":[13.72682,100.51029],"addr":"299 Charoen Nakhon Rd, Khlong Ton Sai, Khlong San","info":{"d":"Mall-Gigant am Westufer mit Flusspromenade; im Untergeschoss SookSiam mit Regionalküche aus ganz Thailand.","t":"Mit dem Hotel-Shuttleboot erreichbar (Fahrplan prüfen)."}},{"nm":"Sky Bar at lebua (optional danach)","cat":"bar","nt":"Open-Air-Bar im 63. Stock über dem Fluss, ~1 km vom Hotel – optional nach dem Sonnenuntergang.","map":"Sky Bar lebua State Tower","src":"v","url":"https://lebua.com/restaurants/sky/","must":false,"gem":false,"noroute":true,"ll":[13.72151,100.51689],"addr":"1055 Silom Rd (State Tower), Bang Rak","info":{"d":"Durch ‚Hangover 2‘ weltberühmt; der Blick über die Flussbiegung bei Nacht ist spektakulär. Drinks im Hochpreisbereich. Öffnet laut den meisten Quellen erst 18:00 (einzelne Angaben 17:00) – deshalb nicht für den Sonnenuntergang eingeplant.","t":"Öffnungszeit vor Ort prüfen. Smart casual: keine Flip-Flops, keine Sportkleidung, Männer keine ärmellosen Shirts. Am Wochenende Lift-Schlange einplanen."}}],"flow":[{"seg":"☀️ Vormittag · Chatuchak (ab ~10:00)"},{"tr":"⛴️ Hotel-Shuttleboot → Sathorn Pier, 🚝 BTS Saphan Taksin → Siam (umsteigen) → Mo Chit (~45 Min). Alternative: Grab ~35–50 Min je nach Verkehr."},{"about":{"t":"Über Chatuchak","x":"Der Wochenendmarkt zog 1982 hierher und ist seitdem Bangkoks Basar schlechthin – über 15.000 Stände auf rund 14 Hektar. Die Sektionen sind grob nach Waren sortiert: Keramik und Kunsthandwerk, Kleidung junger Thai-Designer, Antiquitäten, Pflanzen, Tiere. Zwischen den Gängen kocht man Kokoseis, Paella und gegrillte Würste. Gegenüber liegt Or Tor Kor, der Vorzeige-Frischmarkt der staatlichen Landwirtschaftsorganisation – das Gegenprogramm aus Ordnung und Qualität. Wer gezielt sucht, braucht einen Plan; wer bummelt, findet sowieso etwas."}},0,{"note":"💡 Gute Mitbringsel: handgemachte Keramik (Sektion 25/17), Seifen und Duftöle, Thai-Kochutensilien. Ware vor dem Kauf prüfen – vieles gibt es auch in Charoen Krung hochwertiger."},1,{"seg":"🌤️ Mittag · Ari – Kaffee im Kühlen (~13:30–15:00)"},{"tr":"🚝 BTS Mo Chit → Ari (2 Stationen, ~5 Min)."},{"about":{"t":"Über Ari","x":"Ari war lange ein Beamtenviertel rund um die Ministerien an der Phahon-Yothin-Straße – grün, ruhig, mit alten Villen in Seitengassen. Seit etwa 2010 haben junge Thais hier Cafés, Bäckereien und kleine Läden eröffnet; heute gilt Ari als Bangkoks dichtestes Café-Viertel. Touristen sind selten, die Gäste sind Kreative und Büroangestellte. Mittags verkaufen Garküchen an der Soi Ari Nudelsuppen und Reisgerichte an die Arbeiter der umliegenden Büros. Ein guter Ort, um Bangkok im Alltag zu sehen."}},2,3,{"tr":"🚝 BTS Ari → Siam → Saphan Taksin, ⛴️ Shuttleboot ins Hotel (~45 Min). Danach Pool-Pause bis ~16:45."},{"seg":"🌆 Abend · Fluss von oben (ab ~17:00)"},{"about":{"t":"Über Bang Rak am Fluss","x":"Die Flussbiegung bei der Taksin-Brücke ist Bangkoks alte Luxusadresse: Hier stehen das Mandarin Oriental von 1876, der State Tower mit der Sky Bar und gegenüber am Westufer der Glaspalast ICONSIAM. Zwischen den Hochhäusern hat Charoen Krung seine Garküchen behalten – Jok Prince kocht Reissuppe wenige Schritte unter der teuersten Bar der Stadt. Abends spiegeln sich die Lichter beider Ufer im Wasser, Hotelboote pendeln hin und her. Im Dezember leuchtet die Weihnachtsdekoration am ICONSIAM-Ufer. Gegensätze auf engstem Raum sind hier die Regel."}},{"tr":"⛴️ Hotel-Shuttleboot → ICONSIAM-Pier (~5 Min, Fahrplan prüfen), dann ~5 Min zu Fuß zum Millennium Hilton."},4,5,{"warn":"Sky Bar at lebua optional nach dem Sonnenuntergang: zurück übers Wasser, dann ~1 km zu Fuß oder Grab – Öffnungszeit vor Ort prüfen (laut den meisten Quellen ab 18:00)."},6,{"dine":{"top":{"name":"Saawaan","why":"Modernes Thai-Degustationsmenü, laut Michelin täglich 17:30–23:30 Uhr. Liegt in Sathorn: ab ICONSIAM/Millennium Hilton per Grab ~20 Min. Sternestatus 2026 auf der Michelin-Seite nicht eindeutig – zu prüfen.","addr":"39/19 Soi Suan Phlu, Sathon Rd, Thung Maha Mek, Sathon","price":"€€€"},"value":{"name":"SookSiam im ICONSIAM","why":"Indoor-Markt mit Gerichten aus allen Regionen Thailands an Dutzenden Ständen – ideal zum Probieren, kombinierbar mit der Weihnachtsbeleuchtung.","addr":"ICONSIAM (UG), 299 Charoen Nakhon Rd, Khlong San","price":"€"},"insider":{"name":"Jok Prince","why":"Bib-Gourmand-Reissuppe über Holzkohle, wenige Schritte vom State Tower (Sky Bar); öffnet abends wieder. Ein Teller, kein Schnickschnack.","addr":"1391 Charoen Krung Rd, Bang Rak (nahe Robinson / BTS Saphan Taksin)","price":"€"}}},{"home":"Von ICONSIAM/Millennium Hilton per Shuttleboot; vom State Tower zu Fuß (~15 Min) oder Grab."}]},{"iso":"2026-12-20","dt":"So 20.12.","title":"Charoen Krung, Talat Noi & Chinatown","route":{"walk":true,"mode":"🚶 zu Fuß ab Hotel + 🚕 kurze Grab-Sprünge · ganzer Tag","lead":"Ein Tag fast ganz zu Fuß ab dem Hotel – nur zwei kurze Grab-Sprünge (mittags zurück ins Hotel, abends Talat Noi → Chinatown) und Grab/MRT für den Rückweg: morgens die Kolonial- und Kreativmeile südlich des Hotels, mittags Ente bei Prachak und Pool. Am späten Nachmittag nördlich durch Talat Noi und dann hinein in den Abend von Chinatown.","wxi":"☀️","wx":"Vormittags und ab ~16 Uhr gut zu Fuß; dazwischen Hotelpool."},"items":[{"nm":"Warehouse 30","cat":"shop","nt":"Umgebautes Lagerhaus-Ensemble: Designläden, Galerie, Café – direkt neben dem Hotel.","map":"Warehouse 30 Bangkok","src":"c","time":"10:00","must":false,"gem":true,"noroute":false,"ll":[13.72809,100.51479],"addr":"52–60 Soi Charoen Krung 30, Bang Rak","info":{"d":"Lagerhallen aus dem Zweiten Weltkrieg, vom Architekten Duangrit Bunnag zum Kreativzentrum umgebaut – Keimzelle des Kreativviertels Charoen Krung.","t":"Läden öffnen teils erst gegen 11 Uhr – zu prüfen."}},{"nm":"Bangkokian Museum","cat":"museum","nt":"Vier Holzhäuser von 1937 mit Alltagsleben einer Bangkoker Familie – kostenlos.","map":"Bangkokian Museum","src":"c","time":"10:30","must":false,"gem":true,"noroute":false,"ll":[13.72812,100.51814],"addr":"273 Soi Charoen Krung 43, Bang Rak","info":{"d":"Eine Perle nebendran: ehemaliges Wohnhaus einer Ärztefamilie in der Soi Charoen Krung 43 (östlich der Hauptstraße, ~300 m von der Hauptpost), mit Möbeln, Geschirr und Fotos aus der Mitte des 20. Jahrhunderts.","t":"Laut den meisten Quellen Mi–So 10–16 Uhr, Eintritt frei (Zeiten weichen ab – zu prüfen)."}},{"nm":"Haroon-Moschee","cat":"temple","nt":"Kleine weiße Moschee von 1828 hinter dem Alten Zollhaus – ruhige Oase.","map":"Haroon Mosque Bangkok","src":"c","must":false,"gem":false,"noroute":false,"ll":[13.72553,100.51448],"addr":"Soi Charoen Krung 36, Bang Rak","info":{"d":"Zeugnis der muslimischen Händlergemeinde am Fluss; das umliegende Gassenviertel mit Halal-Garküchen ist kaum touristisch.","t":"Nur von außen bzw. zurückhaltend besuchen; nicht zu Gebetszeiten. Schultern/Knie bedecken."}},{"nm":"Altes Zollhaus (Old Customs House)","cat":"sight","nt":"Neoklassische Ruine von 1888 am Fluss – eines der fotogensten Gebäude der Stadt.","map":"Old Customs House Bangkok","src":"c","must":false,"gem":false,"noroute":false,"ll":[13.72524,100.51394],"addr":"Soi Charoen Krung 36, Bang Rak","info":{"d":"Einst Zollstation für alle Schiffe, später Feuerwache; seit Jahren wird es zu einem Luxushotel umgebaut (Zugang/Baustelle aktuell zu prüfen).","t":"Von der Gasse aus fotografieren."}},{"nm":"Assumption-Kathedrale","cat":"sight","nt":"Neoromanische Kathedrale von 1910 mit prächtigem Innenraum.","map":"Assumption Cathedral Bangkok","src":"c","must":false,"gem":false,"noroute":false,"ll":[13.72311,100.51514],"addr":"23 Soi Charoen Krung 40, Bang Rak","info":{"d":"Hauptkirche der katholischen Erzdiözese, von französischen Missionaren gegründet; Papst Johannes Paul II. (1984) und Papst Franziskus (2019) feierten hier.","t":"Sonntags Messen – während des Gottesdienstes nur hinten stehen."}},{"nm":"Prachak Roasted Duck (Mittag)","cat":"food","nt":"Seit 1909: Ente und Schweinebauch auf Reis oder Eiernudeln – die Institution an Charoen Krung.","map":"Prachak Roasted Duck Charoen Krung","src":"c","time":"12:30","must":true,"gem":false,"noroute":false,"ll":[13.72034,100.51604],"addr":"1415 Charoen Krung Rd, Bang Rak","info":{"d":"Vierte Generation, gelistet im Michelin Guide; schnell, günstig, klimatisiert ist es nicht.","t":"Danach per Grab oder Tuk-Tuk zurück ins Hotel (~5 Min) – Hitzepause im klimatisierten Zimmer oder am Pool bis ~15:30."}},{"nm":"Holy-Rosary-Kirche (Kalawar)","cat":"sight","nt":"Neogotische Kirche von 1897, gegründet von portugiesischen Siedlern.","map":"Holy Rosary Church Bangkok","src":"c","time":"15:45","must":false,"gem":false,"noroute":false,"ll":[13.73126,100.51348],"addr":"Soi Wanit 2, Talat Noi, Samphanthawong","info":{"d":"Die älteste katholische Gemeinde Bangkoks geht auf Portugiesen zurück, die nach dem Fall Ayutthayas hierher kamen; der Innenraum ist überraschend farbig.","t":"Vom Hotel nur ~300 m zu Fuß. Innenraum außerhalb der Messen – Öffnungszeiten zu prüfen, sonst von außen."}},{"nm":"So Heng Tai Mansion","cat":"sight","nt":"Chinesisches Hofhaus von ~1800 mit Pool im Innenhof – 50 THB inkl. Getränk.","map":"So Heng Tai Mansion","src":"c","time":"16:15","must":false,"gem":true,"noroute":false,"ll":[13.73362,100.51211],"addr":"Soi Phanurangsi, Talat Noi, Samphanthawong","info":{"d":"Eines der letzten Hokkien-Hofhäuser der Stadt, bis heute von der Familie bewohnt; der Pool im Innenhof ist heute eine Tauchschule.","t":"Laut Quellen ~9–18 Uhr, gelegentlich geschlossen – zu prüfen."}},{"nm":"Mother Roaster","cat":"cafe","nt":"Specialty-Kaffee über einer Autoteile-Werkstatt – Talat Noi in einem Bild.","map":"Mother Roaster Talat Noi","src":"c","time":"16:45","must":false,"gem":false,"noroute":false,"ll":[13.733,100.51231],"addr":"Soi Wanit 2, Talat Noi, Samphanthawong","info":{"d":"Über eine Treppe zwischen Motorteilen ins Obergeschoss; die Röster sind eine Familie aus der Nachbarschaft.","t":"Schließt laut Quellen ~17–18 Uhr, Ruhetag Mo (evtl. auch Di) – vor 17:30 da sein."}},{"nm":"Píjiǔ Bar (Craft-Bier)","cat":"beer","nt":"Winzige Bar in einem alten Ladenhaus – Thai-Craft-Bier vom Fass als Auftakt für Chinatown.","map":"Pijiu Bar Soi Nana Chinatown","src":"c","time":"17:45","must":false,"gem":true,"noroute":false,"ll":[13.7399,100.51393],"addr":"16 Soi Nana (Chinatown), Pom Prap Sattru Phai","info":{"d":"Die Soi Nana in Chinatown (nicht die in Sukhumvit!) ist Bangkoks Mini-Bargasse in alten Ladenhäusern.","t":"Öffnungszeiten zu prüfen."}},{"nm":"Yaowarat Road – Streetfood-Meile","cat":"street","nt":"Abends verwandelt sich die Hauptstraße in eine Garküchen-Meile unter Neonschildern.","map":"Yaowarat Road Bangkok","src":"v","time":"18:30","must":true,"gem":false,"noroute":false,"ll":[13.74214,100.50716],"addr":"Yaowarat Rd, Samphanthawong","info":{"d":"Ab ~18 Uhr stehen die Stände dicht an dicht – Austern-Omelett, Fischbällchen, gegrillte Meeresfrüchte, Mango Sticky Rice.","t":"Kleine Scheine, Feuchttücher, Appetit."}},{"nm":"Wat Mangkon Kamalawat","cat":"temple","nt":"Größter chinesisch-buddhistischer Tempel der Stadt, Räucherstäbchen-Nebel.","map":"Wat Mangkon Kamalawat","src":"c","must":false,"gem":false,"noroute":false,"ll":[13.74354,100.50954],"addr":"Charoen Krung Rd, Pom Prap Sattru Phai","info":{"d":"Gegründet 1871; das Herz des religiösen Lebens in Chinatown.","t":"Abends vermutlich geschlossen – von außen ansehen (Beleuchtung zu prüfen)."}}],"flow":[{"seg":"☀️ Vormittag · Charoen Krung Süd (ab ~10:00)"},{"about":{"t":"Über das Kreativviertel Charoen Krung","x":"Rund um die Sois 30 bis 43 lag Bangkoks Tor zur Welt: Zollhaus, Konsulate, die East Asiatic Company, katholische und muslimische Gemeinden nebeneinander. Mit dem Bedeutungsverlust des Flusshafens verfielen die Gebäude. Seit etwa 2015 ziehen Galerien, Designer und das Thailand Creative & Design Center in die alte Hauptpost – das Viertel heißt nun offiziell ‚Creative District‘. Zwischen Street Art und Lagerhallen findet man unverändert Familienküchen und Werkstätten. Hier begegnen sich Bangkoks Geschichte und seine jüngste Szene auf wenigen hundert Metern."}},0,1,2,3,4,{"seg":"🌤️ Mittag · Ente & Hitzepause im Hotel (~12:30–15:30)"},{"about":{"t":"Über Prachak & die Mittagspause","x":"Prachak verkauft seit 1909 Brat-Ente an Charoen Krung, nahe der BTS-Station Saphan Taksin; im Schaufenster hängen die glänzenden Enten, drinnen geht es schnell und schlicht zu. Bestellt wird Ente oder Schweinebauch auf Reis oder Eiernudeln – ein Teller, dann weiter. Das Lokal ist nicht klimatisiert, und die Straße heizt sich mittags stark auf. Deshalb geht es nach dem Essen per Grab oder Tuk-Tuk die gut 1 km zurück ins Hotel: kühles Zimmer oder Pool bis ~15:30."}},5,{"tr":"🚕 Grab oder Tuk-Tuk Prachak → Hotel (~1 km, ~5 Min) statt Fußweg in der Mittagshitze – Pause im klimatisierten Zimmer oder am Pool."},{"seg":"🌇 Nachmittag · Talat Noi (ab ~15:30)"},{"about":{"t":"Über Talat Noi","x":"Talat Noi – ‚kleiner Markt‘ – ist eines der ältesten Viertel Bangkoks: Portugiesen nach dem Fall Ayutthayas, dann Hokkien- und Teochew-Chinesen siedelten hier am Fluss. Heute prägen Autoteile-Werkstätten das Bild: Motorblöcke stapeln sich vor 150 Jahre alten Ladenhäusern. In den engen Gassen findet ihr chinesische Schreine, Street Art und versteckte Cafés. So Heng Tai, ein Hofhaus von etwa 1800, zeigt, wie wohlhabende Händler lebten. Das Viertel ist bewohnt und arbeitet – leise sein, Werkstätten nicht ungefragt fotografieren."}},6,7,8,{"seg":"🌆 Abend · Chinatown/Yaowarat (ab ~17:45)"},{"about":{"t":"Über Yaowarat (Chinatown)","x":"Bangkoks Chinatown entstand 1782, als König Rama I. die chinesischen Händler vom Palastgelände hierher umsiedelte. Die Yaowarat-Straße wurde 1891 angelegt und ist bis heute das Zentrum des Goldhandels – Dutzende Goldläden mit roten Fassaden. Nach Sonnenuntergang übernehmen die Garküchen die Bürgersteige: gegrillte Meeresfrüchte, Nudelsuppen, Austern-Omelett, Bird's-Nest-Suppe, Desserts aus Ginkgo und Sesam. Die Seitengassen wie Soi Nana sind in den letzten Jahren zu einer kleinen Barszene in alten Ladenhäusern geworden. Montags haben viele Stände Ruhetag – sonntags ist der Abend voll da."}},{"tr":"🚕 Grab Talat Noi → Soi Nana (~5–10 Min) – spart ~800 m Fußweg; zu Fuß (~12 Min) nur bei Lust."},9,10,{"warn":"Wat Mangkon: ~300 m Abstecher von der Yaowarat Road, abends nur von außen – nur bei Lust."},11,{"dine":{"top":{"name":"Potong","why":"Michelin-Stern: Chefin Pichaya ‚Pam‘ Soontornyanakij kocht ‚progressives Thai-Chinesisch‘ im 120 Jahre alten Haus ihrer Familie. Laut Michelin So offen (15:30–23 Uhr), Mi geschlossen. Reservierung ~6 Wochen vorher.","addr":"422 Vanich 1 Rd, Samphanthawong","price":"€€€"},"value":{"name":"T&K Seafood","why":"Die Ecke mit den grünen Shirts: gegrillte Flussgarnelen, Krebs, Meeresfrüchte auf Plastikhockern am Straßenrand – ab 19 Uhr Schlange. Öffnungszeiten nicht verifiziert.","addr":"49–51 Phadung Dao Rd (Ecke Yaowarat), Samphanthawong","price":"€€"},"insider":{"name":"Nai Ek Roll Noodle","why":"Bib Gourmand: Kuay Chap – gerollte Reisnudeln in pfeffriger Brühe mit knusprigem Schweinebauch; laut Time Out täglich 8–24 Uhr.","addr":"442 Soi Yaowarat 9, Samphanthawong","price":"€"}}},{"home":"🚕 Grab Yaowarat → Hotel (~10 Min); zu Fuß ~1,8 km über Charoen Krung nur bei Lust."}]},{"iso":"2026-12-21","dt":"Mo 21.12.","title":"Jim Thompson, Lumphini & Sukhumvit","route":{"walk":true,"mode":"🚝 BTS/Grab + 🚶 · ganzer Tag","lead":"Der moderne Teil der Stadt: morgens das Teakhaus des Seidenkönigs, mittags Foodhall und lange Hitzepause im Kühlen, nachmittags Lumphini Park im milder werdenden Licht. Dann eine Stunde Massage – und abends nach Sukhumvit zum besten Thai-Restaurant des Landes. (Montag ist bewusst gewählt: Chinatown-Streetfood und Museum Siam ruhen, Jim Thompson ist täglich offen.)"},"items":[{"nm":"Jim Thompson House","cat":"museum","nt":"Teakhaus-Ensemble des ‚Seidenkönigs‘ – nur mit Führung (Pflicht), 250 THB, täglich 10–17 Uhr.","map":"Jim Thompson House","src":"v","url":"https://www.jimthompsonhouse.org/","time":"10:45","must":true,"gem":false,"noroute":false,"ll":[13.74923,100.52828],"addr":"6 Soi Kasem San 2, Rama I Rd, Pathum Wan","info":{"d":"Der Amerikaner Jim Thompson belebte nach 1945 die Thai-Seidenweberei und verschwand 1967 spurlos in Malaysia. Sein Haus aus sechs alten Teakhäusern ist voller asiatischer Kunst.","t":"Tickets nur an der Kasse (kein Online-Verkauf), keine Reservierung nötig; im Haus Fotoverbot."}},{"nm":"Siam Paragon – Gourmet Market & Food Hall (Mittag)","cat":"food","nt":"Mittag und Hitzepause im Kühlen: riesige Foodhall und Feinkostmarkt.","map":"Siam Paragon Gourmet Market","src":"c","time":"12:15","must":false,"gem":false,"noroute":false,"ll":[13.74678,100.53495],"addr":"991 Rama I Rd, Pathum Wan","info":{"d":"Luxusmall mit einer der größten Foodhalls der Stadt; im Gourmet Market gute Mitbringsel (Thai-Tee, Gewürze, Trockenfrüchte).","t":"Hitzepause bewusst lang nehmen und erst ~14:30 wieder hinaus."}},{"nm":"Erawan-Schrein","cat":"temple","nt":"Hindu-Schrein an der Kreuzung Ratchaprasong – Tänzerinnen, Blumenketten, Gebete im Verkehr.","map":"Erawan Shrine","src":"v","time":"14:30","must":false,"gem":false,"noroute":false,"ll":[13.74432,100.54042],"addr":"494 Ratchadamri Rd, Pathum Wan","info":{"d":"Errichtet 1956, um Unglück beim Bau des Erawan-Hotels abzuwenden; heute einer der meistbesuchten Schreine der Stadt. Wer für einen Wunsch betet, bezahlt Tänzerinnen als Dank.","t":"Nur kurz (~15 Min), dann ~550 m zu Fuß zur BTS Ratchadamri und 1 Station bis Sala Daeng – oder Grab (~8 Min)."}},{"nm":"Lumphini Park","cat":"nature","nt":"Bangkoks Central Park: Seen, Tai-Chi, Jogger – und meterlange Warane.","map":"Lumphini Park","src":"v","time":"15:15","must":true,"gem":false,"noroute":false,"ll":[13.7306,100.54154],"addr":"Rama IV Rd, Lumphini, Pathum Wan","info":{"d":"Benannt nach Buddhas Geburtsort Lumbini; Ruderboote auf dem großen See (Hintergrund siehe Gegend-Notiz).","t":"Runde um den großen See ~2,5 km – nach Lust abkürzen; gegen 16:15 per Grab weiter zur Massage."}},{"nm":"Health Land Sathorn – Thai-Massage","cat":"spa","nt":"1 Stunde traditionelle Thai-Massage vor dem Dinner (16:30–17:30).","map":"Health Land Sathorn","src":"c","url":"https://www.healthlandspa.com/","time":"16:30","must":false,"gem":false,"noroute":false,"ll":[13.72132,100.52643],"addr":"120 North Sathorn Rd, Silom, Bang Rak","info":{"d":"Großes Spa in einer Villa, beliebt bei Einheimischen; Preise deutlich unter Hotelspas (aktuelle Preise zu prüfen).","t":"Vorab online/telefonisch reservieren; danach direkt per Grab nach Sukhumvit."}},{"nm":"Octave Rooftop Bar (Marriott Sukhumvit) – nur bei der lockeren Variante","cat":"bar","nt":"Option zur lockeren Abend-Variante (Khua Kling + Pak Sod in Thonglor): Rooftop über Thonglor, Etagen 45–49, 360°-Blick.","map":"Octave Rooftop Bar Bangkok Marriott Sukhumvit","src":"c","must":false,"gem":false,"noroute":true,"ll":[13.72337,100.58052],"addr":"2 Soi Sukhumvit 57, Khlong Tan Nuea, Watthana","info":{"d":"Täglich ab 17 Uhr, Schluss je nach Quelle 0–2 Uhr; ein Marriott-Haus (Status-Vorteile prüfen).","t":"Nach dem Sorn-Menü (~3 h) zu spät – nur zusammen mit dem einfacheren Abendessen in Thonglor einplanen."}},{"nm":"Kochkurs-Option: Silom Thai Cooking School","cat":"food","nt":"Alternative für Puffer-/Ruhetage: halbtägiger Kochkurs mit Marktbesuch.","map":"Silom Thai Cooking School","src":"c","url":"https://www.silomthaicooking.com/","must":false,"gem":false,"noroute":true,"ll":[13.72265,100.52444],"addr":"68 Soi Si Lom 13, Silom, Bang Rak","info":{"d":"Bekannte, preiswerte Kochschule in einem Altbau in Silom; Kurse vormittags, nachmittags und abends (Zeiten/Preise zu prüfen).","t":"Ein Nachmittags- oder Abendkurs passt zu ‚nie vor 10:00‘; z. B. statt Ayutthaya am Di 22.12."}}],"flow":[{"seg":"☀️ Vormittag · Siam (ab ~10:00)"},{"tr":"🚕 Grab Hotel → Jim Thompson House (~25–35 Min) oder ⛴️ Shuttleboot + 🚝 BTS Saphan Taksin → National Stadium (Silom-Linie, ohne Umsteigen, ~40 Min)."},{"about":{"t":"Über Siam & Pathum Wan","x":"Pathum Wan ist das kommerzielle Herz Bangkoks: Shopping-Malls entlang der Rama-I-Straße, die Chulalongkorn-Universität, der Skytrain über allem. Mitten darin liegt am Khlong Saen Saep das Jim Thompson House – ein grüner Rückzugsort, in dem man den Verkehr vergisst. Gegenüber am Kanal lebten die Cham-Muslime, deren Webereien Thompson einst belieferten. Die Kreuzung Ratchaprasong mit dem Erawan-Schrein zeigt, wie selbstverständlich Glaube und Kommerz hier nebeneinander stehen. Mittags flüchtet ganz Bangkok in die klimatisierten Foodhalls."}},0,{"tr":"🚶 Jim Thompson → Siam Paragon (~1,2 km, ~15 Min, an Rama I Rd entlang) – bei Hitze BTS National Stadium → Siam (1 Station)."},{"seg":"🌤️ Mittag · Foodhall & Hitzepause im Kühlen (~12:15–14:30)"},{"about":{"t":"Über Siam Square & die Malls","x":"Rund um die BTS-Station Siam liegt Bangkoks Einkaufsherz: Siam Paragon, Siam Center und Siam Discovery stehen Wand an Wand, gegenüber liegt das Gassenraster von Siam Square mit kleinen Läden und Lokalen für die Studierenden der benachbarten Chulalongkorn-Universität. Die Malls sind hier mehr als Einkaufsorte – sie sind die klimatisierten öffentlichen Räume der Stadt, in denen sich mittags Büroangestellte, Familien und Schulklassen treffen. Im Untergeschoss des Paragon liegen eine große Food Hall und der Gourmet Market mit Gerichten und Zutaten aus allen Landesteilen. Wer Mitbringsel sucht, findet hier Thai-Tee, Gewürzpasten und Trockenfrüchte. Draußen ist es um diese Zeit am heißesten – deshalb bleibt ihr bis ~14:30 im Kühlen."}},1,{"note":"💡 Hitzepause: bis ~14:30 in der klimatisierten Mall bleiben (Gourmet Market, Siam Center/Siam Discovery nebenan), erst dann weiter."},{"seg":"🌇 Nachmittag · Ratchaprasong & Lumphini (ab ~14:30)"},{"about":{"t":"Über Lumphini","x":"Der Lumphini Park wurde in den 1920er-Jahren von König Rama VI. auf königlichem Land angelegt und ist bis heute Bangkoks wichtigste Grünfläche – 57 Hektar mit Seen, Pavillons und alten Bäumen. Morgens und ab dem späten Nachmittag gehört er den Einheimischen: Tai-Chi, Aerobic zu Lautsprechermusik, Jogger. Berühmt sind die Bindenwarane, die träge an den Ufern liegen. Um 18 Uhr ertönt die Nationalhymne, und der ganze Park bleibt kurz stehen. Rundherum liegen Silom, Sathorn und das Botschaftsviertel."}},2,{"tr":"🚶 ~550 m zur BTS Ratchadamri (Silom-Linie), 🚝 1 Station bis Sala Daeng – der Standardweg bei Hitze; der Park liegt gegenüber der Station. Alternative: Grab (~8 Min)."},{"warn":"Zu Fuß Erawan → Lumphini Park ~1,6 km (~20 Min) über Ratchadamri Rd – nur bei Lust, +1,6 km in der Nachmittagshitze."},3,{"tr":"🚕 Grab Lumphini → Health Land Sathorn (~10 Min)."},4,{"seg":"🌆 Abend · Sukhumvit (ab ~18:00)"},{"about":{"t":"Über Sukhumvit & Thonglor","x":"Sukhumvit ist die längste Straße Thailands und in Bangkok das Viertel der Expats, Hotels und Nachtleben. Die nummerierten Seitengassen (Sois) haben jeweils eigenen Charakter: Soi 26 ist ruhig und gehoben, Thonglor (Soi 55) und Ekkamai (Soi 63) sind die Ausgehviertel der jungen, wohlhabenden Thais mit Cocktailbars, Craft-Bier und Restaurants. Über allem fährt der Skytrain, unten staut sich der Verkehr. Für die Altstadt liegt Sukhumvit ungünstig, für einen Abend ist es genau richtig. Rooftop-Bars wie Octave zeigen die Stadt als Lichtermeer bis zum Horizont."}},{"tr":"🚕 Grab Health Land → Sukhumvit Soi 26 (~20–30 Min)."},{"dine":{"top":{"name":"Sorn","why":"Drei Michelin-Sterne (2026) – Südthai-Küche von Chefin Supaksorn Jongsiri, das erste Thai-Restaurant mit drei Sternen. Laut Michelin So–Fr 18–22 Uhr, Sa geschlossen. Menü ~3 h, daher Tisch ~18:00–18:30 wählen. Reservierung extrem knapp – Fenster für Dezember öffnen Mitte/Ende November (siehe Reservierungen).","addr":"56 Soi Sukhumvit 26, Khlong Tan, Khlong Toei","price":"€€€"},"value":{"name":"Khua Kling + Pak Sod","why":"Südthailändische Hausmannskost, scharf und kräuterreich – die bezahlbare Antwort auf Sorn, mitten in Thonglor (Zeiten zu prüfen).","addr":"Soi Thong Lo 5, Khlong Tan Nuea, Watthana","price":"€€"},"insider":{"name":"Jodd Fairs Ratchada (Nachtmarkt)","why":"⚠️ Umweg: liegt nicht in Sukhumvit, sondern an der Ratchadaphisek Rd (~30 Min Grab) – nur bei Lust. Bangkoks bekanntester Nachtmarkt (der alte Standort Rama 9 ist seit Jan. 2025 geschlossen): Essstände, Bars, Krimskrams, täglich ~17–1 Uhr. Laut, touristisch, aber unterhaltsam. MRT Thailand Cultural Centre, Ausgang 4.","addr":"Ratchadaphisek Rd (neben Big C Place), Din Daeng","price":"€"}}},{"note":"💡 Lockere Variante statt Sorn: Khua Kling + Pak Sod in Thonglor – nur dann passt danach auch die Octave-Rooftop-Bar (Option unten)."},5,{"home":"🚕 Grab zurück ins Hotel (~30–40 Min) oder 🚇 MRT Sukhumvit → Hua Lamphong (~15 Min) + kurzer Grab."},6]},{"iso":"2026-12-22","dt":"Di 22.12.","title":"Tagesausflug: Ayutthaya","route":{"walk":false,"mode":"🚗 Fahrer/Grab + 🛺 Tuk-Tuk · Tagesausflug (~80 km)","lead":"Die Königsstadt vor Bangkok: 417 Jahre Hauptstadt Siams, 1767 zerstört, heute UNESCO-Welterbe. Mit Auto ab 10 Uhr: vormittags Wat Mahathat, die heißesten Stunden (12:30–14:30) klimatisiert, ab 14:30 die Palasttempel und zum Sonnenuntergang Wat Chai Watthanaram – zurück zum späten Abendessen in Silom.","wxi":"☀️","wx":"In den Ruinen kaum Schatten – Hut, Sonnencreme, viel Wasser."},"items":[{"nm":"Wat Mahathat (Ayutthaya)","cat":"temple","nt":"Der Buddha-Kopf in den Baumwurzeln – das berühmteste Motiv Ayutthayas.","map":"Wat Mahathat Ayutthaya","src":"c","time":"11:15","must":true,"gem":false,"noroute":false,"ll":[14.35635,100.56853],"addr":"Naresuan Rd, Tha Wasukri, Phra Nakhon Si Ayutthaya","info":{"d":"Erbaut im 14. Jh., 1767 von burmesischen Truppen zerstört; ein Buddha-Kopf wurde über Jahrzehnte von einer Feigenwurzel umwachsen. Eintritt ~50 THB je Tempel oder ~220 THB Kombiticket für 6 Tempel (laut Quellen, zu prüfen).","t":"Beim Foto mit dem Kopf hinknien oder hocken – der eigene Kopf darf nicht höher sein als der Buddha."}},{"nm":"Wat Ratchaburana","cat":"temple","nt":"Gegenüber: gut erhaltener Prang mit Krypta und Wandmalereien.","map":"Wat Ratchaburana Ayutthaya","src":"c","time":"14:30","must":false,"gem":false,"noroute":false,"ll":[14.35874,100.56729],"addr":"Naresuan Rd, Tha Wasukri, Phra Nakhon Si Ayutthaya","info":{"d":"1424 von König Borommarachathirat II. gestiftet; in der Krypta fand man 1957 einen Goldschatz.","t":"Steile Treppe in den Prang."}},{"nm":"Wat Phra Si Sanphet","cat":"temple","nt":"Die drei großen Chedis – ehemaliger Palasttempel der Könige.","map":"Wat Phra Si Sanphet","src":"c","time":"15:15","must":true,"gem":false,"noroute":false,"ll":[14.35591,100.55851],"addr":"Si Sanphet Rd, Pratu Chai, Phra Nakhon Si Ayutthaya","info":{"d":"Der wichtigste Tempel der alten Hauptstadt; die drei Chedis bergen die Asche dreier Könige. Vorbild für den Smaragd-Buddha-Tempel in Bangkok.","t":"Wenig Schatten – Hut und Wasser nicht vergessen."}},{"nm":"Wat Chai Watthanaram","cat":"temple","nt":"Khmer-artige Tempelanlage am Westufer – die eindrucksvollste Silhouette.","map":"Wat Chai Watthanaram","src":"c","time":"16:30","must":true,"gem":false,"noroute":false,"ll":[14.34298,100.54183],"addr":"Ban Pom, Phra Nakhon Si Ayutthaya","info":{"d":"1630 von König Prasat Thong nach dem Vorbild von Angkor errichtet; der zentrale Prang ist von acht Kapellen umgeben.","t":"Bis zum Sonnenuntergang (~17:50, Richtwert) bleiben; Schließzeit der Anlage zu prüfen – notfalls das Abendlicht vom Ufer davor. Rückfahrt ~18:00 direkt nach Silom."}},{"nm":"Bahnhof Ayutthaya (Alternative Zug)","cat":"sight","nt":"Wer Zug statt Auto fährt: Ankunft hier, Fähre (~5 THB) über den Fluss zur Altstadt.","map":"Ayutthaya Railway Station","src":"c","must":false,"gem":false,"noroute":true,"ll":[14.35671,100.58295],"addr":"Pratu Chai, Phra Nakhon Si Ayutthaya","info":{"d":"Expresszüge ab Krung Thep Aphiwat (Bang Sue) brauchen ~45–80 Min; langsame Züge ab Hua Lamphong ~2 h. Ein neuer klimatisierter Pendlerzug (SRT Bangkok Connex) sollte ab 1.8.2026 fahren – Fahrplan zu prüfen.","t":"Mit Zug vor Ort Tuk-Tuk stundenweise mieten (Preis vorher aushandeln)."}}],"flow":[{"seg":"☀️ Vormittag · Fahrt & Wat Mahathat (ab ~10:00)"},{"tr":"🚗 Privatfahrer oder Grab Hotel → Ayutthaya (~80 km, ~1:15–1:45 h; Preis vorab vereinbaren, Hin- und Rückfahrt mit Wartezeit am günstigsten – zu prüfen). Alternative: Zug ab Krung Thep Aphiwat."},{"about":{"t":"Über Ayutthaya","x":"Von 1351 bis 1767 war Ayutthaya Hauptstadt Siams und eine der größten Städte der Welt – europäische Besucher verglichen sie mit Paris und London. Die Stadt liegt auf einer Insel zwischen drei Flüssen; Holländer, Portugiesen, Japaner und Perser hatten eigene Viertel. 1767 eroberten und verbrannten burmesische Truppen die Stadt, die Bevölkerung floh flussabwärts – so entstand Bangkok. Heute stehen die Ruinen der Tempel inmitten einer normalen Provinzstadt. Wer Bangkoks Großen Palast gesehen hat, versteht hier, woher dessen Formen stammen."}},0,{"seg":"🌤️ Mittag · Pause im Kühlen (~12:30–14:30)"},{"about":{"t":"Über die Inselmitte von Ayutthaya","x":"Rund um Wat Mahathat und Wat Ratchaburana liegt das historische Zentrum der Insel – heute eine ruhige Provinzstadt mit Läden, Garküchen und Cafés zwischen den Ruinen. Kulinarisch bekannt ist die Region für Bootsnudeln (Kuay Tiew Ruea): kleine Schalen mit kräftiger, würziger Brühe, die früher direkt von Booten auf den Kanälen verkauft wurden. Die süße Spezialität ist Roti Sai Mai – hauchdünne Zuckerfäden, die man in weiche Pfannkuchen wickelt; man bekommt sie an Ständen in der ganzen Stadt. Zwischen den Ziegelruinen gibt es mittags kaum Schatten, die Steine speichern die Hitze. Deshalb gehören die zwei heißesten Stunden in ein klimatisiertes Lokal oder Café; der Fahrer kennt in der Regel passende Adressen."}},{"note":"💡 Mittagessen und Pause 12:30–14:30 in einem klimatisierten Lokal oder Café nahe Wat Mahathat (Bootsnudeln sind die Spezialität der Region); konkrete Adresse vor Ort/mit dem Fahrer klären – nicht verifiziert."},{"seg":"🌇 Nachmittag · Ratchaburana & Palasttempel (ab ~14:30)"},{"about":{"t":"Über den alten Palastbezirk","x":"Wat Phra Si Sanphet lag innerhalb der Mauern des Königspalasts und war – wie heute Wat Phra Kaew in Bangkok – ein Tempel ohne Mönche, allein für königliche Zeremonien bestimmt. Die drei Chedis in einer Reihe sind das Wahrzeichen Ayutthayas. Vom Palast selbst blieben nur Fundamente: 1767 brannten die burmesischen Truppen die Stadt nieder, später wurden viele Ziegel flussabwärts gebracht und beim Bau des neuen Bangkok verwendet. Wat Ratchaburana gegenüber von Wat Mahathat ist besser erhalten; in seinem Prang führt eine steile Treppe in eine Krypta mit seltenen Wandmalereien. Ab dem mittleren Nachmittag wird das Licht weicher und die Ziegel leuchten rötlich."}},1,{"tr":"🛺 Mit Fahrer oder Tuk-Tuk Wat Ratchaburana → Wat Phra Si Sanphet (~1 km)."},2,{"seg":"🌅 Spätnachmittag · Westufer & Sonnenuntergang (ab ~16:15)"},{"about":{"t":"Über das Westufer von Ayutthaya","x":"Westlich der Insel lagen einst Klöster, Werften und die Viertel der ausländischen Händler. Wat Chai Watthanaram steht direkt am Chao Phraya und wurde nach dem Vorbild Angkors gebaut – ein politisches Statement König Prasat Thongs nach einem Sieg über Kambodscha. Die Anlage wurde nach dem Fall der Stadt geplündert und erst ab 1987 restauriert. Am späten Nachmittag fällt das Licht flach auf die Ziegeltürme und die Reihen kopfloser Buddhas. Mit Tuk-Tuk oder Auto sind es nur wenige Minuten von der Inselmitte."}},{"tr":"🚗 Wat Phra Si Sanphet → Wat Chai Watthanaram (~2 km über den Fluss)."},3,{"warn":"Bahnhof Ayutthaya nur relevant, wenn ihr per Zug kommt – +~2 km zum Inselkern."},4,{"tr":"🚗 Rückfahrt ~18:00 direkt nach Silom (~1:30–2 h im Abendverkehr)."},{"seg":"🌆 Abend · Silom (ab ~20:00–20:30)"},{"about":{"t":"Über Silom","x":"Silom ist Bangkoks Bankenviertel: tagsüber Anzugträger zwischen Hochhäusern, abends Restaurants, Bars und der Patpong-Nachtmarkt. Die Seitengassen der Silom-Straße verbergen einige der besten Restaurants der Stadt, darunter Le Du in der Soi 7. Rund um die BTS-Station Sala Daeng drängen sich Garküchen und Isan-Lokale wie Somtum Der. Nördlich grenzt der Lumphini Park an, an dessen Rand in der Soi Polo das berühmte Brathähnchen brutzelt. Ein guter Ort für ein letztes Abendessen, bevor es auf die Insel geht."}},{"dine":{"top":{"name":"Le Du","why":"Michelin-Stern; Chef Ton (Thitid Tassanakajohn) interpretiert Thai-Küche mit saisonalen Zutaten – 2023 Platz 1 der Asia's 50 Best. Laut Michelin Mo–Sa 18–23 Uhr (Di offen). Tisch ~20:30 wegen der Rückfahrt aus Ayutthaya.","addr":"399/3 Soi Si Lom 7, Silom, Bang Rak","price":"€€€"},"value":{"name":"Somtum Der (Sala Daeng)","why":"Isan-Küche mit Stil: Papayasalat in vielen Varianten, gegrilltes Huhn, Sticky Rice – nahe BTS Sala Daeng (Zeiten zu prüfen).","addr":"5/5 Sala Daeng Rd, Silom, Bang Rak","price":"€"},"insider":{"name":"Polo Fried Chicken (Gai Tod Jay Kee)","why":"Michelin Bib Gourmand: knuspriges Huhn mit Bergen von frittiertem Knoblauch, dazu Som Tam – Institution an der Soi Polo am Lumphini Park (Abendzeiten zu prüfen).","addr":"137/1-3 Soi Sanam Khli (Soi Polo), Lumphini, Pathum Wan","price":"€"}}},{"home":"🚕 Grab zurück ins Hotel (~15–20 Min). Koffer packen – morgen Koh Samui."}]},{"iso":"2026-12-23","dt":"Mi 23.12.","title":"Abreise nach Koh Samui","route":{"walk":false,"mode":"🚕 Transfer · halber Tag","lead":"Nur Check-out und Transfer: PG 135 startet um 12:40 ab Suvarnabhumi, Abfahrt am Hotel ca. 09:30.","wxi":"☀️","wx":"Kein Programm – Frühstück in Ruhe, Koffer am Vorabend packen."},"items":[{"nm":"Royal Orchid Sheraton (Check-out)","cat":"hotel","nt":"Frühstück am Fluss, Check-out, Abfahrt ca. 09:30.","map":"Royal Orchid Sheraton Riverside Hotel Bangkok","src":"v","time":"09:30","must":false,"gem":false,"noroute":false,"ll":[13.72915,100.51345],"addr":"2 Soi Charoen Krung 30, Bang Rak, Bangkok 10500","info":{"d":"Abfahrt ~3 h vor Abflug: ~45–60 Min Fahrt (morgens teils länger) plus Check-in und Sicherheitskontrolle in der Dezember-Hochsaison.","t":"Taxi/Grab am Vorabend über die Rezeption für 09:30 bestellen und die Rechnung schon abends prüfen – dann bleibt das Frühstück entspannt."}},{"nm":"Flughafen Suvarnabhumi (BKK) → Koh Samui","cat":"sight","nt":"Flug PG 135 (Bangkok Airways) nach Koh Samui, Abflug 12:40.","map":"Suvarnabhumi Airport","src":"v","time":"12:40","must":false,"gem":false,"noroute":false,"ll":[13.68188,100.74858],"addr":"Racha Thewa, Bang Phli, Samut Prakan 10540","info":{"d":"Inlandsflug mit Bangkok Airways; Check-in im Inlandsbereich.","t":"Mindestens 2 h vorher am Flughafen sein; Inlandsflug, aber Dezember-Hochsaison."}}],"flow":[{"seg":"☀️ Vormittag · Check-out & Transfer (Abfahrt ~09:30)"},{"about":{"t":"Über den Flughafen Suvarnabhumi","x":"Suvarnabhumi – gesprochen etwa ‚Su-wan-na-pum‘ – bedeutet ‚Goldenes Land‘; den Namen wählte König Bhumibol. Der Flughafen wurde 2006 eröffnet und löste Don Mueang als Hauptflughafen Bangkoks ab. Er liegt rund 30 km östlich der Stadt und ist über eine mautpflichtige Schnellstraße angebunden; morgens kann der Berufsverkehr die Fahrt verlängern. Die Flüge nach Koh Samui starten hier, nicht in Don Mueang – überwiegend mit Bangkok Airways, die auch den Flughafen auf Samui betreibt. Auch für Inlandsflüge sind die Schlangen an Check-in und Sicherheitskontrolle in der Dezember-Hochsaison lang."}},{"warn":"⏰ Ausnahme von der 10-Uhr-Regel: Abfahrt ~09:30, weil PG 135 um 12:40 startet (Fahrt ~45–60 Min + Check-in/Sicherheit in der Hochsaison)."},0,{"tr":"🚕 Taxameter-Taxi oder Grab zum Flughafen BKK (~45–60 Min, ~400–500 THB inkl. Maut; im Berufsverkehr länger)."},1]}]},{"name":"Koh Samui · Bangrak","sub":"Mi 23.12.–So 27.12.2026 · 4 Nächte · Chi Samui Resort","hotel":"Gebucht: Chi Samui Resort im ruhigen Bangrak (Big-Buddha-Bucht), 5 Fahrminuten vom Flughafen und von Fisherman's Village – ideal zum Ankommen über Weihnachten.","transit":{"city":"(Mietwagen / Grab)","txt":"Kein Nahverkehr im eigentlichen Sinn. Empfehlung: Mietwagen ab Flughafen USM für alle 16 Tage (Avis-Schalter am Flughafen, tgl. 8–19 Uhr laut Avis; Sixt, Budget, Hertz ebenfalls gelistet). Alternativ Grab/Bolt-App (Grab-Preise auf Samui etwa auf Taxi-Niveau, Flughafen–Chaweng ~300–500 THB, zu prüfen) oder Songthaew (Sammeltaxi, Preis vorher klären). Roller nur mit Motorrad-Führerschein + internationalem Führerschein – sonst kein Versicherungsschutz.","url":"https://www.avis.com/en/locations/as/th/samui-island/usm"},"sunset":[{"nm":"Big Buddha (Wat Phra Yai)","d":"Goldener Buddha auf der Halbinsel, Abendlicht über der Bucht; 10 Min vom Resort","q":"Big Buddha Koh Samui"},{"nm":"Bophut Beach / Fisherman's Village","d":"Nordküste, Blick auf Koh Phangan; Strandbars mit Sitzsäcken","q":"Bophut Beach Fisherman's Village"},{"nm":"Nikki Beach (Lipa Noi, Westküste)","d":"Echter Sonnenuntergang über dem Meer – weit (~35 Min), nur mit Reservierung","q":"Nikki Beach Koh Samui"}],"photo":[{"nm":"Wat Plai Laem","d":"18-armige Guanyin-Statue auf einem Teich – am besten am späten Nachmittag","q":"Wat Plai Laem Koh Samui"},{"nm":"Fisherman's Village Holzhäuser","d":"Alte chinesische Händlerhäuser an der Bophut-Hauptgasse","q":"Fisherman's Village Bophut"}],"breakfast":[{"nm":"La Fabrique (French Bakery) Bangrak","d":"Französische Bäckerei ~600 m vom Resort (OSM-Eintrag; Öffnungszeiten zu prüfen)","q":"La Fabrique Bangrak Koh Samui"},{"nm":"La Banette, Fisherman's Village","d":"Café/Bäckerei in der Hauptgasse von Bophut (zu prüfen)","q":"La Banette Fisherman's Village"}],"hike":[],"shopping":[{"nm":"Fisherman's Village Walking Street (Fr)","d":"Kunsthandwerk, Kleidung, Streetfood – Fr ab ~17 Uhr","q":"Fisherman's Village Walking Street Bophut","u":""},{"nm":"The Wharf Samui (Bophut)","d":"Kleine Shoppingmeile am Westende von Fisherman's Village","q":"The Wharf Samui","u":""}],"booking":{"hotel":"Chi Samui Resort","addr":"11/85 Moo 4, Soi Kalara, Bangrak (Bophut), Ko Samui, Surat Thani 84320","inn":"2026-12-23","out":"2026-12-27","nights":4,"q":"Chi Samui Resort Bangrak","note":"Kleines Suite-Resort (u. a. 2-Zimmer-Penthouse, Garden-Suiten mit Pool-Zugang), Innenhof-Pool, Restaurant „Alchemy“ (7–23 Uhr), Spa, eigene Strandbar am Bangrak-Strand per Shuttle. Strand ~10 Gehminuten, Fisherman's Village ~5 Fahrminuten (Angaben Resort-Website). Küche in den Suiten: auf der Website nicht genannt – zu prüfen. Lage ~1,4 km westlich der Flughafenpiste: Fluglärm möglich – zu prüfen. Check-in ab 14:00 bzw. 15:00, Check-out bis 12:00 (laut Buchungsportalen lastminute/Flytap; Resort-Website nennt keine Zeiten – beim Resort bestätigen, bei Ankunft 23.12. ~14:15 ggf. Early Check-in anfragen). Tel. +66 77 484 897, rsvn@chisamuiresort.com.","url":"https://chisamuiresort.com/","markets":[{"nm":"Lotus's go fresh Bangrak (kleiner Supermarkt)","d":"~650 m Luftlinie · ~11 Min zu Fuß","q":"Lotus's go fresh Bangrak Koh Samui"},{"nm":"Big C (Mall, Ringstraße Bophut)","d":"~1,3 km Luftlinie · ~4 Min Auto","q":"Big C Samui Bophut"},{"nm":"Makro Samui (Großmarkt, Bophut)","d":"~1,7 km Luftlinie · ~5 Min Auto","q":"Makro Koh Samui Bophut"},{"nm":"Tops Market im Central Samui (Chaweng, Import-Sortiment)","d":"~2,8 km Luftlinie · ~8 Min Auto","q":"Tops Central Samui Chaweng"},{"nm":"Bangrak Minimart (Notkauf)","d":"~1,0 km Luftlinie · ~3 Min Auto","q":"Bangrak Minimart Koh Samui"}]},"days":[{"iso":"2026-12-23","dt":"Mi 23.12.","title":"Ankommen in Bangrak","route":{"walk":false,"drive":true,"mode":"🚗 Mietwagen kurz + zu Fuß · halber Tag","lead":"Landung um 13:45 (PG 135 aus Bangkok), Mietwagen übernehmen, 5 Minuten bis zum Resort. Danach nur noch Pool, ein kleiner Einkauf und der erste Abend am Wasser – das Auto bleibt am Abend stehen, alles ist zu Fuß erreichbar.","wxi":"🌦️","wx":"Ende der Regenzeit: kurze Schauer möglich, meist rasch vorbei."},"items":[{"nm":"Flughafen Samui (USM)","cat":"sight","nt":"Ankunft PG 135 um 13:45 aus Bangkok; Mietwagen am Avis-Schalter übernehmen","map":"Samui International Airport","src":"v","ll":[9.54881,100.06259],"addr":"Samui International Airport, Bophut","time":"13:45","info":{"d":"Privatflughafen von Bangkok Airways mit offenen Terminal-Pavillons. Mietwagenschalter im Ankunftsbereich.","t":"Avis-Schalter laut Avis tgl. 8–19 Uhr – Ankunft 13:45 passt problemlos."}},{"nm":"Chi Samui Resort","cat":"hotel","nt":"Check-in (~14:15), ~5 Min Fahrt vom Flughafen","map":"Chi Samui Resort","src":"v","ll":[9.5522,100.0499],"addr":"11/85 Moo 4, Soi Kalara, Bangrak","url":"https://chisamuiresort.com/","time":"14:15","must":true,"info":{"d":"Kleines Suite-Resort mit Innenhof-Pool, Restaurant Alchemy und Spa.","t":"Check-in laut Buchungsportalen ab 14:00/15:00 – bei Ankunft ~14:15 Early Check-in vorab per Mail anfragen."}},{"nm":"Lotus's go fresh Bangrak","cat":"market","nt":"Erster Einkauf: Wasser, Obst, Snacks, Bier","map":"Lotus's go fresh Bangrak","src":"v","ll":[9.55667,100.05366],"addr":"Bangrak, Bophut","info":{"d":"Kleiner Supermarkt der Lotus's-Kette an der Bangrak-Straße – für Grundversorgung reicht er.","t":"Bier/Wein nur 11–14 und 17–24 Uhr – also nach 17 Uhr einkaufen."}},{"nm":"Bangrak Beach","cat":"beach","nt":"Erster Strandspaziergang zum Abend","map":"Bangrak Beach Koh Samui","src":"v","ll":[9.5572,100.0506],"addr":"Bangrak, nördlich des Resorts","info":{"d":"Schmaler, ruhiger Strand mit Blick auf Big Buddha und Koh Phangan; Bootsanleger nebenan – eher zum Schauen als zum Baden.","t":"Zur blauen Stunde (~18:00–18:30) kommen, dann leuchtet der Big Buddha gegenüber."}}],"flow":[{"seg":"✈️ Ankunft · Flughafen → Resort"},{"about":{"t":"Über Bangrak","x":"Bangrak liegt an der Nordostspitze von Samui zwischen Flughafen und Big-Buddha-Halbinsel. Der Ortsteil ist ruhig und wenig touristisch, mit kleinen Thai-Lokalen, Bootsanlegern nach Koh Phangan und einem Fischmarkt. Der Strand ist schmal und eher zum Spazieren als zum Baden. Dafür sind Fisherman's Village (Bophut) und Choeng Mon jeweils nur wenige Fahrminuten entfernt – ein guter, unaufgeregter Startpunkt über Weihnachten."}},0,{"tr":"🚗 Mietwagen ~2 km zum Resort (~5 Min)"},1,{"note":"💡 Nachmittag: ankommen, Pool, Siesta."},{"seg":"🌆 Abend · Bangrak zu Fuß (ab ~17:30)"},{"about":{"t":"Bangrak am Abend","x":"Abends zeigt Bangrak seine lokale Seite: An der Strandstraße, rund zehn Gehminuten vom Resort, reihen sich kleine Thai-Lokale, ein paar Bars und Minimärkte, dazwischen italienische und französische Häuser von Auswanderern. Vom schmalen Strand aus sieht man den beleuchteten Big Buddha auf der Halbinsel gegenüber und die Lichter von Koh Phangan. Touristischer Trubel fehlt – genau richtig für den ersten Abend nach der langen Anreise. Alles Folgende liegt in 5–15 Gehminuten; das Auto bleibt stehen."}},2,3,{"dine":{"top":{"name":"Antica Locanda","why":"Italienisches Restaurant an der Bangrak-Strandstraße, ~700 m vom Resort (OSM-Eintrag mit Website, Di–So geöffnet laut OSM – mittwochs also offen; zu prüfen). Pasta und Pizza als sanfter Einstieg nach dem Langstreckenflug.","addr":"Bangrak Beach Road, Bophut","price":"€€"},"value":{"name":"Kru Ouan (ร้านครูอ้วน)","why":"Einfaches Thai-Lokal in Bangrak, ~500 m vom Resort (OSM-Eintrag) – Qualität zu prüfen.","addr":"Bangrak, Bophut","price":"€"},"insider":{"name":"Alchemy (Resort-Restaurant)","why":"Nach der Anreise die bequemste Option: Restaurant im Resort, tgl. 7–23 Uhr.","addr":"Chi Samui Resort","price":"€€"}}},{"note":"💡 Krua Bophut (Fisherman's Village) bewusst nicht heute: ~2,5 km, nur mit Auto – kommt am 07.01. mittags dran."},{"home":"Zu Fuß zurück ins Resort (alle drei Lokale in Laufweite)."}]},{"iso":"2026-12-24","dt":"Do 24.12.","title":"Heiligabend: Big Buddha & Weihnachtsdinner","route":{"walk":false,"drive":true,"mode":"🚗 Mietwagen · später Nachmittag","lead":"Bis zum Nachmittag Pool und Ruhe. Gegen 16 Uhr die zwei Tempel der Halbinsel (beide 5–10 Fahrminuten), dann Sonnenuntergang am Big Buddha und das Weihnachtsdinner.","wxi":"🌤️","wx":"Ab etwa dem 20.12. werden trockene Tage die Regel – Garantie gibt es nicht."},"items":[{"nm":"Wat Plai Laem","cat":"temple","nt":"Tempelanlage am See mit 18-armiger Guanyin-Statue und dickbäuchigem Buddha","map":"Wat Plai Laem","src":"v","ll":[9.57153,100.06712],"addr":"Plai Laem, Bophut (Ostspitze Bangrak)","time":"16:00","must":true,"info":{"d":"Moderne, sehr farbenfrohe Anlage auf einem künstlichen See – eine Mischung aus thailändischem und chinesischem Buddhismus.","t":"Schultern/Knie bedecken; Fische füttern ist Ritual."}},{"nm":"Big Buddha (Wat Phra Yai)","cat":"temple","nt":"12 m hoher goldener Buddha auf einer Mini-Insel mit Damm","map":"Big Buddha Koh Samui","src":"v","ll":[9.57083,100.0598],"addr":"Big Buddha Beach, Bangrak","time":"17:00","must":true,"info":{"d":"Wahrzeichen der Insel (1972). Treppe hinauf zum Sockel; im Abendlicht leuchtet die Figur.","t":"Schuhe ausziehen auf der Plattform; Sonnenuntergang Ende Dezember ~18:00."}},{"nm":"Fischmarkt Bangrak","cat":"market","nt":"Kleiner Fischmarkt am Anleger – nur Gucken","map":"Bangrak fish market Koh Samui","src":"c","ll":[9.565,100.06219],"addr":"Bangrak Pier","noroute":true,"info":{"d":"Lokaler Markt am Bootsanleger (OSM-Eintrag); Öffnungszeiten zu prüfen.","t":"Nur als Abstecher, wenn ihr ohnehin am Anleger vorbeikommt – Fischmärkte sind morgens am lebendigsten."}}],"flow":[{"seg":"☀️ Tag · Resort (bis ~15:30)"},{"about":{"t":"Heiligabend-Tag im Resort","x":"Der Tag beginnt ohne Programm: Frühstück im Alchemy, danach Pool im Innenhof. Für den Nachmittag lohnt eine Massage im Panu Natural Spa des Resorts – am Feiertag rechtzeitig buchen. Zum Bangrak-Strand sind es rund zehn Gehminuten oder eine kurze Shuttle-Fahrt zur Strandbar des Resorts. Gegen 15:30 umziehen: Für die Tempel am Nachmittag braucht ihr bedeckte Schultern und Knie."}},{"note":"💡 Pool, Spa (Panu Natural Spa im Resort – Termin am Vortag buchen), Siesta."},{"seg":"🌇 Nachmittag · Big-Buddha-Halbinsel (ab ~16:00)"},{"about":{"t":"Über die Big-Buddha-Halbinsel","x":"Die kleine Halbinsel Plai Laem im Nordosten ist das religiöse Postkartenmotiv Samuis. Der goldene Big Buddha von 1972 thront auf einem Felsen, der über einen Damm erreichbar ist; am Fuß gibt es Souvenirstände und einfache Lokale. Nur 1 km östlich liegt Wat Plai Laem, eine neuere, sehr farbenfrohe Anlage mit chinesischen Einflüssen auf einem See. Beide Tempel sind aktive Gotteshäuser – bedeckte Schultern und Knie sind Pflicht. Am späten Nachmittag ist es kühler und das Licht am schönsten."}},{"tr":"🚗 Resort → Wat Plai Laem ~3 km (~8 Min)"},0,{"tr":"🚗 ~1 km weiter zum Big Buddha (oder 15 Min zu Fuß)"},1,2,{"seg":"🎄 Abend · Weihnachtsdinner (ab ~19:00)"},{"about":{"t":"Weihnachten auf Samui","x":"Thailand ist überwiegend buddhistisch, Weihnachten ist kein Feiertag – Geschäfte und Märkte haben normal geöffnet. In den Touristenorten wird das Fest trotzdem gefeiert: Resorts schmücken Lobbys, fast jedes bessere Restaurant bietet am 24. und 25. Dezember ein Weihnachtsmenü an, oft mit Live-Musik. Eine stille, besinnliche Nacht wie zu Hause ist es nicht, eher ein festliches Abendessen in tropischer Abendwärme unter Palmen. Die Nachfrage ist hoch, die schönen Tische sind früh weg. Wer es ruhig mag, wählt ein kleines Haus oder bleibt im Resort."}},{"note":"💡 In Thailand laufen die Weihnachtsmenüs am 24. und 25. abends; fast jedes Restaurant bietet eins an – reservieren!"},{"note":"🚕 Wer fährt? Bei Wein zum Dinner: Grab hin und zurück (Resort ↔ Anantara Lawana ~5–7 km, ~15 Min) – das Auto bleibt am Resort."},{"dine":{"top":{"name":"Tree Tops Dining (Anantara Lawana, Chaweng)","why":"Dinner in Baumhaus-Plattformen über dem Garten – das romantischste Weihnachtsdinner in Reichweite (~5–7 km Fahrt, ~15 Min). Weihnachtsmenü und Preis zu prüfen, unbedingt reservieren.","addr":"Anantara Lawana Resort, Chaweng Nord","price":"€€€"},"value":{"name":"Alchemy im Chi Samui Resort","why":"Kein Fahren nach dem Wein: Weihnachtsprogramm des Resorts erfragen (rsvn@chisamuiresort.com).","addr":"Chi Samui Resort","price":"€€"},"insider":{"name":"Krua Bophut","why":"Kein „Weihnachtsmenü“, sondern echtes Südthai-Seafood mit den Füßen im Sand – die entspannte Alternative. (Sonst ohnehin am 07.01. mittags eingeplant.)","addr":"Fisherman's Village, Bophut","price":"€€"}}},{"warn":"Full Moon Party auf Koh Phangan am 24.12. (Haad Rin): Boote ab Bangrak sind dann überfüllt – nicht euer Abend."},{"home":"Fahrer bestimmen oder Grab nehmen – Alkoholkontrollen und nächtliche Straßen auf Samui sind kein Spaß."}]},{"iso":"2026-12-25","dt":"Fr 25.12.","title":"1. Weihnachtstag: Fisherman's Village (Walking Street)","route":{"walk":true,"drive":true,"mode":"🚗 kurze Fahrt + 🚶 Bummeln · Abend","lead":"Tagsüber nichts. Am Abend die Freitags-Walking-Street in Fisherman's Village – der schönste der Samui-Nachtmärkte, 2,5 km vom Resort.","wxi":"🌤️"},"items":[{"nm":"Wat Bo Phut","cat":"temple","nt":"Kleiner Ortstempel am Eingang von Fisherman's Village","map":"Wat Bo Phut","src":"v","ll":[9.55586,100.03233],"addr":"Bophut","time":"17:00","info":{"d":"Ruhiger Dorftempel – ein kurzer Stopp vor dem Trubel.","t":"Schultern/Knie bedecken – ein Tuch für den Marktabend einpacken."}},{"nm":"Fisherman's Village Walking Street","cat":"market","nt":"Freitags-Nachtmarkt: Streetfood, Kunsthandwerk, Live-Musik","map":"Fisherman's Village Walking Street","src":"v","ll":[9.55898,100.03151],"addr":"Thanon Bo Phut, Fisherman's Village","time":"17:30","must":true,"info":{"d":"Jeden Freitag ~17–23 Uhr ist die Hauptgasse für Autos gesperrt. Streetfood 50–120 THB pro Gericht.","t":"Parken früh (vor 17 Uhr) oder Grab nehmen – Parkplätze sind knapp."}},{"nm":"Bophut Beach","cat":"beach","nt":"Strand am Dorf, Blick auf Koh Phangan","map":"Bophut Beach","src":"v","ll":[9.56469,100.02918],"addr":"Bophut Beach","info":{"d":"Ruhiger, flacher Strand – nach dem Markt Füße ins Wasser.","t":"Der Zugang liegt zwischen den Restaurants der Hauptgasse – einfach durch eines der Strandlokale gehen."}}],"flow":[{"seg":"☀️ Tag · Resort"},{"about":{"t":"Ein Tag im Chi Samui Resort","x":"Der erste Weihnachtstag gehört dem Resort. Chi Samui ist ein kleines Suite-Resort mit Innenhof-Pool, dem Restaurant Alchemy (tgl. 7–23 Uhr) und dem Panu Natural Spa mit Massagen sowie Sauna und Dampfbad. Zum Bangrak-Strand bringt euch der Resort-Shuttle an die eigene Strandbar, zu Fuß sind es rund zehn Minuten. Mittags ist die Sonne am stärksten – dann Pool im Schatten oder eine Massage. Wer sich bewegen will, spaziert am späten Nachmittag am Strand Richtung Big Buddha. Abends geht es dann zum Nachtmarkt nach Bophut."}},{"note":"💡 Ausschlafen, Pool, Weihnachtsruhe."},{"seg":"🌆 Abend · Fisherman's Village (ab ~17:00)"},{"about":{"t":"Über Fisherman's Village","x":"Bophuts altes Fischerdorf ist der charmanteste Ortskern der Insel: eine lange Gasse mit chinesischen Holzhäusern aus der Zeit, als hier Kokosnüsse verschifft wurden. Heute sind darin Boutiquen, Bars und Restaurants, viele mit Tischen am Strand. Jeden Freitagabend wird die Gasse zur Walking Street mit Kunsthandwerk, Kleidung und Streetfood. Gegen 19–21 Uhr ist es am vollsten. Das Dorf ist eher gehoben-entspannt als laut – kein Vergleich zu Chaweng."}},{"tr":"🚗 Resort → Bophut ~2,5 km (~7 Min) · alternativ Grab"},{"note":"🚕 Wer fährt? Parkplätze sind freitags knapp, Bier gehört zum Markt: Grab hin und zurück (~7 Min) ist die entspanntere Wahl."},0,1,2,{"dine":{"top":{"name":"Happy Elephant","why":"Alteingesessenes Thai-Lokal in der Hauptgasse (seit 1995) mit Seafood-Auslage zum Aussuchen. Preise/Öffnung zu prüfen. Alternative ein paar Häuser weiter östlich: The Hut (Seafood nach Gewicht).","addr":"Fisherman's Village, Thanon Bo Phut","price":"€€"},"value":{"name":"Streetfood der Walking Street","why":"Moo Ping, Papaya-Salat, Pad Kra Pao – satt werden für unter 200 THB.","addr":"Thanon Bo Phut","price":"€"},"insider":{"name":"Coco Tam's + „Easy on Tam's“","why":"Strandbar mit Sitzsäcken, Holzofen-Pizza und Feuershow ab ~21 Uhr; oben die versteckte Speakeasy-Bar „Easy on Tam's“.","addr":"Bophut Beach, Fisherman's Village","price":"€€"}}},{"home":"Mit Grab zurück nach Bangrak ~7 Min."}]},{"iso":"2026-12-26","dt":"Sa 26.12.","title":"Strand-/Freier Tag","route":{"walk":false,"drive":false,"mode":"🏖️ Strand-/freier Tag","lead":"Kein Programm – letzter ganzer Tag in Bangrak."},"items":[],"flow":[{"seg":"☀️ Vormittag · Vorschlag"},{"about":{"t":"Choeng Mon am Vormittag","x":"Choeng Mon liegt an der Nordostspitze, rund 15 Fahrminuten vom Resort. Die halbmondförmige Bucht ist durch kleine vorgelagerte Inseln geschützt, das Wasser ist bei ruhiger See klar und flach. Am Strand reihen sich gehobene Resorts, dazwischen gibt es einfache Liegen und Strandlokale. Vormittags ist es am ruhigsten, gegen Mittag zurück in den Schatten."}},{"note":"🏖️ Choeng Mon Beach (~15 Min Fahrt): geschützte Bucht im Nordosten mit klarem Wasser und kleinen Inseln vor dem Strand, ideal bei ruhiger See. Bei Wind oder Rotflagge lieber Resort-Pool und eine Massage im Panu Natural Spa."},{"seg":"🌙 Abend · Vorschlag"},{"about":{"t":"Letzter Abend in Bangrak","x":"Der letzte Abend in Bangrak bleibt bewusst nah am Resort. Rund um die Soi Kalara liegen mehrere Restaurants in Laufweite, vom französischen Steakhaus bis zum einfachen Thai-Lokal. Das Auto bleibt stehen, ein Glas Wein ist kein Problem. Danach Koffer packen – morgen um 11 Uhr geht es nach Lamai."}},{"note":"🍷 La Côte de Bœuf: französisches Steakhaus ~200 m vom Resort (OSM-Eintrag mit Website, laut OSM Do–Di 16–22:30 – samstags offen; zu prüfen). Zu Fuß hin, Wein ohne Fahrsorgen; abends die Koffer für den Umzug packen."}]}],"badge":"3","verdict":"<b>4 Nächte passen</b> als Ankommen + Weihnachten an der Nordküste (Big Buddha, Fisherman's Village mit Walking Street am 25.12.). Gut: Der Umzug am 27.12. trennt die Weihnachts- von der Silvesterzeit. Achtung Wetter: Ende der Regenzeit – Bootstouren erst ab der Villa-Zeit eingeplant."},{"name":"Koh Samui · Lamai","sub":"So 27.12.2026–Fr 08.01.2027 · 12 Nächte · Villa Clarisse","hotel":"Gebucht: Villa Clarisse am Hang westlich von Lamai – private Villa mit Infinity-Pool und Küche; Lamai-Zentrum 1,5 km, Strand ~2,4 km (Auto nötig).","transit":{"city":"(Mietwagen / Grab)","txt":"Kein Nahverkehr im eigentlichen Sinn. Empfehlung: Mietwagen ab Flughafen USM für alle 16 Tage (Avis-Schalter am Flughafen, tgl. 8–19 Uhr laut Avis; Sixt, Budget, Hertz ebenfalls gelistet). Alternativ Grab/Bolt-App (Grab-Preise auf Samui etwa auf Taxi-Niveau, Flughafen–Chaweng ~300–500 THB, zu prüfen) oder Songthaew (Sammeltaxi, Preis vorher klären). Roller nur mit Motorrad-Führerschein + internationalem Führerschein – sonst kein Versicherungsschutz.","url":"https://www.avis.com/en/locations/as/th/samui-island/usm"},"sunset":[{"nm":"Villa-Terrasse","d":"Meer-/Bergblick – Lamai blickt nach Osten, also eher Abendlicht als Sonnenuntergang","q":"Lamai Koh Samui"},{"nm":"Lamai Viewpoint","d":"Aussichtspunkt am Hang über Südlamai (Eintritt zu prüfen)","q":"Lamai Viewpoint Koh Samui"},{"nm":"Thong Krut / Laem Sor (Südküste)","d":"Blick auf Koh Tan und Koh Madsum","q":"Laem Sor Pagoda Koh Samui"}],"photo":[{"nm":"Hin Ta & Hin Yai","d":"Die „Großvater- und Großmutter-Felsen“ am Südende von Lamai","q":"Hin Ta Hin Yai"},{"nm":"Lad Koh Viewpoint","d":"Straßen-Aussichtspunkt zwischen Lamai und Chaweng","q":"Lad Koh Viewpoint"}],"breakfast":[{"nm":"La Fabrique French Bakery Lamai","d":"Französische Bäckerei ~800 m von der Villa (OSM; Zeiten zu prüfen)","q":"La Fabrique Lamai"},{"nm":"Lamai Fresh Food Market","d":"Frühmorgens Obst, Kuchen, Kaffee – lokal und günstig","q":"Lamai Fresh Market"}],"hike":[{"nm":"Lamai Viewpoint / Overlap Stone","d":"Kurze, steile Wege am Hang südwestlich von Lamai – nur früh am Tag (zu prüfen)","q":"Overlap Stone Koh Samui"}],"shopping":[{"nm":"Lamai Walking Street (So)","d":"Sonntags-Nachtmarkt","q":"Lamai Walking Street","u":""},{"nm":"Maenam Walking Street (Do)","d":"Donnerstags-Nachtmarkt an der Nordküste","q":"Maenam Walking Street","u":""}],"booking":{"hotel":"Villa Clarisse – Seaview, 4 Bedrooms","addr":"Thanon Had Lamai, Lamai (Tambon Maret), Ko Samui 84310 – genaue Zufahrt beim Gastgeber erfragen","inn":"2026-12-27","out":"2027-01-08","nights":12,"q":"Villa Clarisse Lamai Koh Samui","note":"Private Ferienvilla (Booking.com „Villa Clarisse 4 chambres“, Expedia/Vrbo „Villa Clarisse – SEAVIEW – 4 BDR for 10 people“): 4 Schlafzimmer, 3 (lt. Vrbo 4,5–5) Bäder, voll ausgestattete Küche, Waschmaschine, Infinity-Pool, Terrasse, Garten, Grill, Parkplatz, WLAN, Gastgeber spricht Englisch/Französisch; Bewertung 9,8/10. Lage laut Booking-Geodaten 9.4736 N / 100.0352 E am Hang westlich von Lamai; ~2,4 km zum Lamai Beach, ~14 km / ~30–35 Min zum Flughafen, ~13 km / ~30 Min nach Bophut/Fisherman's Village. Kein Strandzugang zu Fuß – Mietwagen einplanen. Einkaufen: Supermärkte (Tops, Lotus's, Makro) nur per Auto; nächste Läden zu Fuß sind ein FamilyMart (~710 m Luftlinie) und ein 7-Eleven (~870 m, laut OSM 24 Std.) unten Richtung Lamai-Zentrum – ~12–15 Min, zurück bergauf; ob die Zufahrt einen Fußweg erlaubt, beim Gastgeber erfragen.","url":"https://www.booking.com/hotel/th/villa-clarisse-4-chambres.html","markets":[{"nm":"FamilyMart (Minimarkt, nächster Laden zu Fuß)","d":"~710 m Luftlinie · ~12 Min zu Fuß · Hangstraße, Rückweg bergauf","q":"FamilyMart Lamai Koh Samui"},{"nm":"7-Eleven (24 Std. laut OSM)","d":"~870 m Luftlinie · ~15 Min zu Fuß · Hangstraße, Rückweg bergauf","q":"7-Eleven Lamai Koh Samui"},{"nm":"Lotus's Lamai","d":"~1,1 km Luftlinie · ~3 Min Auto","q":"Lotus's Lamai Koh Samui"},{"nm":"Tops Market Lamai","d":"~1,5 km Luftlinie · ~4 Min Auto","q":"Tops Lamai Koh Samui"},{"nm":"Makro Lamai (Großmarkt, Ringstraße Richtung Hua Thanon)","d":"~1,8 km Luftlinie · ~5 Min Auto","q":"Makro Lamai Koh Samui"},{"nm":"Lamai Fresh Food Market (Frischmarkt)","d":"~1,3 km Luftlinie · ~4 Min Auto","q":"Lamai Fresh Market Koh Samui"},{"nm":"Fromagerie (französischer Käseladen, Lamai Nord)","d":"~3,3 km Luftlinie · ~10 Min Auto","q":"Fromagerie Lamai Koh Samui"}]},"days":[{"iso":"2026-12-27","dt":"So 27.12.","title":"Umzug nach Lamai + Sonntagsmarkt","route":{"walk":false,"drive":true,"mode":"🚗 Mietwagen · Umzug","lead":"Check-out in Bangrak um 11 Uhr, in Bophut nur Trockenware für die Villa, Mittag im Food Court, ein Badestopp an der Coral Cove und um 15 Uhr Check-in in Lamai. Frisches und Getränke kauft ihr erst danach in Lamai – Bier und Wein ab 17 Uhr. Am Abend gleich der Sonntagsmarkt – 5 Min von der Villa.","wxi":"🌤️"},"items":[{"nm":"Chi Samui Resort","cat":"hotel","nt":"Check-out (bis 12:00 laut Buchungsportalen – beim Resort bestätigen)","map":"Chi Samui Resort","src":"v","ll":[9.5522,100.0499],"addr":"11/85 Moo 4, Soi Kalara, Bangrak","time":"11:00","info":{"d":"Check-out-Zeit laut lastminute und Flytap 12:00; die Resort-Website nennt keine Zeit.","t":"Um 11 Uhr auschecken – dann bleibt genug Luft bis zum Villa-Check-in um 15 Uhr."}},{"nm":"Makro Samui (Bophut)","cat":"market","nt":"Vorrat für die Villa: NUR Trockenware (Reis, Nudeln, Gewürze, Kaffee, Haushalt)","map":"Makro Koh Samui Bophut","src":"v","ll":[9.5389,100.04158],"addr":"Ringstraße 4169, Bophut","time":"11:15","info":{"d":"Großmarkt mit großen Packungen – gut für 12 Tage Villa mit Küche. Big C liegt 800 m weiter nördlich an derselben Straße.","t":"Keine Frischware und keine Getränke hier: Bis zum Check-in liegt der Einkauf 3,5 Std im heißen Kofferraum. Obst, Fleisch, Fisch, Milch, Wasser, Bier und Wein erst in Lamai."}},{"nm":"Big C Bophut","cat":"market","nt":"Ergänzung: Drogerie, Haushalt, Food Court fürs Mittagessen","map":"Big C Samui Bophut","src":"v","ll":[9.54571,100.04043],"addr":"Ringstraße 4169, Bophut","noroute":true,"info":{"d":"Hypermarkt mit Food Court an derselben Ringstraße, 800 m nördlich von Makro.","t":"Auch hier keine Frischware für die Villa kaufen – erst in Lamai."}},{"nm":"Coral Cove","cat":"beach","nt":"Kurzer Bade-/Aussichtsstopp auf dem Weg nach Lamai","map":"Coral Cove Koh Samui","src":"v","ll":[9.49056,100.06177],"addr":"Ringstraße 4169 zwischen Chaweng und Lamai","time":"14:00","info":{"d":"Kleine Felsbucht an der Küstenstraße zwischen Chaweng Noi und Lamai – ein Sprung ins Wasser oder nur der Blick, während die Zeit bis zum Check-in verstreicht.","t":"Auto im Schatten parken; im Kofferraum liegt nur Trockenware – das verträgt die Hitze. Bei Rotflagge nur schauen."}},{"nm":"Villa Clarisse","cat":"hotel","nt":"Check-in, Villa mit Infinity-Pool über Lamai","map":"Villa Clarisse Lamai Koh Samui","src":"v","ll":[9.4736,100.0352],"addr":"Thanon Had Lamai, Lamai (Maret), Ko Samui 84310","time":"15:00","must":true,"info":{"d":"Private Villa, 4 Schlafzimmer, voll ausgestattete Küche, Infinity-Pool, Meer-/Bergblick.","t":"Check-in-Zeit und Schlüsselübergabe vorab mit dem Gastgeber klären."}},{"nm":"Tops Market Lamai","cat":"market","nt":"Einkauf nach dem Check-in: Frisches und alle Getränke (Wasser, Bier, Wein)","map":"Tops Lamai Koh Samui","src":"v","ll":[9.46829,100.04755],"addr":"Lamai Zentrum, Ringstraße 4169","time":"16:45","info":{"d":"Supermarkt im Lamai-Zentrum, laut OSM rund um die Uhr geöffnet; ~5 Min von der Villa.","t":"Alkoholverkauf nur 11–14 und 17–24 Uhr: erst Frisches und Wasser einsammeln, Bier/Wein ab 17:00 an die Kasse. Alternative mit Großpackungen: Makro Lamai an der Ringstraße Richtung Hua Thanon."}},{"nm":"Lamai Walking Street (So)","cat":"market","nt":"Sonntags-Nachtmarkt an der Lamai Beach Road","map":"Lamai Walking Street","src":"v","ll":[9.46895,100.04819],"addr":"Lamai Beach Road / Lamai Night Market","time":"18:00","must":true,"info":{"d":"Jeden Sonntag ab dem späten Nachmittag bis ~22 Uhr; kleiner und lokaler als Fisherman's Village.","t":"Hunger mitbringen – hier wird nicht nur gebummelt, sondern gegessen."}}],"flow":[{"seg":"🧳 Vormittag · Check-out & Vorratseinkauf (ab ~11:00)"},{"about":{"t":"Umzugsvormittag","x":"Der Vormittag ist praktisch: um 11 Uhr auschecken, dann an der Ringstraße in Bophut die Großmärkte. Makro verkauft Großpackungen, Big C 800 m weiter Drogerie und Haushalt und hat einen klimatisierten Food Court. Gekauft wird nur, was die Hitze im Auto verträgt – Reis, Nudeln, Gewürze, Kaffee. Alles Frische und Kalte holt ihr erst in Lamai."}},0,{"tr":"🚗 Resort → Makro ~2,5 km (~6 Min)"},1,2,{"note":"💡 Mittag ~12:15–13:30: Big-C-Food-Court (klimatisiert)."},{"seg":"🏖️ Früher Nachmittag · Puffer bis zum Check-in (~13:30–15:00)"},{"about":{"t":"Die Küstenstraße nach Lamai","x":"Von Bophut führt die Ringstraße durch Chaweng und dann als Küstenstraße über die Felsen nach Süden. Zwischen Chaweng Noi und Lamai liegen kleine Buchten wie die Coral Cove, die man von der Straße aus erreicht. Ein kurzer Badestopp überbrückt die Zeit bis zum Check-in um 15 Uhr. Danach sind es nur noch rund zehn Minuten bis zur Villa."}},{"tr":"🚗 Bophut → Coral Cove über die Ringstraße 4169 via Chaweng ~10 km (~20–25 Min)"},3,{"tr":"🚗 Coral Cove → Villa ~5 km (~10–12 Min)"},4,{"note":"💡 15:00–16:30: ankommen, Villa erkunden, erster Sprung in den Infinity-Pool."},{"tr":"🚗 Villa → Tops Lamai ~2 km (~5 Min), danach alles in den Villa-Kühlschrank"},5,{"seg":"🌆 Abend · Lamai (ab ~18:00)"},{"about":{"t":"Über Lamai","x":"Lamai ist Samuis zweitgrößter Strandort an der Südostküste – entspannter und erwachsener als Chaweng, aber mit allem, was man braucht. Der Ortskern liegt hinter dem Nordteil des 4 km langen Strands; dort gibt es den Frischmarkt, viele Thai-Lokale und abends kleine Bars. Am Südende stehen die berühmten Felsen Hin Ta und Hin Yai. Die Villa liegt am Hang westlich darüber – ruhig, mit Blick, aber nicht zu Fuß am Strand."}},{"tr":"🚗 Villa → Lamai Zentrum ~1,5 km (~5 Min)"},6,{"dine":{"top":{"name":"Mr. Phu's Sea Food","why":"Seafood-Lokal ~270 m nördlich der Walking Street (OSM-Eintrag) – nach dem Marktbummel zu Fuß erreichbar; Öffnung und Preise zu prüfen.","addr":"Lamai Zentrum, nahe Lamai Walking Street","price":"€€"},"value":{"name":"Streetfood der Walking Street","why":"Spieße, Curry, Mango Sticky Rice direkt am Markt.","addr":"Lamai Beach Road","price":"€"},"insider":{"name":"Yai Ko (ร้านยายก้อ / DomDom)","why":"Thai-Lokal ~130 m von der Walking Street, laut OSM tgl. 11–23 Uhr – zu prüfen.","addr":"Had Lamai, nahe Walking Street","price":"€"}}},{"home":"Zurück zur Villa ~5 Min."}]},{"iso":"2026-12-28","dt":"Mo 28.12.","title":"Ausflug: Lamai Süd – Markt, roter Tempel, Felsen","route":{"walk":false,"drive":true,"mode":"🚗 Mietwagen · kurze Wege · halber Tag + Abend","lead":"Lamais Highlights liegen alle innerhalb von 3 km: Frischmarkt, der rote Tempel Wat Sila Ngu und die Felsen Hin Ta & Hin Yai am Vormittag, Siesta in der Villa, abends Aussicht und Seafood.","wxi":"🌤️"},"items":[{"nm":"Lamai Fresh Food Market","cat":"market","nt":"Lokaler Frischmarkt: Obst, Currypasten, Thai-Süßes","map":"Lamai Fresh Market","src":"v","ll":[9.47167,100.047],"addr":"Lamai Zentrum, Ringstraße","time":"10:00","info":{"d":"Der Alltagsmarkt der Einheimischen – Obst für die Villa und erste Kostproben.","t":"Kleingeld mitnehmen; vormittags am lebendigsten."}},{"nm":"Wat Sila Ngu (Wat Ratchathammaram)","cat":"temple","nt":"Rote Tempelhalle mit Reliefs aus gebranntem Ton","map":"Wat Sila Ngu Koh Samui","src":"v","ll":[9.45127,100.03083],"addr":"Hua Thanon/Lamai Süd, Ringstraße 4169","time":"10:45","must":true,"gem":true,"info":{"d":"Ungewöhnlich: die gesamte Ordinationshalle ist terrakottarot mit plastischen Reliefs – wenig besucht.","t":"Bedeckte Kleidung."}},{"nm":"Hin Ta & Hin Yai","cat":"sight","nt":"Berühmte Felsformationen am Südende von Lamai","map":"Hin Ta Hin Yai","src":"v","ll":[9.452,100.0397],"addr":"Südende Lamai Beach","time":"11:30","must":true,"info":{"d":"Zwei Felsen, die Volksglauben nach an ein altes Paar erinnern; kleine Souvenir- und Kokosstände am Weg.","t":"Bei hohem Wellengang Abstand halten – Felsen sind glatt."}},{"nm":"Lamai Viewpoint","cat":"view","nt":"Aussichtspunkt am Hang über Südlamai","map":"Lamai Viewpoint Koh Samui","src":"c","ll":[9.45875,100.03555],"addr":"Hang oberhalb von Lamai Süd","time":"16:30","info":{"d":"Blick über die Bucht von Lamai; Zufahrt steil, Eintritt/Öffnung zu prüfen.","t":"Nur bei klarem Wetter lohnend."}},{"nm":"Lamai Beach (Nordteil)","cat":"beach","nt":"Spätnachmittags am Strand – Badeteil im Norden","map":"Lamai Beach","src":"v","ll":[9.46242,100.05221],"addr":"Lamai Beach","noroute":true,"info":{"d":"Langer, heller Strand; bei Monsunwellen auf Flaggen achten.","t":"Zum Baden den Nordteil wählen; bei Rotflagge nur am Wasser entlang spazieren."}}],"flow":[{"seg":"☀️ Vormittag · Lamai Süd (ab ~10:00)"},{"about":{"t":"Über Lamai Süd und Hua Thanon","x":"Südlich des Lamai-Strands wird die Küste felsig. Hier liegen die Felsen Hin Ta und Hin Yai, über die sich Thais gern augenzwinkernd amüsieren. Dahinter beginnt Hua Thanon, ein muslimisches Fischerdorf mit bunten Holzbooten. Der rote Tempel Wat Sila Ngu an der Ringstraße ist eine der ungewöhnlichsten Tempelhallen der Insel. Alles liegt nah beieinander – ideal für einen gemütlichen Vormittag mit dem Auto."}},{"tr":"🚗 Villa → Lamai Zentrum ~1,5 km (~5 Min)"},0,{"tr":"🚗 ~2,5 km nach Süden (~6 Min)"},1,{"tr":"🚗 ~1 km zurück (~3 Min)"},2,{"seg":"🏠 Mittag · Hitze-Pause in der Villa (~12:30–16:00)"},{"about":{"t":"Mittag in der Villa","x":"Zwischen 12 und 16 Uhr steht die Sonne am höchsten – die beste Zeit, um nichts zu tun. Die Villa am Hang westlich von Lamai ist dafür gebaut: Infinity-Pool mit Blick über die Bucht, Terrasse, Garten und eine voll ausgestattete Küche. Ein schnelles Mittagessen aus dem Frischmarkt-Einkauf vom Vormittag – Obst, Currypaste, Reis – ist in zwanzig Minuten fertig. Danach Siesta im kühlen Schlafzimmer oder Lesen im Schatten. Wer doch raus will: Bis zum Lamai-Zentrum sind es nur fünf Fahrminuten."}},{"seg":"🌇 Spätnachmittag · Aussicht (ab ~16:30)"},{"about":{"t":"Lamai von oben und am Strand","x":"Am späten Nachmittag lässt die Hitze nach und das Licht wird weich. Vom Lamai Viewpoint am Hang über Südlamai überblickt ihr die ganze Bucht mit dem 4 km langen Strand; die Zufahrt ist steil, Eintritt und Öffnung sind zu prüfen. Weil Lamai nach Osten blickt, geht die Sonne hinter euch über den Bergen unter – das Meer färbt sich trotzdem schön. Danach lohnt ein Spaziergang am Nordteil des Strands, wo man auch baden kann. Zum Abendessen sind es von dort wenige Fahrminuten zum Seafood bei den Felsen am Südende."}},3,4,{"dine":{"top":{"name":"Sabienglae","why":"Lamais Seafood-Klassiker gleich bei Hin Ta Hin Yai; fangfrische Auslage am Eingang, ganzer gegrillter Snapper.","addr":"Südende Lamai","price":"€€"},"value":{"name":"Lamai Night Market (Garküchen)","why":"Abendliche Garküchen im Zentrum – günstig, lokal (Tage/Zeiten zu prüfen).","addr":"Lamai Zentrum","price":"€"},"insider":{"name":"Ta-Yai-Hut","why":"Kleines Lokal direkt bei den Felsen (OSM-Eintrag) – zu prüfen.","addr":"Hin Ta Hin Yai","price":"€"}}},{"home":"Zurück zur Villa ~5 Min."}]},{"iso":"2026-12-29","dt":"Di 29.12.","title":"Ausflug: Ang-Thong-Marinepark","route":{"walk":false,"drive":true,"mode":"⛵ Bootstour · ganzer Tag (Transfer inkl.)","lead":"Der Höhepunkt der Etappe: 42 Inseln aus Kalkstein, Kajak durch Buchten, Emerald Lake und Aussichtspunkt. Ganztägig mit Abholung – danach nur noch Pool und ein schnelles Abendessen.","wxi":"🌊","wx":"Der Park ist im Monsun ca. 1.11.–Mitte Dez. geschlossen und kann bei Sturm kurzfristig schließen. Ausweichtage 30.12. oder 06.01. (nicht 02.01. – dort liegt der Inland-Ausflug) – nur mit kostenloser Stornierung buchen."},"items":[{"nm":"Nathon Pier (Abfahrt Ang-Thong-Touren)","cat":"boat","nt":"Abholung im Hotel, Transfer zum Pier (je nach Anbieter)","map":"Nathon Pier Koh Samui","src":"c","ll":[9.53643,99.93204],"addr":"Nathon, Westküste","time":"08:30","info":{"d":"Viele Touren (z. B. Blue Stars) starten ab Nathon; andere ab Bophut/Bangrak – laut Buchung.","t":"Abholzeit am Vorabend beim Anbieter bestätigen lassen; Badesachen, Sonnenschutz und Bargeld für die Parkgebühr einpacken."}},{"nm":"Ko Wua Ta Lap","cat":"nature","nt":"Hauptinsel des Nationalparks: Strand, Aussichtspunkt Pha Jun Jaras","map":"Koh Wua Talab","src":"v","ll":[9.62458,99.67284],"addr":"Mu Ko Ang Thong National Park","must":true,"info":{"d":"Sitz der Parkverwaltung; der Aufstieg zum Aussichtspunkt ist steil (gutes Schuhwerk).","t":"Parkgebühr ca. 300 THB p. P. (laut Anbieterangabe; oft separat)."}},{"nm":"Ko Mae Ko · Emerald Lake (Thale Nai)","cat":"nature","nt":"Grüner Salzwassersee im Inselinneren, kurzer Aufstieg","map":"Koh Mae Koh Emerald Lake","src":"v","ll":[9.65408,99.66744],"addr":"Mu Ko Ang Thong National Park","must":true,"info":{"d":"Der Lagunensee ist das Wahrzeichen des Parks; Baden verboten.","t":"Der Weg zum Aussichtspunkt über dem See führt über steile Treppen – feste Sandalen statt Flip-Flops."}}],"flow":[{"warn":"Ausnahme von der 10-Uhr-Regel: Abholung an der Villa meist ~7:30–8:00, Ankunft am Pier Nathon ~8:30 (Lamai → Nathon ~35 Min), Rückkehr ~17–18 Uhr."},{"seg":"⛵ Ganzer Tag · Ang-Thong-Marinepark"},{"about":{"t":"Über den Ang-Thong-Marinepark","x":"Der Nationalpark „Goldene Schale“ liegt rund 30 km westlich von Samui und umfasst 42 meist unbewohnte Kalksteininseln mit Höhlen, Lagunen und weißen Buchten. Die Touren besuchen meist Ko Wua Ta Lap mit Aussichtspunkt und Ko Mae Ko mit dem grünen Binnensee. Dazu kommen Kajakfahren und Schnorcheln – die Sicht ist nach dem Monsun im Dezember allerdings noch nicht immer optimal. Speedboote sind schneller, aber laut und holprig; große Ausflugsboote mit Kajak (z. B. Blue Stars) sind gemächlicher und komfortabler."}},0,{"tr":"⛴️ Boot ~1,5–2 Std (Ausflugsboot) bzw. ~1 Std (Speedboot)"},1,2,{"tr":"⛴️ Rückfahrt + Transfer zur Villa"},{"seg":"🌙 Abend · nah an der Villa"},{"about":{"t":"Der Abend nach dem Bootstag","x":"Nach zehn Stunden Sonne, Salzwasser und Bootsfahrt ist man müder als gedacht – der Abend sollte kurz und nah sein. Rund um die Villa gibt es drei Wege: das kleine Thai-Lokal Laankao ein paar hundert Meter entfernt, den eigenen Grill in der Villa mit Fisch vom Frischmarkt oder, für etwas Besonderes, Dr Frogs auf dem Hügel über Chaweng Noi mit Blick aufs Meer. Wer selbst fährt, bleibt bei Wasser; nach dem Bootstag ist ohnehin ein frühes Bett die beste Wahl. Sonnencreme-Reste und Salz abduschen, Kamera-Akkus laden – morgen ist Ruhetag."}},{"dine":{"top":{"name":"Dr Frogs","why":"Italienisch-thailändisch auf dem Hügel über Chaweng Noi mit Meerblick; ~5 km von der Villa – zu prüfen.","addr":"Ringstraße, Chaweng Noi","price":"€€€"},"value":{"name":"Laankao","why":"Thai-Lokal 700 m von der Villa – nach dem Bootstag das kürzeste Ziel (zu prüfen).","addr":"Lamai","price":"€"},"insider":{"name":"Selbst kochen / Grill in der Villa","why":"Grill vorhanden: Fisch vom Lamai-Frischmarkt am Vortag kaufen.","addr":"Villa Clarisse","price":"€"}}},{"home":"Früh schlafen."}]},{"iso":"2026-12-30","dt":"Mi 30.12.","title":"Strand-/Freier Tag (Puffer Ang Thong)","route":{"walk":false,"drive":false,"mode":"🏖️ Strand-/freier Tag","lead":"Ruhetag vor Silvester – bei Wetterpech Ersatztermin für Ang Thong."},"items":[],"flow":[{"seg":"☀️ Vormittag · Vorschlag"},{"about":{"t":"Silver Beach und Markt","x":"Silver Beach, auf Thai Thong Takhian, ist eine kleine Bucht zwischen Felsen, rund zehn Minuten nördlich der Villa. Bei ruhiger See lässt sich direkt vom Strand aus an den Felsen schnorcheln. Auf dem Rückweg liegt der Lamai Fresh Food Market an der Ringstraße – dort Fisch und Garnelen für den Abend kaufen. Vormittags ist die Auswahl am größten, also nicht zu spät kommen."}},{"note":"🏖️ Silver Beach (Thong Takhian) zwischen Lamai und Chaweng: kleine Bucht mit Felsen, gutes Schnorcheln bei ruhiger See (~4 km, ~10 Min). Vorher Croissant und Kaffee bei La Fabrique Lamai (~800 m von der Villa; Zeiten zu prüfen). Bei Rotflagge: Villa-Pool."},{"note":"🐟 Rückweg ~12:00 über den Lamai Fresh Food Market (~5 Min vor der Villa): Fisch und Garnelen für den Grill, dazu Käse von der Fromagerie in Lamai Nord – gleich in den Villa-Kühlschrank. ⛵ Fiel Ang Thong am 29.12. aus, ist heute der erste Ersatztermin (zweiter: 06.01.)."},{"seg":"🌙 Abend · Vorschlag"},{"about":{"t":"Grillabend über Lamai","x":"Die Villa liegt am Hang über Lamai – von der Terrasse geht der Blick über die Bucht, während der Grill läuft. Vor Silvester ist das der bewusst stille Abend: selbst gekauft, selbst gegrillt, früh ins Bett. Holzkohle und Grillanzünder gibt es bei Tops Lamai, falls in der Villa nichts bereitliegt."}},{"note":"🔥 Grillabend in der Villa mit dem Fang vom Vormittag – der r
