name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/**'
      - 'index.html'
      - 'registerSW.js'
      - 'sw.js'
      - 'workbox-*.js'
      - 'manifest.webmanifest'
      - 'icon*.png'
      - 'icon.svg'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Dev index for Vite entry
        run: cp index.dev.html index.html

      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DEFAULT_TRIP_CODE: WILD2026

      - name: Copy content for fetch paths
        run: cp -r content dist/content

      - name: Publish dist to repo root (legacy Pages serves main/)
        run: |
          cp dist/index.html index.html
          rm -rf assets
          cp -r dist/assets assets
          cp dist/sw.js dist/manifest.webmanifest .
          cp dist/workbox-*.js .
          cp dist/icon*.png dist/icon.svg . 2>/dev/null || true

      - name: Commit production bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets sw.js manifest.webmanifest workbox-*.js icon-192.png icon-512.png icon.svg
          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "chore: deploy production bundle [skip ci]"
          git push
